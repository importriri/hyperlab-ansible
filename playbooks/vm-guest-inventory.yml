---
- name: Publish runtime inventory for one managed Linux guest
  hosts: hypervisor
  become: false
  gather_facts: false
  # The publication lock is released by a handler, also when a task fails.
  force_handlers: true
  environment:
    LC_ALL: C
  vars:
    guest_inventory_repository_root: "{{ playbook_dir | dirname }}"
    guest_inventory_plan_tool: >-
      {{ guest_inventory_repository_root }}/tools/guest_plan.py
    guest_inventory_address_tool: >-
      {{ guest_inventory_repository_root }}/tools/guest_agent_address.py
    guest_inventory_host_key_tool: >-
      {{ guest_inventory_repository_root }}/tools/guest_host_key.py
    guest_inventory_resource_profiles_file: >-
      {{ guest_inventory_repository_root }}/group_vars/all/vm-resource-profiles.yml
    guest_inventory_python_bin: /usr/bin/python
    guest_inventory_virsh_bin: /usr/bin/virsh
    guest_inventory_runtime_path: "/run/user/{{ guest_inventory_operator_uid }}"
    guest_inventory_mkdir_bin: /usr/bin/mkdir
    guest_inventory_rmdir_bin: /usr/bin/rmdir
    guest_inventory_lock_path: >-
      {{ guest_inventory_runtime_path }}/{{ guest_inventory_plan.name }}.inventory.lock
  tasks:
    # ADR 0018: after a new disposable boot, managed Start and Power Cycle
    # hand over the lock they took before the boot (roles/guest/tasks/main.yml).
    # From here this play owns it, so no other start crosses a stop/start
    # boundary until this boot's key is pinned and its inventory published.
    - name: Take over the publication lock of the boot just started
      when: guest_identity_lock_handover is defined
      ansible.builtin.debug:
        msg: "Holding {{ guest_identity_lock_handover }} until this boot is published."
      changed_when: true
      notify: Release the publication lock

    - name: Refuse a missing guest selector
      ansible.builtin.assert:
        that:
          - guest_spec is string
          - guest_spec | length > 0
        fail_msg: guest_spec must name one checked-in VM specification.

    - name: Build the deterministic guest plan without side effects
      ansible.builtin.command:
        argv:
          - "{{ guest_inventory_python_bin }}"
          - "{{ guest_inventory_plan_tool }}"
          - --root
          - "{{ guest_inventory_repository_root }}"
          - --spec
          - "{{ guest_spec }}"
          - --store
          - "{{ hyperlab_root }}"
          - --resource-profiles
          - "{{ guest_inventory_resource_profiles_file }}"
      register: guest_inventory_plan_command
      changed_when: false
      check_mode: false

    - name: Publish the deterministic guest plan
      ansible.builtin.set_fact:
        guest_inventory_plan: >-
          {{ guest_inventory_plan_command.stdout | from_json }}

    - name: Select the managed network contract
      ansible.builtin.set_fact:
        guest_inventory_network_matches: >-
          {{ network_domains
             | selectattr('name', 'equalto', guest_inventory_plan.network_profile)
             | list }}

    - name: Require one network and a QEMU Guest Agent guest
      ansible.builtin.assert:
        that:
          - guest_inventory_plan.os_family == 'linux'
          - guest_inventory_plan.cloud_init | bool
          - guest_inventory_plan.qemu_guest_agent | bool
          - guest_inventory_network_matches | length == 1
        fail_msg: >-
          Runtime Ansible inventory requires one managed Linux cloud-init guest
          with QEMU Guest Agent and one reviewed network contract.

    - name: Publish the selected network contract
      ansible.builtin.set_fact:
        guest_inventory_network: "{{ guest_inventory_network_matches | first }}"

    - name: Resolve the physical operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ guest_inventory_plan.owner }}"
        split: ':'

    - name: Publish the physical operator paths
      ansible.builtin.set_fact:
        guest_inventory_operator_uid: >-
          {{ ansible_facts.getent_passwd[guest_inventory_plan.owner][1] }}
        guest_inventory_operator_home: >-
          {{ ansible_facts.getent_passwd[guest_inventory_plan.owner][4] }}

    - name: Resolve the effective inventory publisher UID
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - -u
      register: guest_inventory_effective_uid
      changed_when: false
      check_mode: false

    - name: Require the physical operator to publish runtime inventory
      ansible.builtin.assert:
        that:
          - >-
            guest_inventory_effective_uid.stdout | int ==
            guest_inventory_operator_uid | int
        fail_msg: >-
          Runtime inventory must be published by the guest owner. Re-run as
          {{ guest_inventory_plan.owner }} without privilege escalation.

    - name: Inspect the private runtime directory
      ansible.builtin.stat:
        path: "{{ guest_inventory_runtime_path }}"
      register: guest_inventory_runtime_dir

    - name: Inspect strict SSH controller inputs
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ guest_inventory_operator_home }}/.ssh/hyperlab_ed25519"
        - "{{ guest_inventory_operator_home }}/.ssh/known_hosts"
      register: guest_inventory_ssh_inputs

    - name: Refuse unsafe runtime or SSH controller inputs
      ansible.builtin.assert:
        that:
          - guest_inventory_runtime_dir.stat.isdir | default(false)
          - not (guest_inventory_runtime_dir.stat.islnk | default(false))
          - guest_inventory_runtime_dir.stat.pw_name == guest_inventory_plan.owner
          - guest_inventory_ssh_inputs.results | length == 2
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == guest_inventory_plan.owner
        fail_msg: >-
          Runtime inventory requires the operator-owned runtime directory,
          private SSH identity and strict known-hosts database.
        quiet: true
      loop: "{{ guest_inventory_ssh_inputs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect the publication lock handed over by the lifecycle
      when: guest_identity_lock_handover is defined
      ansible.builtin.stat:
        path: "{{ guest_identity_lock_handover }}"
        follow: false
      register: guest_inventory_lock_handed

    - name: Require the handed-over lock to be this Machine's
      when: guest_identity_lock_handover is defined
      ansible.builtin.assert:
        that:
          - guest_identity_lock_handover == guest_inventory_lock_path
          - guest_inventory_lock_handed.stat.isdir | default(false)
          - not (guest_inventory_lock_handed.stat.islnk | default(false))
          - guest_inventory_lock_handed.stat.pw_name == guest_inventory_plan.owner
        fail_msg: >-
          The lifecycle handed over {{ guest_identity_lock_handover }}, not this
          Machine's owner-held publication lock {{ guest_inventory_lock_path }}.

    # Run on its own (after create or reset), this play takes the lock
    # itself, so a managed Start or Power Cycle of the Machine waits for it.
    - name: Acquire the publication lock for a publication on its own
      when:
        - guest_identity_lock_handover is not defined
        - not ansible_check_mode
      ansible.builtin.command:
        argv:
          - "{{ guest_inventory_mkdir_bin }}"
          - "{{ guest_inventory_lock_path }}"
      register: guest_inventory_lock_acquire
      changed_when: guest_inventory_lock_acquire.rc == 0
      failed_when: false
      notify: Release the publication lock

    - name: Refuse a publication while a start or another publication runs
      when:
        - guest_identity_lock_handover is not defined
        - not ansible_check_mode
      ansible.builtin.assert:
        that:
          - guest_inventory_lock_acquire.rc == 0
        fail_msg: >-
          {{ guest_inventory_plan.name }} is being started or published right
          now ({{ guest_inventory_lock_path }} exists). Retry when that ends;
          inspect a lock that outlives it before removing it.

    - name: Resolve the unique managed guest address through QEMU Guest Agent
      ansible.builtin.command:
        argv:
          - "{{ guest_inventory_python_bin }}"
          - "{{ guest_inventory_address_tool }}"
          - --virsh-bin
          - "{{ guest_inventory_virsh_bin }}"
          - --domain
          - "{{ guest_inventory_plan.name }}"
          - --mac
          - "{{ guest_inventory_plan.mac }}"
          - --network
          - "{{ guest_inventory_network.subnet }}"
      register: guest_inventory_address
      changed_when: false
      check_mode: false

    # Every disposable boot generates new SSH host keys, as does a new Machine.
    # The key is read over the hypervisor's QEMU Guest Agent channel, never
    # accepted from the network, and pinned to the address just resolved;
    # a stale key for a reused address is replaced.
    - name: Read the guest SSH host key through QEMU Guest Agent
      ansible.builtin.command:
        argv:
          - "{{ guest_inventory_python_bin }}"
          - "{{ guest_inventory_host_key_tool }}"
          - --virsh-bin
          - "{{ guest_inventory_virsh_bin }}"
          - --domain
          - "{{ guest_inventory_plan.name }}"
          - --address
          - "{{ guest_inventory_address.stdout }}"
      register: guest_inventory_host_key
      changed_when: false
      check_mode: false

    - name: Pin the guest SSH host key for strict checking
      ansible.builtin.known_hosts:
        path: "{{ guest_inventory_operator_home }}/.ssh/known_hosts"
        name: "{{ guest_inventory_address.stdout }}"
        key: "{{ guest_inventory_host_key.stdout }}"
        hash_host: false
        state: present

    - name: Build the strict runtime workstation inventory record
      ansible.builtin.set_fact:
        guest_inventory_host_record: >-
          {{
            [
              guest_inventory_plan.name,
              'ansible_host=' ~ guest_inventory_address.stdout,
              'ansible_user=' ~ guest_cloud_init_user,
              'ansible_ssh_private_key_file=' ~
              guest_inventory_operator_home ~ '/.ssh/hyperlab_ed25519',
              'ansible_ssh_use_tty=false',
              "ansible_ssh_common_args='-o BatchMode=yes " ~
              '-o StrictHostKeyChecking=yes ' ~
              '-o UserKnownHostsFile=' ~ guest_inventory_operator_home ~
              "/.ssh/known_hosts -o IdentitiesOnly=yes'"
            ] | join(' ')
          }}

    - name: Publish the strict runtime workstation inventory
      ansible.builtin.copy:
        content: |
          [workstations]
          {{ guest_inventory_host_record }}
        dest: >-
          {{ guest_inventory_runtime_path }}/{{ guest_inventory_plan.name }}.ini
        owner: "{{ guest_inventory_plan.owner }}"
        mode: '0600'

  handlers:
    - name: Release the publication lock
      ansible.builtin.command:
        argv:
          - "{{ guest_inventory_rmdir_bin }}"
          - "{{ guest_identity_lock_handover | default(guest_inventory_lock_path) }}"
      changed_when: true
