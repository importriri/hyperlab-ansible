# swaylock - Catppuccin Mocha. Plain swaylock from extra: no blur, no
# screenshot effects (those live in swaylock-effects, which is AUR).
daemonize
ignore-empty-password
indicator-caps-lock
indicator-radius=100
indicator-thickness=8
image=/usr/share/backgrounds/privatestack/mocha.png
scaling=fill
font=JetBrainsMono Nerd Font
color=1e1e2e
inside-color=1e1e2ecc
inside-clear-color=f9e2afcc
inside-ver-color=89b4facc
inside-wrong-color=f38ba8cc
ring-color=cba6f7
ring-clear-color=f9e2af
ring-ver-color=89b4fa
ring-wrong-color=f38ba8
key-hl-color=b4befe
bs-hl-color=f38ba8
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=cdd6f4
text-clear-color=1e1e2e
text-ver-color=1e1e2e
text-wrong-color=1e1e2e
