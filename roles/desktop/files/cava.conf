# cava - interactive visualiser (run `cava` in a terminal).
# The bar strip uses cava-waybar.conf instead: different output mode.
[general]
framerate = 60
autosens = 1
bars = 0

[input]
# pipewire-pulse ships with the brick; cava's pulse backend talks to it.
method = pulse
source = auto

[output]
method = ncurses
channels = stereo

[color]
gradient = 1
gradient_color_1 = '#94e2d5'
gradient_color_2 = '#89dceb'
gradient_color_3 = '#74c7ec'
gradient_color_4 = '#89b4fa'
gradient_color_5 = '#b4befe'
gradient_color_6 = '#cba6f7'
gradient_color_7 = '#f5c2e7'
gradient_color_8 = '#f38ba8'

[smoothing]
noise_reduction = 45
