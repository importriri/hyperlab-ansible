---
# foundation.yml keeps a recovery host blind (TTY). This role is mounted by
# lab.yml when the laptop needs its local Sway cockpit and Looking Glass client
# path.
#
# The host desktop uses the iGPU. The dGPU remains owned by the VFIO handoff
# policy, so desktop convenience cannot silently take the passthrough device.
# Sway comes from the official Arch repositories; no desktop fork is required.
#
# Per-machine input
# These values are fallbacks. A recorded hardware profile can override them
# without putting laptop-specific assumptions in sway.config.
#
# HyperLab checkout
# hyperlabctl reads checked-in policy, so the installed wrapper points at the
# local checkout instead of copying repository code into /usr/local.
host_desktop_sway_hyperlab_checkout: "/home/{{ admin_user }}/hyperlab-ansible"

host_desktop_sway_input_defaults:
  keyboard_layout: it
  keyboard_layout_cycle:
    - it
    - us
    - ara
  keyboard_variant: ""
  keyboard_options: ""
  # Optional hardware-profile binding. Generic hosts and guests render none.
  theme_cycle_binding: null
  touchpad:
    dwt: enabled
    middle_emulation: enabled
    natural_scroll: enabled
    tap: enabled

host_desktop_sway_removed_packages:
  - yazi
  - cava
  - superfile

host_desktop_sway_packages:
  # Sway shell
  - sway
  - swaybg
  - swayidle
  - swaylock
  - waybar
  - rofi
  - foot
  - gtk4
  - gtk4-layer-shell
  - python-gobject
  - virt-viewer
  - mako
  - grim
  - slurp
  - wl-clipboard

  # File management and removable/network storage
  - nemo
  - gvfs
  - gvfs-mtp
  - gvfs-smb
  - gvfs-nfs
  - udisks2
  - file-roller
  - ffmpegthumbnailer

  # Multimedia and PipeWire
  - ffmpeg
  - mpv
  - celluloid
  - pavucontrol
  - pipewire
  - pipewire-audio
  - pipewire-alsa
  - pipewire-pulse
  - wireplumber
  - gst-plugin-pipewire
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-plugins-ugly
  - gst-libav
  - rtkit
  - alsa-utils
  - pamixer
  - playerctl

  # Intel iGPU userspace. The NVIDIA dGPU remains VFIO-owned.
  - mesa
  - vulkan-intel
  - vulkan-tools
  - intel-media-driver
  - libva-utils

  # Desktop integration
  - xdg-desktop-portal-wlr
  - xdg-desktop-portal-gtk
  - xdg-user-dirs
  - brightnessctl
  - polkit
  - papirus-icon-theme
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - ly

  # Shell and diagnostics
  - starship
  - zoxide
  - fzf
  - eza
  - bat
  - ripgrep
  - fd
  - jq
  - wayland-utils
  - btop

# Files copied into both read-only runtime palette pools. The active theme is a
# user-owned copy selected by privatestack-theme.
host_desktop_sway_palette_runtime_fragments:
  - hyperlab-palette-gtk.css
  - hyperlab-palette-waybar.css
  - hyperlab-palette.sway
  - hyperlab-palette.rasi
  - hyperlab-palette-foot.ini
  - hyperlab-palette-swaylock.conf


# Ly 1.x accepts 24-bit 0xSSRRGGBB values. Only these documented keys are
# changed in the package-managed config; every other package default survives.
host_desktop_sway_ly_palettes:
  green:
    bg: "0x000C1512"
    fg: "0x00DCF3E4"
    border_fg: "0x017EE787"
    error_bg: "0x00111D18"
    error_fg: "0x01FF668F"
    accent2: "0x0035E4DD"
    box_title: "HyperLab Green"
  violet:
    bg: "0x000A0A16"
    fg: "0x00E2E0FF"
    border_fg: "0x019D6CFF"
    error_bg: "0x0012122A"
    error_fg: "0x01FF668F"
    accent2: "0x0043D8FF"
    box_title: "HyperLab Violet"
  blue:
    bg: "0x0008131F"
    fg: "0x00DEEFFF"
    border_fg: "0x014DA3FF"
    error_bg: "0x000D1C2B"
    error_fg: "0x01FF6B7A"
    accent2: "0x0055D6FF"
    box_title: "HyperLab Blue"
  red:
    bg: "0x00180B0D"
    fg: "0x00FFE7E9"
    border_fg: "0x01FF5D6C"
    error_bg: "0x00241013"
    error_fg: "0x01FF3D5A"
    accent2: "0x00FF9F43"
    box_title: "HyperLab Red"
