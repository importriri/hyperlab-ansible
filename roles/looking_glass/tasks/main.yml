---
- name: Install the build stack and the client runtime
  community.general.pacman:
    name: "{{ looking_glass_packages }}"
    state: present

- name: Refuse without the QEMU system user (a udev OWNER that resolves)
  ansible.builtin.getent:
    database: passwd
    key: "{{ looking_glass_qemu_user }}"

- name: Clone Looking Glass at the pinned commit
  ansible.builtin.git:
    repo: "{{ looking_glass_repo }}"
    dest: "{{ looking_glass_src }}"
    version: "{{ looking_glass_commit }}"
    recursive: true

- name: Resolve the pinned checkout to its full commit
  ansible.builtin.command:
    argv: [git, -C, "{{ looking_glass_src }}", rev-parse, HEAD]
  register: looking_glass_resolved_commit
  changed_when: false
  check_mode: false

- name: Resolve the client-visible build identity
  ansible.builtin.command:
    argv: [git, -C, "{{ looking_glass_src }}", describe, --always, --long, --abbrev=10]
  register: looking_glass_resolved_build
  changed_when: false
  check_mode: false

- name: Refuse a checkout whose identity differs from the contract
  ansible.builtin.assert:
    that:
      - looking_glass_resolved_commit.stdout | trim == looking_glass_commit
      - looking_glass_resolved_build.stdout | trim == looking_glass_build
    fail_msg: >-
      Looking Glass pin mismatch. Requested full commit
      {{ looking_glass_commit }}, resolved
      {{ looking_glass_resolved_commit.stdout | trim }}, client-visible build
      {{ looking_glass_resolved_build.stdout | trim }}, expected
      {{ looking_glass_build }}.

- name: Check whether kvmfr is already registered with dkms
  ansible.builtin.command: dkms status -m kvmfr
  register: looking_glass_dkms
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build and install the kvmfr module through dkms
  ansible.builtin.command:
    cmd: dkms install .
    chdir: "{{ looking_glass_src }}/module"
  register: looking_glass_dkms_install
  changed_when: looking_glass_dkms_install.rc == 0
  when: "'kvmfr' not in looking_glass_dkms.stdout"

- name: Inspect whether kvmfr is already loaded
  ansible.builtin.stat:
    path: /sys/module/kvmfr
  register: looking_glass_kvmfr_loaded

- name: Inspect the pre-existing kvmfr device
  ansible.builtin.stat:
    path: "{{ looking_glass_device }}"
    follow: false
  register: looking_glass_kvmfr_device_before

- name: Refuse a stale regular kvmfr path before runtime reconciliation
  ansible.builtin.assert:
    that:
      - >-
        not (looking_glass_kvmfr_device_before.stat.exists | default(false))
        or (looking_glass_kvmfr_device_before.stat.ischr | default(false))
    fail_msg: >-
      {{ looking_glass_device }} already exists but is not the kvmfr character
      device. Stop every VM using the path, remove the stale regular file and
      reconcile the Looking Glass transport before continuing.

- name: Read the loaded kvmfr shared-memory size through its ioctl
  when:
    - looking_glass_kvmfr_loaded.stat.exists | default(false)
    - looking_glass_kvmfr_device_before.stat.ischr | default(false)
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.python.executable }}"
      - "{{ looking_glass_kvmfr_size_tool }}"
      - --device
      - "{{ looking_glass_device }}"
  register: looking_glass_kvmfr_size_command
  changed_when: false
  check_mode: false

- name: Decide whether the loaded kvmfr transport needs a real reload
  ansible.builtin.set_fact:
    looking_glass_kvmfr_reload_required: >-
      {{
        looking_glass_kvmfr_loaded.stat.exists | default(false)
        and (
          not (looking_glass_kvmfr_device_before.stat.exists | default(false))
          or (
            looking_glass_kvmfr_size_command.stdout | default('0') | trim | int
            != (looking_glass_shm_mb | int) * 1024 * 1024
          )
        )
      }}

- name: Size the shared memory from the frame geometry
  ansible.builtin.template:
    src: kvmfr.conf.j2
    dest: /etc/modprobe.d/kvmfr.conf
    owner: root
    group: root
    mode: "0644"

- name: Resolve kvmfr for the running kernel before a required reload
  when: looking_glass_kvmfr_reload_required | bool
  ansible.builtin.command:
    argv:
      - modinfo
      - -k
      - "{{ ansible_kernel }}"
      - kvmfr
  register: looking_glass_kvmfr_modinfo
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a kvmfr reload across a stale running-kernel module tree
  when: looking_glass_kvmfr_reload_required | bool
  ansible.builtin.assert:
    that:
      - looking_glass_kvmfr_modinfo.rc == 0
    fail_msg: >-
      The loaded kvmfr transport must change size, but kvmfr cannot be resolved
      for the running kernel {{ ansible_kernel }}. This commonly means the
      kernel packages were upgraded without rebooting. Reboot into the installed
      kernel before retrying; the role will not unload the live module blindly.

- name: Inspect users of kvmfr before a required reload
  when:
    - looking_glass_kvmfr_reload_required | bool
    - looking_glass_kvmfr_device_before.stat.ischr | default(false)
  ansible.builtin.command:
    argv:
      - fuser
      - "{{ looking_glass_device }}"
  register: looking_glass_kvmfr_users
  changed_when: false
  failed_when: looking_glass_kvmfr_users.rc not in [0, 1]
  check_mode: false

- name: Refuse to resize kvmfr while the live device is in use
  when:
    - looking_glass_kvmfr_reload_required | bool
    - looking_glass_kvmfr_device_before.stat.ischr | default(false)
  ansible.builtin.assert:
    that:
      - looking_glass_kvmfr_users.rc == 1
    fail_msg: >-
      {{ looking_glass_device }} is in use by PID(s)
      {{ looking_glass_kvmfr_users.stdout | trim }}. Stop the VM or client that
      owns the shared-memory device before changing its runtime size.

- name: Unload kvmfr only for a verified runtime size change
  when: looking_glass_kvmfr_reload_required | bool
  community.general.modprobe:
    name: kvmfr
    state: absent

- name: Load kvmfr with the reconciled runtime size
  when: looking_glass_kvmfr_reload_required | bool
  community.general.modprobe:
    name: kvmfr
    state: present

- name: Retrigger the recreated kvmfr device after a runtime size change
  when: looking_glass_kvmfr_reload_required | bool
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --subsystem-match=kvmfr
      - --action=change
  changed_when: true

- name: Load kvmfr at boot
  ansible.builtin.copy:
    content: "kvmfr\n"
    dest: /etc/modules-load.d/kvmfr.conf
    owner: root
    group: root
    mode: "0644"

- name: Own the device node - QEMU writes it, the session reads it
  ansible.builtin.template:
    src: 70-kvmfr.rules.j2
    dest: /etc/udev/rules.d/70-kvmfr.rules
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload the udev rules
    - Retrigger the kvmfr device

- name: Load kvmfr now (modules-load.d only fires at boot)
  community.general.modprobe:
    name: kvmfr
    state: present

- name: Inspect the kvmfr node after loading the module
  ansible.builtin.stat:
    path: "{{ looking_glass_device }}"
    follow: false
  register: looking_glass_device_stat

- name: Refuse a missing or stale regular kvmfr path
  ansible.builtin.assert:
    that:
      - looking_glass_device_stat.stat.exists | default(false)
      - looking_glass_device_stat.stat.ischr | default(false)

- name: Inspect the libvirt QEMU policy file
  ansible.builtin.stat:
    path: "{{ looking_glass_qemu_conf }}"
    follow: false
  register: looking_glass_qemu_conf_stat

- name: Refuse a missing or redirected libvirt QEMU policy file
  ansible.builtin.assert:
    that:
      - looking_glass_qemu_conf_stat.stat.exists | default(false)
      - looking_glass_qemu_conf_stat.stat.isreg | default(false)
      - not (looking_glass_qemu_conf_stat.stat.islnk | default(false))
    fail_msg: >-
      Looking Glass requires one regular libvirt QEMU configuration file at
      {{ looking_glass_qemu_conf }} before KVMFR cgroup policy can be managed.

- name: Read the current libvirt QEMU policy
  ansible.builtin.slurp:
    src: "{{ looking_glass_qemu_conf }}"
  register: looking_glass_qemu_conf_raw

- name: Publish the current libvirt QEMU policy text
  ansible.builtin.set_fact:
    looking_glass_qemu_conf_text: >-
      {{ looking_glass_qemu_conf_raw.content | b64decode }}

- name: Count active libvirt cgroup device ACL assignments
  ansible.builtin.set_fact:
    looking_glass_qemu_acl_active_count: >-
      {{ looking_glass_qemu_conf_text
         | regex_findall('(?m)^[ \t]*cgroup_device_acl[ \t]*=')
         | length }}
    looking_glass_qemu_acl_managed: >-
      {{ '# BEGIN PRIVATESTACK KVMFR CGROUP ACL'
         in looking_glass_qemu_conf_text
         and '# END PRIVATESTACK KVMFR CGROUP ACL'
         in looking_glass_qemu_conf_text }}

- name: Refuse an unmanaged libvirt cgroup device ACL
  ansible.builtin.assert:
    that:
      - >-
        looking_glass_qemu_acl_active_count | int == 0
        or
        (looking_glass_qemu_acl_active_count | int == 1
         and looking_glass_qemu_acl_managed | bool)
    fail_msg: >-
      {{ looking_glass_qemu_conf }} already has an active administrator-owned
      cgroup_device_acl. Refusing to replace or shadow an unknown device policy.

- name: Inspect required libvirt shared devices
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ looking_glass_cgroup_required_devices }}"
  register: looking_glass_cgroup_required_stats

- name: Require every core libvirt shared device
  ansible.builtin.assert:
    that:
      - >-
        looking_glass_cgroup_required_stats.results
        | selectattr('stat.exists', 'equalto', false)
        | list
        | length == 0
      - >-
        looking_glass_cgroup_required_stats.results
        | selectattr('stat.ischr', 'equalto', false)
        | list
        | length == 0
    fail_msg: >-
      A required QEMU character device is missing. Refusing to replace
      libvirt's implicit device policy with an incomplete explicit ACL.

- name: Inspect optional libvirt shared devices
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ looking_glass_cgroup_optional_devices }}"
  register: looking_glass_cgroup_optional_stats

- name: Build the explicit KVMFR cgroup device ACL
  ansible.builtin.set_fact:
    looking_glass_cgroup_acl_devices: >-
      {{ looking_glass_cgroup_required_devices
         + (looking_glass_cgroup_optional_stats.results
            | selectattr('stat.exists')
            | map(attribute='item')
            | list)
         + [looking_glass_device] }}

- name: Allow the confined QEMU process to open KVMFR
  ansible.builtin.blockinfile:
    path: "{{ looking_glass_qemu_conf }}"
    marker: "# {mark} PRIVATESTACK KVMFR CGROUP ACL"
    block: |
      cgroup_device_acl = [
      {% for device in looking_glass_cgroup_acl_devices %}
          "{{ device }}"{% if not loop.last %},{% endif %}
      {% endfor %}
      ]
  notify:
    - Restart libvirtd for KVMFR cgroup policy

- name: Own the stamp directory
  ansible.builtin.file:
    path: "{{ looking_glass_stamp | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the build stamp
  ansible.builtin.slurp:
    src: "{{ looking_glass_stamp }}"
  register: looking_glass_stamp_read
  failed_when: false
  changed_when: false

- name: Parse the installed build stamp
  ansible.builtin.set_fact:
    looking_glass_stamp_data: >-
      {{ (looking_glass_stamp_read.content | b64decode | from_yaml)
         if looking_glass_stamp_read.content is defined else {} }}

- name: Decide whether the installed client matches the resolved pin
  ansible.builtin.set_fact:
    looking_glass_build_needed: >-
      {{ looking_glass_stamp_data.requested_commit | default('') != looking_glass_commit
         or looking_glass_stamp_data.resolved_commit | default('') !=
            (looking_glass_resolved_commit.stdout | trim)
         or looking_glass_stamp_data.build | default('') != looking_glass_build
         or looking_glass_stamp_data.input_patch_sha256 | default('') !=
            looking_glass_input_patch_sha256 }}

- name: Build and install the client from the pinned checkout
  when: looking_glass_build_needed | bool
  block:
    - name: Make the build directory
      ansible.builtin.file:
        path: "{{ looking_glass_src }}/client/build"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Build with the reviewed captured-input compatibility patch
      block:
        - name: Require clean pinned client input source before patching
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ looking_glass_src }}"
              - status
              - --porcelain
              - --untracked-files=no
              - --
              - "{{ looking_glass_input_patch_target }}"
          register: looking_glass_input_source_status
          changed_when: false

        - name: Refuse unexpected changes in the pinned client input source
          ansible.builtin.assert:
            that:
              - looking_glass_input_source_status.stdout | trim | length == 0
            fail_msg: >-
              The pinned Looking Glass client input source has unreviewed local
              changes. Preserve or review them before applying the captured-input
              compatibility patch.

        - name: Stage the reviewed captured-input compatibility patch
          ansible.builtin.copy:
            src: "{{ looking_glass_input_patch }}"
            dest: "{{ looking_glass_input_patch_remote }}"
            owner: root
            group: root
            mode: "0600"

        - name: Inspect the staged captured-input compatibility patch
          ansible.builtin.stat:
            path: "{{ looking_glass_input_patch_remote }}"
            checksum_algorithm: sha256
          register: looking_glass_input_patch_stat

        - name: Require the exact reviewed captured-input compatibility patch
          ansible.builtin.assert:
            that:
              - >-
                looking_glass_input_patch_stat.stat.checksum ==
                looking_glass_input_patch_sha256
            fail_msg: >-
              The staged Looking Glass captured-input compatibility patch differs
              from the bytes validated against the pinned client source.

        - name: Require the captured-input patch to match the pinned source
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ looking_glass_src }}"
              - apply
              - --check
              - "{{ looking_glass_input_patch_remote }}"
          changed_when: false

        - name: Apply the reviewed captured-input compatibility patch
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ looking_glass_src }}"
              - apply
              - "{{ looking_glass_input_patch_remote }}"
          register: looking_glass_input_patch_apply
          changed_when: true

        - name: Configure the client build
          ansible.builtin.command:
            cmd: cmake -DENABLE_X11=no -DENABLE_WAYLAND=yes -DENABLE_LIBDECOR=yes ../
            chdir: "{{ looking_glass_src }}/client/build"
          changed_when: true

        - name: Compile the client
          ansible.builtin.command:
            cmd: make -j{{ ansible_facts['processor_vcpus'] | default(2) }}
            chdir: "{{ looking_glass_src }}/client/build"
          changed_when: true

        - name: Install the client
          ansible.builtin.command:
            cmd: make install
            chdir: "{{ looking_glass_src }}/client/build"
          changed_when: true

      always:
        - name: Restore the pinned client input source after the transient patch
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ looking_glass_src }}"
              - checkout
              - --
              - "{{ looking_glass_input_patch_target }}"
          changed_when: false
          when:
            - looking_glass_input_patch_apply is defined
            - looking_glass_input_patch_apply.rc | default(1) == 0

        - name: Remove the transient captured-input compatibility patch
          ansible.builtin.file:
            path: "{{ looking_glass_input_patch_remote }}"
            state: absent

    - name: Stamp the requested pin and the observed build identity
      ansible.builtin.copy:
        content: |-
          requested_commit: {{ looking_glass_commit }}
          resolved_commit: {{ looking_glass_resolved_commit.stdout | trim }}
          build: {{ looking_glass_build }}
          input_patch_sha256: {{ looking_glass_input_patch_sha256 }}
        dest: "{{ looking_glass_stamp }}"
        owner: root
        group: root
        mode: "0644"

- name: Create the client configuration directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/looking-glass"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Deploy the client configuration
  ansible.builtin.template:
    src: client.ini.j2
    dest: "/home/{{ admin_user }}/.config/looking-glass/client.ini"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

- name: Record that the looking_glass brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: looking_glass

- name: Install the private SPICE runtime directory policy
  ansible.builtin.template:
    src: hyperlab-spice.tmpfiles.j2
    dest: "{{ looking_glass_spice_tmpfiles_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Reconcile the private SPICE runtime directory
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-tmpfiles
      - --create
      - "{{ looking_glass_spice_tmpfiles_path }}"
  changed_when: false
  check_mode: false
