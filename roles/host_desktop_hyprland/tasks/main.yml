---
- name: Keep host Hyprland configuration side-by-side and inactive
  ansible.builtin.assert:
    that:
      - "'hypervisor' in group_names"
      - "'workstations' not in group_names"
      - admin_user is string
      - admin_user | length > 0
      - admin_user != 'root'
      - host_desktop_hyprland_phase == 'non-active-config'
      - host_desktop_hyprland_config_install_enabled
      - not host_desktop_hyprland_runtime_enabled
      - not host_desktop_hyprland_session_activation_enabled
      - not host_desktop_hyprland_manage_ly
      - host_desktop_hyprland_preserve_sway_fallback
      - host_desktop_hyprland_preserve_waybar_fallback
    fail_msg: >-
      The non-active configuration phase may install reviewed user config
      only. It may not activate Hyprland, change Ly, or replace the proven
      Sway/Waybar recovery surfaces.

- name: Validate the official Hyprland prerequisite package contract
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_hyprland_prerequisite_packages
        ==
        [
          'hyprland',
          'hypridle',
          'hyprlock',
          'hyprpaper',
          'hyprshutdown',
          'hyprpolkitagent',
          'xdg-desktop-portal',
          'xdg-desktop-portal-hyprland',
          'xdg-desktop-portal-gtk'
        ]
      - "'quickshell' not in host_desktop_hyprland_prerequisite_packages"
      - "'uwsm' not in host_desktop_hyprland_prerequisite_packages"
      - host_desktop_hyprland_input_defaults.keyboard_layout == 'it'
      - >-
        host_desktop_hyprland_input_defaults.keyboard_layout_cycle
        == ['it', 'us', 'ara']
    fail_msg: >-
      Host Hyprland prerequisites no longer match the reviewed official-package
      and input baseline.

- name: Validate host-owned trust semantics
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_trust_contract.owner == 'host'
      - not host_desktop_hyprland_trust_contract.guest_self_assignment
      - host_desktop_hyprland_trust_contract.classes.clean.level == 3
      - host_desktop_hyprland_trust_contract.classes.dev.level == 2
      - host_desktop_hyprland_trust_contract.classes.dirty.level == 1
      - host_desktop_hyprland_trust_contract.classes.lab.level == 0
      - >-
        not
        host_desktop_hyprland_trust_contract.classes.services.gpu_trust_rung
      - >-
        host_desktop_hyprland_trust_contract
        .dirty_seamless_window_requires_host_badge
    fail_msg: >-
      Host Hyprland presentation may consume trust identity but may not weaken,
      redefine or delegate the HyperLab trust contract.

- name: Validate the Quickshell boundary before implementation
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_shell_target.primary == 'quickshell'
      - host_desktop_hyprland_shell_target.phase == 2
      - not host_desktop_hyprland_shell_target.fake_controls_allowed
      - >-
        host_desktop_hyprland_shell_target.backend_authority
        == ['hyperlabctl', 'specs', 'contracts']
    fail_msg: >-
      Quickshell is a later presentation layer. It must not invent backend
      state or become an operational authority.

- name: Install the official Host Hyprland prerequisite stack
  community.general.pacman:
    name: "{{ host_desktop_hyprland_prerequisite_packages }}"
    state: present

- name: Read installed package facts after prerequisite installation
  ansible.builtin.package_facts:
    manager: auto
  when: not ansible_check_mode

- name: Verify every Host Hyprland prerequisite package is installed
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: >-
      Required Host Hyprland prerequisite package {{ item }} is not installed.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_packages }}"
  when: not ansible_check_mode

- name: Inspect package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: host_desktop_hyprland_prerequisite_path_stats
  loop: "{{ host_desktop_hyprland_prerequisite_paths }}"
  loop_control:
    label: "{{ item.path }}"
  when: not ansible_check_mode

- name: Verify package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - >-
        (not item.item.executable)
        or (item.stat.executable | default(false))
    fail_msg: >-
      Required Host Hyprland package artifact {{ item.item.path }} is missing
      or has an invalid executable contract.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_path_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not ansible_check_mode

- name: Inspect the Host Hyprland config directory before installation
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_config_dir }}"
    follow: false
  register: host_desktop_hyprland_config_dir_before

- name: Inspect the persisted HyperLab theme
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_theme_state_file }}"
    follow: false
  register: host_desktop_hyprland_theme_state

- name: Read the persisted HyperLab theme
  ansible.builtin.slurp:
    src: "{{ host_desktop_hyprland_theme_state_file }}"
  register: host_desktop_hyprland_theme_content
  when: host_desktop_hyprland_theme_state.stat.exists | default(false)

- name: Resolve the active Host Hyprland palette
  ansible.builtin.set_fact:
    host_desktop_hyprland_active_theme: >-
      {{
        (
          host_desktop_hyprland_theme_content.content
          | b64decode
          | trim
        )
        if
          (host_desktop_hyprland_theme_state.stat.exists | default(false))
        else
          host_desktop_hyprland_palette_fallback
      }}

- name: Refuse an unknown persisted Host Hyprland palette
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_hyprland_active_theme
        in host_desktop_hyprland_palette_variants
    fail_msg: >-
      Persisted HyperLab theme
      {{ host_desktop_hyprland_active_theme }}
      is not a reviewed Host Hyprland palette.

- name: Inspect the selected Host Hyprland palette source
  ansible.builtin.stat:
    path: >-
      {{ host_desktop_hyprland_palette_root }}/{{ host_desktop_hyprland_active_theme }}/hyperlab-palette-hyprland.lua
    follow: false
  register: host_desktop_hyprland_palette_source

- name: Require the selected Host Hyprland palette source
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_palette_source.stat.exists | default(false)
      - host_desktop_hyprland_palette_source.stat.isreg | default(false)
      - host_desktop_hyprland_palette_source.stat.readable | default(false)
    fail_msg: >-
      The selected Host Hyprland palette source is missing or unreadable.

- name: Create the non-active Host Hyprland config directory
  ansible.builtin.file:
    path: "{{ host_desktop_hyprland_config_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Render the non-active Host Hyprland user configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ host_desktop_hyprland_config_dir }}/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop: "{{ host_desktop_hyprland_config_templates }}"
  loop_control:
    label: "{{ item.dest }}"
  when: >-
    (not ansible_check_mode)
    or
    (host_desktop_hyprland_config_dir_before.stat.isdir | default(false))

- name: Install the active Host Hyprland palette module
  ansible.builtin.copy:
    src: >-
      {{ host_desktop_hyprland_palette_root }}/{{ host_desktop_hyprland_active_theme }}/hyperlab-palette-hyprland.lua
    dest: "{{ host_desktop_hyprland_config_dir }}/hyperlab_palette.lua"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  when: >-
    (not ansible_check_mode)
    or
    (host_desktop_hyprland_config_dir_before.stat.isdir | default(false))

- name: Inspect installed non-active Host Hyprland configuration
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_config_dir }}/{{ item }}"
    follow: false
    checksum_algorithm: sha256
  register: host_desktop_hyprland_installed_config
  loop: >-
    {{
      (
        host_desktop_hyprland_config_templates
        | map(attribute='dest')
        | list
      )
      + ['hyperlab_palette.lua']
    }}
  when: not ansible_check_mode

- name: Verify installed non-active Host Hyprland configuration
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.pw_name == admin_user
      - item.stat.gr_name == admin_user
      - item.stat.mode == '0644'
    fail_msg: >-
      Installed non-active Host Hyprland config
      {{ item.item }} has invalid ownership or mode.
    quiet: true
  loop: "{{ host_desktop_hyprland_installed_config.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
