---
# Personal Windows workstation and VFIO benchmark instance.
# `memory_mb: auto` is resolved from the live host budget; the spec does not
# encode a laptop RAM total. See ADR 0007.
schema_version: 1
name: win11clean-valley
image: win11clean
lifecycle: permanent
device_profile: vfio
network_profile: clean
resources:
  memory_mb: auto
  vcpus: 6
  disk_gib: null
memory_overcommit: false
autostart: false
qemu_guest_agent: true
looking_glass: true
clipboard: true
shared_folders: false
usb_allowlist: []
owner: sid
purpose: GPU passthrough benchmark and personal Windows workload
tags: [windows, vfio, benchmark]
snapshot_policy: manual
backup_policy: weekly
benchmark: unigine-valley
