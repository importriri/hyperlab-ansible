  - .config/foot
  - .config/swaylock
  - .config/hyperlab
  - .config/hyperlabctl
  - .config/cava
  - .config/superfile
  - .config/rofi/rofi-mocha.rasi
  - .config/rofi/rofi-launcher.rasi
  - .config/rofi/rofi-powermenu.rasi
  - .config/rofi/rofi-hyperlab.rasi
