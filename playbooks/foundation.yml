---
# The safe base target. It prepares every host-side dependency while leaving
# the local cockpit and workload lifecycle explicit.
- name: Assemble the headless hypervisor foundation
  hosts: hypervisor
  become: true
  gather_facts: true
  roles:
    - base
    - hardware_probe
    - kvm_host
    # ADR 0052: skipped, visibly and without a brick stamp, on a host
    # profile that passes no GPU through.
    - role: vfio_boot
      when: hardware_probe_gpu_passthrough | bool
    - network_domains
    - lab_isolation
    - role: gpu_handoff
      when: hardware_probe_gpu_passthrough | bool
    - role: brick_guard
      vars:
        brick_guard_brick: bootstrap_storage
    - bootstrap_storage
    - role: brick_guard
      vars:
        brick_guard_brick: image_store
    - image_store
