nerdfont = true
show_select_icons = true
transparent_background = true
file_preview_width = 3
enable_file_preview_border = true
sidebar_width = 14
sidebar_sections = ["home", "pinned", "disks"]
border_top = "─"
border_bottom = "─"
border_left = "│"
border_right = "│"
border_top_left = "╭"
border_top_right = "╮"
border_bottom_left = "╰"
border_bottom_right = "╯"
border_middle_left = "├"
border_middle_right = "┤"
metadata = false
enable_md5_checksum = false
zoxide_support = true

[open_with]
png = "imv"
jpg = "imv"
jpeg = "imv"
webp = "imv"
svg = "imv"
pdf = "zathura"
