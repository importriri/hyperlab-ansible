---
- name: Validate service ownership, install exposure and start the appliance
  hosts: hypervisor
  become: true
  environment:
    LC_ALL: C
  vars:
    service_registry_operation: validate
    service_spec: service-specs/svc-jellyfin.yml
    guest_operation: start
    guest_spec: vm-specs/svc-jellyfin.yml
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: service_registry
    - service_registry
    - role: brick_guard
      vars:
        brick_guard_brick: service_exposure
    - service_exposure
    - role: brick_guard
      vars:
        brick_guard_brick: guest
    - guest

- name: Configure and verify Jellyfin inside its dedicated service VM
  hosts: jellyfin
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for the service VM SSH endpoint
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather the service appliance identity
      ansible.builtin.setup: {}
  roles:
    - jellyfin
