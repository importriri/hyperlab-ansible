---
# Same roles as the development workstation; only the rice profile differs.
# gaming-dirty: modded games and third-party launchers, never a store account that owns purchases.
- name: Assemble an accelerated Arch Hyprland gaming-dirty workstation
  hosts: workstations
  become: true
  vars:
    # The full Arch sync and the Zen kernel are part of every run, so a new
    # package never meets a stale database; the stock kernel stays installed
    # as the recovery boot entry.
    workstation_kernel_profile: arch-zen
    workstation_kernel_remove_fallback: false
    guest_desktop_hyprland_profile: gaming-dirty
    guest_desktop_hyprland_autologin: true
    guest_desktop_hyprland_autologin_exec: /usr/bin/start-hyprland
    guest_desktop_hyprland_nvidia_only: true
    guest_desktop_hyprland_headless_monitor: true
  roles:
    - workstation_kernel
    - workstation_access
    - guest_desktop_hyprland
    - guest_gpu_nvidia
    - guest_gaming_telemetry
    - role: guest_looking_glass_linux
      vars:
        guest_looking_glass_linux_experimental: true
