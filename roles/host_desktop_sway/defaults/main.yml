---
# The local cockpit. foundation.yml keeps a recovery host blind (TTY), while
# the normal laptop target lab.yml mounts this brick before Looking Glass.
# desktop.yml remains the narrow maintenance entrypoint. On the host the
# cockpit rides the free iGPU: the dGPU belongs to gpu_handoff.
#
# sway, NOT swayfx and NOT a DE: official repos only (no AUR in bricks),
# one compositor, no dependency chain. The eye candy is theming
# (Catppuccin Mocha end to end), not a fork.
#
# The rice pass added rofi (launcher + power menu), papirus-icon-theme
# (rofi's icons) and cava (the waybar strip). rofi 2.0 absorbed the
# wayland fork: `rofi-wayland` is gone from the repos - the package
# `rofi` now Provides and Replaces it, so THAT is the name to install.
# The wallpaper ships with the role and lands in
# /usr/share/backgrounds/privatestack/: drop another PNG on that path to
# swap the backdrop without touching ansible.
# --- per-machine input --------------------------------------------------------
# The only genuinely per-laptop part of the cockpit, and the reason
# sway.config carries no hardware assumption of its own: this is rendered
# into ~/.config/sway/input.conf, which sway.config includes by relative
# path.
#
# These are the FALLBACK. A host with a recorded hardware profile takes that
# profile's `desktop:` block instead (group_vars/all/hardware.yml), merged
# over these. A guest VM has no profile and keeps them, which is right: it
# has no touchpad and no opinion about the keyboard.
# --- the Hyperlab cockpit -----------------------------------------------------
# Where this host keeps the checkout. The CLI reads group_vars, so it runs FROM
# the repository: /usr/local/bin/hyperlabctl is a wrapper that points here, not
# a copy. A host that clones somewhere else overrides this and nothing else.
host_desktop_sway_hyperlab_checkout: "/home/{{ admin_user }}/privatestack-ansible"

host_desktop_sway_input_defaults:
  keyboard_layout: it
  keyboard_layout_cycle:
    - it
    - us
    - ara
  keyboard_variant: ""
  keyboard_options: ""
  touchpad:
    dwt: enabled
    middle_emulation: enabled
    natural_scroll: enabled
    tap: enabled

host_desktop_sway_removed_packages:
  - yazi

host_desktop_sway_packages:
  - sway
  - swaybg
  - swayidle
  - swaylock
  - waybar
  - rofi
  - foot
  - gtk4
  - gtk4-layer-shell
  - python-gobject
  - virt-viewer
  - mako
  - grim
  - slurp
  - wl-clipboard
  - xdg-desktop-portal-wlr
  - xdg-user-dirs
  - brightnessctl
  - polkit
  - pipewire
  - pipewire-pulse
  - wireplumber
  - pamixer
  - cava
  - papirus-icon-theme
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - ly
  - starship
  - zoxide
  - fzf
  - eza
  - bat
  - ripgrep
  - fd
  - superfile
  - btop

# Files copied into both read-only runtime palette pools. The active theme is a
# user-owned copy selected by privatestack-theme.
host_desktop_sway_palette_runtime_fragments:
  - hyperlab-palette-gtk.css
  - hyperlab-palette-waybar.css
  - hyperlab-palette.sway
  - hyperlab-palette.rasi
  - hyperlab-palette-foot.ini
  - hyperlab-palette-superfile.toml
  - hyperlab-palette-swaylock.conf


# Ly 1.x accepts 24-bit 0xSSRRGGBB values. Only these documented keys are
# changed in the package-managed config; every other package default survives.
host_desktop_sway_ly_palettes:
