---
- name: Install nftables
  community.general.pacman:
    name: nftables
    state: present

- name: Own /etc/nftables.conf (include-only, never flush ruleset)
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Make the drop-in directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the isolation matrix (validated by nft before landing)
  ansible.builtin.template:
    src: lab-isolation.nft.j2
    dest: /etc/nftables.d/lab-isolation.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Ask the kernel - not systemd - whether the isolation table is live
  ansible.builtin.command: nft list table {{ lab_isolation_table }}
  register: lab_isolation_live
  changed_when: false
  failed_when: false

- name: Load the ruleset only when the kernel is missing it (never restart)
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  when: lab_isolation_live.rc != 0

- name: Record that the lab_isolation brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: lab_isolation
