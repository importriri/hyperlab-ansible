---
# M4 guest lifecycle: standard and reviewed VFIO domains share one transaction
# engine. Host PCI addresses always come from the validated local profile report.
guest_repository_root: "{{ playbook_dir | dirname }}"
guest_operation: validate
guest_spec: ""
guest_start_after_create: false
guest_wait_for_qga: true
guest_qga_timeout_seconds: 180
guest_shutdown_timeout_seconds: 120
guest_confirm_reset: ""
guest_confirm_stop: ""
guest_confirm_destroy: ""
guest_cloud_init_ssh_public_keys: []
guest_cloud_init_user: sid
# Empty follows the hypervisor's own time zone on a new Machine's first boot.
# An IANA name such as Europe/Rome overrides it. Existing Machines keep the
# zone their seed was built with; the workstation profile follows the host.
guest_cloud_init_timezone: ""
guest_timezone_pattern: >-
  ^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$
# The group polkit and sudo treat as administrators, by os_variant without its
# release number. cloud-init puts the account in it on first boot, so a
# polkit action asks for the account's own password, never for root's, and
# root never gets one. A variant missing here refuses before any seed.
guest_admin_groups:
  archlinux: wheel
  fedora: wheel
  debian: sudo
  parrot: sudo

guest_required_packages:
  - cloud-image-utils
  - swtpm
  - qemu-ui-spice-core
  - qemu-chardev-spice
  - qemu-audio-spice

guest_python_bin: /usr/bin/python
guest_qemu_img_bin: /usr/bin/qemu-img
guest_cloud_localds_bin: /usr/bin/cloud-localds
guest_virsh_bin: /usr/bin/virsh
guest_virt_xml_validate_bin: /usr/bin/virt-xml-validate
guest_mkdir_bin: /usr/bin/mkdir
guest_rmdir_bin: /usr/bin/rmdir
guest_mv_bin: /usr/bin/mv
guest_realpath_bin: /usr/bin/realpath
guest_readlink_bin: /usr/bin/readlink

# Which identity runs each Machine's QEMU (ADR 0037, part 2). `shared`: every
# Machine's QEMU is the store's QEMU user, as today. `per-machine`: each
# Machine has its own system user and group (guest_plan.qemu_identity), owns
# only its disk, seed and NVRAM, and gets its own SPICE socket directory, so
# one QEMU cannot open another Machine's files. Off until the lab host has
# proved it; existing Machines move only when shut off.
hyperlab_qemu_identity_mode: shared
# The group that may open the Looking Glass shared memory in per-machine
# mode; only VFIO Machines with Looking Glass join it.
hyperlab_kvmfr_group: hyperlab-kvmfr
