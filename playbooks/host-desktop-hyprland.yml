---
# Side-by-side Host Hyprland prerequisite mount.
#
# This playbook is deliberately not imported by foundation.yml, lab.yml or the
# active Sway cockpit. It may install official prerequisite packages and record
# its brick, but it may not write Hyprland user configuration, change Ly,
# start Hyprland, or replace Sway.
- name: Install Host Hyprland side-by-side prerequisites
  hosts: hypervisor
  become: true
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: host_desktop_hyprland
    - host_desktop_hyprland
