---
schema_version: 1
id: gaming-clean
display_name: Gaming (clean)
version: "1.0"
# Draft until arch-gaming-clean is captured and sealed through the Workbench.
status: draft
class: gaming
image: arch-gaming-clean
description: >-
  Arch gaming on the clean network with the dedicated GPU: official stores with real accounts (Steam, Heroic for Epic and GOG), nothing else installed.
  The account comes from cloud-init and the rice from the gaming-clean profile
  playbook.

lifecycles:
  permanent: true
  disposable: false

device_capabilities:
  standard: false
  vfio: true

gpu_handoff_profiles:
  clean: true
  dev: false
  dirty: false
  lab: false

network_allowlist: [clean]

resource_profiles:
  minimum: false
  balanced: true
  performance: true
  custom: true

presentation:
  looking_glass_mode: linux-experimental
  recovery_console: true
  workspace_profile: gaming-clean

defaults:
  lifecycle: permanent
  device_capability: vfio
  gpu_handoff_profile: clean
  network_profile: clean
  resource_profile: balanced
