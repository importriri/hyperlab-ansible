# The ruleset this package is verified against.
#
# Selected: pyflakes and bugbear (real defects), comprehensions, and the return
# rules. Not selected, and why:
#
#   UP031  printf formatting - the package formats with % throughout, on
#          purpose: it reads the same on Python 3.9 as on 3.13 and this runs on
#          whatever the host happens to ship.
#   E501   line length - the tables and the Jinja-adjacent strings read worse
#          wrapped than long.
#   ARG002 unused method arguments - `ctx` and `args` are the Provider and
#          Command interfaces. An implementation that does not need one still
#          has to accept it.
line-length = 100
target-version = "py39"

[lint]
select = ["F", "B", "C4", "RET", "SIM"]
ignore = ["SIM105", "SIM102", "RET504"]
