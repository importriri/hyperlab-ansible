---
schema_version: 1
id: browser-disposable
display_name: Disposable Browser
version: "1.0"
# Draft until ADR 0030 is decided and arch-browser is sealed.
status: draft
class: disposable
image: arch-browser
description: >-
  Throwaway browsing on the dirty network. The disk is a libvirt transient
  disk, so every stop discards the history, the downloads and anything the
  web left behind; every start is a first boot from the sealed image.

lifecycles:
  permanent: false
  disposable: true

device_capabilities:
  standard: true
  vfio: false

gpu_handoff_profiles:
  clean: false
  dev: false
  dirty: false
  lab: false

network_allowlist: [dirty]

resource_profiles:
  minimum: true
  balanced: true
  performance: false
  custom: true

presentation:
  looking_glass_mode: disabled
  recovery_console: true
  workspace_profile: browser

defaults:
  lifecycle: disposable
  device_capability: standard
  gpu_handoff_profile: null
  network_profile: dirty
  resource_profile: balanced
