---
schema_version: 1
id: parrot
display_name: Parrot Security
os_family: linux
os_variant: debian12
version: "pinned-at-build"
format: qcow2

status: not-built
sha256: null

private: false
contains_personal_data: false
generalized: true
instance_policy: multiple

# Parrot publishes installer media, not an official cloud qcow2. The ISO is
# verified and installed in a temporary workshop; only the resulting qcow2
# enters image_factory through the supported local-import transaction.
source_type: local
source_url: null
source_checksum_url: null
filename: parrot.qcow2

virtual_size_gib: 40
minimum_size_gib: 20
min_memory_mb: 3072

supports: {standard: true, vfio: false, cloud_init: false, qemu_guest_agent: true}
requires: {uefi: true, secure_boot: false, tpm2: false}
defaults: {lifecycle: disposable, device_profile: standard, network_profile: lab}
# The allowlist is the enforcement, not the default: lab is the only domain
# without an uplink, and this image must never reach the home LAN.
network_allowlist: [lab]
licensing: {redistributable: true}

looking_glass_host_build_required: null
looking_glass_host_build_observed: null
notes: >-
  Build a private qcow2 from the pinned official ISO, verify its checksum,
  install QEMU Guest Agent and shut down cleanly. Import that qcow2 as a local
  source; the ISO itself is never passed to image_factory. Defensive work
  against authorized systems only. Disposable by default.
