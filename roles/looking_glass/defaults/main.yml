---
# The host half of Looking Glass: the kvmfr shared-memory transport, its
# permissions, and the client built from a pinned commit.
looking_glass_commit: 0140a3f6fb
looking_glass_build: B7-263-g0140a3f6fb
looking_glass_repo: https://github.com/gnif/LookingGlass.git
looking_glass_src: /usr/local/src/looking-glass
looking_glass_stamp: /usr/local/share/looking-glass/built-from
looking_glass_width: 1920
looking_glass_height: 1080
looking_glass_shm_mb: >-
  {{ [32, 64, 128, 256, 512]
     | select('ge', ((looking_glass_width * looking_glass_height * 8 / 1048576) + 10)
                    | round(0, 'ceil') | int)
     | first }}
looking_glass_device: /dev/kvmfr0
looking_glass_qemu_user: libvirt-qemu
looking_glass_device_group: kvm
looking_glass_escape_key: KEY_RIGHTCTRL
looking_glass_fullscreen: true
looking_glass_spice_host: 127.0.0.1
looking_glass_spice_port: 5900
looking_glass_packages:
  - dkms
  - "{{ kernel_name }}-headers"
  - git
  - cmake
  - gcc
  - make
  - pkgconf
  - binutils
  - fontconfig
  - gmp
  - nettle
  - spice-protocol
  - mesa
  - libglvnd
  - libxkbcommon
  - wayland
  - wayland-protocols
  - libdecor
  - pipewire
  - libsamplerate
  - ttf-dejavu
