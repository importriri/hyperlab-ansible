        render_hyperlab_gtk: "{{ render_cockpit.results[18].content | b64decode }}"
        render_waybar_launcher: "{{ render_cockpit.results[19].content | b64decode }}"
        render_opacity_helper: "{{ render_cockpit.results[20].content | b64decode }}"
        render_theme_helper: "{{ render_cockpit.results[21].content | b64decode }}"
        render_swaylock_helper: "{{ render_cockpit.results[24].content | b64decode }}"
        render_swaybar_status: "{{ render_cockpit.results[25].content | b64decode }}"
        render_sway_window_types: >-
