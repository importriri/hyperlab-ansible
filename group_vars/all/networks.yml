---
# Five security domains. `isolated` deliberately omits libvirt's <forward>.
network_domains:
  - name: clean
    bridge: virbr-clean
    subnet: 10.10.1.0/24
    gateway: 10.10.1.1
    forward: nat
  - name: dirty
    bridge: virbr-dirty
    subnet: 10.10.2.0/24
    gateway: 10.10.2.1
    forward: nat
  - name: dev
    bridge: virbr-dev
    subnet: 10.10.3.0/24
    gateway: 10.10.3.1
    forward: nat
  - name: lab
    bridge: virbr-lab
    subnet: 10.10.4.0/24
    gateway: 10.10.4.1
    forward: isolated
  - name: services
    bridge: virbr-services
    subnet: 10.10.5.0/24
    gateway: 10.10.5.1
    forward: nat

# The nested lab host's own network (ADR 0046). Not a product network: no
# Template offers it and it has no GPU class. It is in the flow matrix like
# any guest network: NAT to the internet for packages, nothing to the other
# networks, and only DHCP and DNS on its own gateway to the host. The hl-lab-
# prefix marks every lab resource; tools/lab/hl-lab.sh defines them.
lab_host_networks:
  - name: hl-lab-testbed
    bridge: virbr-hl-lab
    subnet: 10.10.9.0/24
    gateway: 10.10.9.1
    forward: nat

# Domain trust - higher means cleaner. This maps security domains, not VM names.
gpu_trust_levels:
  clean: 3
  dev: 2
  dirty: 1
  lab: 0

# Exact checked-in fixture domain names that may own the GPU. Values are GPU
# handoff contamination classes, not network identities. `services` therefore
# remains outside the contamination ladder; a C10 Machine on the services
# network may request a separate reviewed clean/dev/dirty/lab handoff profile
# through the root-owned managed policy surface.
gpu_domain_profiles:
  win11clean-valley: clean
  arch-dev-vfio: dev
  arch-gaming-clean: clean
  arch-gaming-dirty: dirty
  win11dirty-disposable: dirty
