---
# Validate the stage-1 storage hand-off, then create the Hyperlab image layout.
# No package, directory or image write is allowed before mapper/fsroot/+C agree
# with /etc/privatestack/bootstrap-storage.yml.
- name: Validate storage ownership and lay out the Hyperlab image store
  hosts: hypervisor
  become: true
  gather_facts: true
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: bootstrap_storage
    - bootstrap_storage
    - role: brick_guard
      vars:
        brick_guard_brick: image_store
    - image_store
