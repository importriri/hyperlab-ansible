---
- name: Prove M3 refuses production guests whose bases are not sealed
  hosts: hypervisor
  gather_facts: false
  tasks:
    - name: Ask the side-effect-free planner for the current Debian guest
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir | dirname }}/tools/guest_plan.py"
          - --root
          - "{{ playbook_dir | dirname }}"
          - --spec
          - vm-specs/debian-dev.yml
          - --store
          - /var/lib/libvirt/images/hyperlab
      register: guest_refusal_unsealed
      changed_when: false
      failed_when: false

    - name: Require the unsealed-image refusal before any host write
      ansible.builtin.assert:
        that:
          - guest_refusal_unsealed.rc == 2
          - "'image debian is not sealed' in guest_refusal_unsealed.stderr"
        fail_msg: >-
          M3 must remain unusable with a production manifest whose base has not
          been imported, checksummed and marked sealed.
