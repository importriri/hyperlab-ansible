---
# Host-independent render and invariant suite. All generated files live in a
# temporary directory; only nft syntax validation needs privilege escalation.
- name: Validate rendered configuration contracts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Create the render workspace
      ansible.builtin.tempfile:
        state: directory
        suffix: .render
      register: render_ws

    - name: Validate the shipped sudoers drop-in
      ansible.builtin.command:
        argv:
          - visudo
          - -cf
          - "{{ repo_root }}/roles/base/files/10-wheel"
      changed_when: false

    - name: Read structural source files
      ansible.builtin.slurp:
        src: "{{ repo_root }}/{{ item }}"
      loop:
        - roles/base/files/99-hardening.conf
        - roles/kvm_host/defaults/main.yml
        - roles/kvm_host/tasks/main.yml
        - roles/vfio_boot/files/10-vfio.conf
        - roles/lab_isolation/files/nftables.conf
        - roles/lab_isolation/handlers/main.yml
        - roles/lab_isolation/tasks/main.yml
        - roles/gpu_handoff/tasks/main.yml
        - roles/desktop/defaults/main.yml
        - roles/desktop/tasks/main.yml
        - roles/dev_ide/defaults/main.yml
        - roles/desktop/files/sway.config
        - roles/desktop/files/foot.ini
        - roles/looking_glass/tasks/main.yml
        - roles/looking_glass/handlers/main.yml
        - playbooks/desktop.yml
        - playbooks/dev.yml
        - playbooks/lab.yml
        - playbooks/looking-glass.yml
      register: render_sources

    - name: Pin the shared host invariants
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.all.rp_filter = 2' in render_sysctl"
          - "'kernel.kptr_restrict = 2' in render_sysctl"
          - "'accept_redirects = 1' not in render_sysctl"
          - network_domains | length == 5
          - network_domains | selectattr('forward', 'equalto', 'isolated')
            | map(attribute='name') | list == ['lab']
          - network_domains | map(attribute='subnet') | unique | length == 5
          - "'services' not in gpu_trust_levels"
          - "'qemu-base' in render_kvm_defaults"
          - "'qemu-desktop' not in render_kvm_defaults"
          - "'libvirtd.socket' in render_kvm_tasks"
          - "'libvirtd.service' not in render_kvm_tasks"
          - "'MODULES+=(' in render_vfio_dropin"
          - "'vfio_pci' in render_vfio_dropin"
        quiet: true
      vars:
        render_sysctl: "{{ render_sources.results[0].content | b64decode }}"
        render_kvm_defaults: "{{ render_sources.results[1].content | b64decode }}"
        render_kvm_tasks: "{{ render_sources.results[2].content | b64decode }}"
        render_vfio_dropin: "{{ render_sources.results[3].content | b64decode }}"

    - name: Load role defaults used by render tests
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ repo_root }}/roles/vfio_boot/defaults/main.yml"
        - "{{ repo_root }}/roles/lab_isolation/defaults/main.yml"
        - "{{ repo_root }}/roles/looking_glass/defaults/main.yml"

    - name: Render the boot entries
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/vfio_boot/templates/entry.conf.j2"
        dest: "{{ render_ws.path }}/{{ item.file }}"
        mode: "0644"
      loop: "{{ vfio_boot_profiles }}"
      loop_control:
        label: "{{ item.file }}"
      vars:
        vfio_boot_luks_uuid: 12345678-1234-1234-1234-123456789abc
        hardware_probe_vfio_ids_csv: >-
          {{ host_profiles['nitro-3060'].vfio_ids | join(',') }}

    - name: Read the rendered boot entries
      ansible.builtin.slurp:
        src: "{{ render_ws.path }}/{{ item.file }}"
      loop: "{{ vfio_boot_profiles }}"
      register: render_boot_entries

    - name: Validate every rendered boot entry
      ansible.builtin.assert:
        that:
          - "'YOUR-LUKS-UUID' not in render_boot_text"
          - "'cryptdevice' not in render_boot_text"
          - "'root=/dev/mapper/cryptroot' in render_boot_text"
          - "'rootflags=subvol=@' in render_boot_text"
          - "'zswap.enabled=0' in render_boot_text"
          - render_boot_text | regex_findall('(?m)\\\\$') | length == 0
          - >-
            'vfio-pci.ids=10de:2520,10de:228e' in render_boot_text
            if item.item.title is search('Vfio') else true
        quiet: true
      loop: "{{ render_boot_entries.results }}"
      loop_control:
        label: "{{ item.item.file }}"
      vars:
        render_boot_text: "{{ item.content | b64decode }}"

    - name: Render the five libvirt networks
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/network_domains/templates/net.xml.j2"
        dest: "{{ render_ws.path }}/net-{{ item.name }}.xml"
        mode: "0644"
      loop: "{{ network_domains }}"

    - name: Parse every rendered network as XML
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import xml.etree.ElementTree as ET;
            ET.parse('{{ render_ws.path }}/net-{{ item.name }}.xml')
      changed_when: false
      loop: "{{ network_domains }}"

    - name: Render the nftables isolation matrix
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/lab_isolation/templates/lab-isolation.nft.j2"
        dest: "{{ render_ws.path }}/lab-isolation.nft"
        mode: "0644"

    - name: Validate the rendered nftables ruleset
      become: true
      ansible.builtin.command:
        argv:
          - nft
          - -c
          - -f
          - "{{ render_ws.path }}/lab-isolation.nft"
      changed_when: false

    - name: Read the rendered isolation matrix
      ansible.builtin.slurp:
        src: "{{ render_ws.path }}/lab-isolation.nft"
      register: render_nft_matrix_file

    - name: Pin isolation lifecycle invariants
      ansible.builtin.assert:
        that:
          - render_nft_matrix | regex_findall('flush table inet lab_isolation')
            | length == 1
          - render_nft_matrix | regex_findall('(?m)^\\s*flush ruleset')
            | length == 0
          - "'priority -10' in render_nft_matrix"
          - "'iifname \"virbr-lab\" counter drop' in render_nft_matrix"
          - "'oifname \"virbr-lab\" counter drop' in render_nft_matrix"
          - "'state: reloaded' in render_nft_handlers"
          - "'state: restarted' not in render_nft_handlers"
          - "'state: started' not in render_nft_tasks"
        quiet: true
      vars:
        render_nft_matrix: "{{ render_nft_matrix_file.content | b64decode }}"
        render_nft_handlers: "{{ render_sources.results[5].content | b64decode }}"
        render_nft_tasks: "{{ render_sources.results[6].content | b64decode }}"

    - name: Render the GPU trust rotation
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/gpu_handoff/templates/rotation.j2"
        dest: "{{ render_ws.path }}/rotation"
        mode: "0644"

    - name: Read the rendered GPU rotation
      ansible.builtin.slurp:
        src: "{{ render_ws.path }}/rotation"
      register: render_gpu_rotation_file

    - name: Pin GPU handoff invariants
      ansible.builtin.assert:
        that:
          - "'services' not in render_gpu_rotation"
          - "'clean 3' in render_gpu_rotation"
          - "'lab 0' in render_gpu_rotation"
          - render_gpu_rotation | regex_findall('(?m)^[a-z]+ [0-9]+$')
            | length == gpu_trust_levels | length
          - 'render_gpu_tasks is search(''hooks/qemu[\s\S]{0,180}mode: "0755"'')'
        quiet: true
      vars:
        render_gpu_rotation: "{{ render_gpu_rotation_file.content | b64decode }}"
        render_gpu_tasks: "{{ render_sources.results[7].content | b64decode }}"

    - name: Pin cockpit and public-tooling invariants
      ansible.builtin.assert:
        that:
          - "'sway' in render_desktop_packages"
          - "'ly' in render_desktop_packages"
          - "'rofi' in render_desktop_packages"
          - "'rofi-wayland' not in render_desktop_packages"
          - "'xorg-server' not in render_desktop_packages"
          - "'emacs-wayland' in render_ide_packages"
          - "'emacs' not in render_ide_packages"
          - render_desktop_hosts == 'hypervisor:workstations'
          - render_dev_hosts == 'workstations'
          - "'desktop' not in render_lab_roles"
          - "'dev_ide' not in render_lab_roles"
          - "'include input.conf' in render_sway"
          - "'[colors-dark]' in render_foot_sections"
          - "'[colors]' not in render_foot_sections"
          - "'[cursor]' not in render_foot_sections"
          - "'cursor=' in render_foot"
        quiet: true
      vars:
        render_desktop_packages: >-
          {{ (render_sources.results[8].content | b64decode
              | from_yaml).desktop_packages }}
        render_ide_packages: >-
          {{ (render_sources.results[10].content | b64decode
              | from_yaml).dev_ide_packages }}
        render_sway: "{{ render_sources.results[11].content | b64decode }}"
        render_foot: "{{ render_sources.results[12].content | b64decode }}"
        render_foot_sections: >-
          {{ render_foot | regex_findall('(?m)^\\[[a-z0-9-]+\\]') }}
        render_desktop_hosts: >-
          {{ (render_sources.results[15].content | b64decode | from_yaml)[0].hosts }}
        render_dev_hosts: >-
          {{ (render_sources.results[16].content | b64decode | from_yaml)[0].hosts }}
        render_lab_roles: >-
          {{ (render_sources.results[17].content | b64decode | from_yaml)[0].roles }}

    - name: Render Looking Glass transport files
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/looking_glass/templates/{{ item }}"
        dest: "{{ render_ws.path }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - 70-kvmfr.rules.j2
        - kvmfr.conf.j2

    - name: Read Looking Glass transport files
      ansible.builtin.slurp:
        src: "{{ render_ws.path }}/{{ item }}"
      loop:
        - 70-kvmfr.rules
        - kvmfr.conf
      register: render_lg_files

    - name: Pin Looking Glass transport and identity invariants
      ansible.builtin.assert:
        that:
          - looking_glass_shm_mb | int == 32
          - "'static_size_mb=32' in render_lg_modprobe"
          - render_lg_rule is search('OWNER="' ~ looking_glass_qemu_user ~ '"')
          - render_lg_rule is search('TAG\\+="uaccess"')
          - "'-DENABLE_X11=no' in render_lg_tasks"
          - "'--abbrev=10' in render_lg_tasks"
          - looking_glass_commit | length == 40
          - looking_glass_build is search(looking_glass_commit[0:10] ~ '$')
          - "'looking_glass' not in render_lab_roles"
          - render_lg_hosts == 'hypervisor'
        quiet: true
      vars:
        render_lg_rule: "{{ render_lg_files.results[0].content | b64decode }}"
        render_lg_modprobe: "{{ render_lg_files.results[1].content | b64decode }}"
        render_lg_tasks: "{{ render_sources.results[13].content | b64decode }}"
        render_lab_roles: >-
          {{ (render_sources.results[17].content | b64decode | from_yaml)[0].roles }}
        render_lg_hosts: >-
          {{ (render_sources.results[18].content | b64decode | from_yaml)[0].hosts }}

    - name: Render the per-machine input contract
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/desktop/templates/sway-input.conf.j2"
        dest: "{{ render_ws.path }}/input.conf"
        mode: "0644"
      vars:
        desktop_input: >-
          {{ desktop_input_defaults | combine(
             host_profiles['nitro-3060'].desktop, recursive=true) }}

    - name: Read the rendered input contract
      ansible.builtin.slurp:
        src: "{{ render_ws.path }}/input.conf"
      register: render_input_file

    - name: Pin per-machine input values
      ansible.builtin.assert:
        that:
          - "'xkb_layout it' in render_input"
          - "'input type:touchpad' in render_input"
          - "'natural_scroll enabled' in render_input"
          - "'tap enabled' in render_input"
          - render_input | regex_findall('\\{\\{') | length == 0
        quiet: true
      vars:
        render_input: "{{ render_input_file.content | b64decode }}"

    - name: Remove the render workspace
      ansible.builtin.file:
        path: "{{ render_ws.path }}"
        state: absent
