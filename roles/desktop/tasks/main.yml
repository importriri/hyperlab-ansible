---
- name: Install the desktop stack
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present

# ly ships one template unit, not a plain one: upstream res/ly@.service carries
# Conflicts=getty@%i.service and Alias=autovt@.service, so the TTY is chosen by
# the instance we enable - and the alias is what makes logind spawn ly instead
# of getty when that VT is activated. No getty needs disabling by hand.
# A plain ly.service does not exist: only a live systemd can say so, which is
# why lint and the render suite waved this through for a whole stage.
- name: Enable ly on tty2 (starts at next boot - never yank a live TTY)
  ansible.builtin.systemd_service:
    name: ly@tty2.service
    enabled: true

# The two helpers land in /usr/local/bin, not in the user's config: sway
# and waybar call them by absolute path (no ~ expansion to trust), and a
# root-owned 0755 script is not rewritable by whatever runs in the session.
- name: Deploy the cockpit helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: privatestack-cava.sh, dest: privatestack-cava }
    - { src: privatestack-powermenu.sh, dest: privatestack-powermenu }

- name: Create the wallpaper directory
  ansible.builtin.file:
    path: /usr/share/backgrounds/privatestack
    state: directory
    owner: root
    group: root
    mode: "0755"

# Same absolute path is baked into sway.config and swaylock.conf; the
# render suite asserts the three agree, so a rename cannot drift.
- name: Deploy the backdrop
  ansible.builtin.copy:
    src: wallpaper.png
    dest: /usr/share/backgrounds/privatestack/mocha.png
    owner: root
    group: root
    mode: "0644"

- name: Create the config directories
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - sway
    - waybar
    - foot
    - mako
    - rofi
    - cava
    - swaylock
    - gtk-3.0

- name: Deploy the Mocha rice
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ admin_user }}/.config/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop:
    - { src: sway.config, dest: sway/config }
    - { src: waybar.jsonc, dest: waybar/config.jsonc }
    - { src: waybar.css, dest: waybar/style.css }
    - { src: foot.ini, dest: foot/foot.ini }
    - { src: mako.conf, dest: mako/config }
    - { src: rofi-config.rasi, dest: rofi/config.rasi }
    - { src: rofi-mocha.rasi, dest: rofi/rofi-mocha.rasi }
    - { src: rofi-launcher.rasi, dest: rofi/rofi-launcher.rasi }
    - { src: rofi-powermenu.rasi, dest: rofi/rofi-powermenu.rasi }
    - { src: cava.conf, dest: cava/config }
    - { src: cava-waybar.conf, dest: cava/cava-waybar.conf }
    - { src: swaylock.conf, dest: swaylock/config }
    - { src: gtk3-settings.ini, dest: gtk-3.0/settings.ini }
    - { src: starship.toml, dest: starship.toml }

# hardware_probe writes its selection to disk precisely so a playbook that
# does not run it can still read it - facts do not survive between playbook
# runs. Reading the file instead of depending on the role is also what keeps
# desktop.yml working on a guest VM, which has no laptop profile and never
# will: no file, no match, fallback.
- name: Read the recorded hardware profile, when this host has one
  ansible.builtin.slurp:
    src: "{{ hardware_report_path }}"
  register: desktop_hardware_report
  failed_when: false
  changed_when: false

- name: Resolve the per-machine input settings
  ansible.builtin.set_fact:
    desktop_input: >-
      {{ desktop_input_defaults | combine(
           hardware_profiles[desktop_profile_name].desktop | default({}, true),
           recursive=true)
         if desktop_profile_name in hardware_profiles
         else desktop_input_defaults }}
  vars:
    desktop_profile_name: >-
      {{ (desktop_hardware_report.content | b64decode | from_yaml).profile
         if desktop_hardware_report.content is defined else '' }}

# Rendered, not copied: this is the per-machine half of the cockpit, and it
# is the reason sway.config itself carries no hardware assumption.
- name: Render the per-machine input configuration
  ansible.builtin.template:
    src: sway-input.conf.j2
    dest: "/home/{{ admin_user }}/.config/sway/input.conf"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

- name: Wire the shell kit into bash (managed block, reversible)
  ansible.builtin.blockinfile:
    path: "/home/{{ admin_user }}/.bashrc"
    create: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    marker: "# {mark} privatestack desktop brick"
    block: |
      eval "$(starship init bash)"
      eval "$(zoxide init bash)"
      alias ls='eza --group-directories-first'
      alias ll='eza -la --group-directories-first'
      alias cat='bat --paging=never'
      alias tree='eza --tree'
      source /usr/share/fzf/key-bindings.bash
      source /usr/share/fzf/completion.bash
