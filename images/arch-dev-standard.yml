---
schema_version: 1
id: arch-dev-standard
display_name: HyperLab dev workstation (standard)
os_family: linux
os_variant: archlinux
version: "pinned-at-build"
format: qcow2

# Placeholder: it reserves the id for the Workbench capture of arch-dev, the
# development workstation without a passed-through GPU. The seal replaces this
# file with the captured manifest; a placeholder is the only manifest the
# Workbench may replace.
status: not-built
sha256: null

private: true
contains_personal_data: false
generalized: true
instance_policy: multiple

source_type: local
source_url: null
source_checksum_url: null
source_sha256: null
filename: arch-dev-standard.qcow2

virtual_size_gib: 24
minimum_size_gib: 24
min_memory_mb: 4096

supports: {standard: true, vfio: false, cloud_init: true, qemu_guest_agent: true}
requires: {uefi: true, secure_boot: false, tpm2: false}
defaults: {lifecycle: permanent, device_profile: standard, network_profile: dev}
network_allowlist: [dev]
licensing: {redistributable: false}

looking_glass_host_build_required: null
looking_glass_host_build_observed: null
notes: >-
  Captured through the Workbench from arch-dev (dev profile, no GPU) over the
  arch base, then generalized, scanned and sealed. Machines get their account
  from cloud-init and their rice from playbooks/guest-arch-dev.yml.
