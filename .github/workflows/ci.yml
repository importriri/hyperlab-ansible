---
# ==========================================================================
# CI - discovery, not enumeration.
# --------------------------------------------------------------------------
# Every playbook, role, contract, protocol and shell path is discovered.
# Failure artifacts keep the first useful diagnostic instead of a truncated log.
# ==========================================================================
name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    # Shell runtime contracts exercise Qt APIs newer than Noble's Qt 6.4.
    # Keep this explicit until ubuntu-latest moves to Ubuntu 26.04.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install the fixed toolchain
        id: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            shellcheck bats nftables lua5.4 poppler-utils \
            pkg-config libpipewire-0.3-dev libglib2.0-dev pciutils \
            python3-gi gir1.2-gtk-4.0 libgtk-4-bin \
            cmake make g++ libcli11-dev libdrm-dev \
            qt6-declarative-private-dev qt6-shadertools-dev \
            qmlscene-qt6 \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript
          test -x /usr/lib/qt6/bin/qmlscene
          # Ubuntu 26.04 has no Quickshell package. Build the process runtime
          # against this runner's Qt private ABI, without desktop services.
          curl --fail --location --retry 3 \
            https://github.com/quickshell-mirror/quickshell/archive/refs/tags/v0.3.2.tar.gz \
            --output "${RUNNER_TEMP}/quickshell.tar.gz"
          echo "946a27e2a276917a03c1079e5c60971af84ece73088c3661dee455d92eb420f7  ${RUNNER_TEMP}/quickshell.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/quickshell.tar.gz" -C "${RUNNER_TEMP}"
          cmake -S "${RUNNER_TEMP}/quickshell-0.3.2" -B "${RUNNER_TEMP}/quickshell-build" \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DGIT_REVISION=v0.3.2 \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/quickshell-runtime" \
            -DINSTALL_QML_PREFIX=lib/qt6/qml \
            -DCRASH_HANDLER=OFF -DUSE_JEMALLOC=OFF -DWAYLAND=OFF -DX11=OFF -DI3=OFF \
            -DSERVICE_STATUS_NOTIFIER=OFF -DSERVICE_PIPEWIRE=OFF -DSERVICE_MPRIS=OFF \
            -DSERVICE_PAM=OFF -DSERVICE_POLKIT=OFF -DSERVICE_GREETD=OFF \
            -DSERVICE_UPOWER=OFF -DSERVICE_NOTIFICATIONS=OFF -DBLUETOOTH=OFF -DNETWORK=OFF
          cmake --build "${RUNNER_TEMP}/quickshell-build" --parallel 2
          cmake --install "${RUNNER_TEMP}/quickshell-build"
          export PATH="${RUNNER_TEMP}/quickshell-runtime/bin:${PATH}"
          echo "${RUNNER_TEMP}/quickshell-runtime/bin" >> "${GITHUB_PATH}"
          qs --version
          pip install --user ansible ansible-lint ruff
          ansible-galaxy collection install -r collections/requirements.yml

      # The same commands as verify.sh levels 0f and 0g, with the same
      # arguments; tests/ci_verify_parity_contract.py runs both files and
      # compares what they execute. They come right after the toolchain so
      # that a failure in any later step cannot skip them.
      - name: Shell structure (no display required)
        run: sh tools/shell-tests/run.sh

      - name: Palette and open choices
        run: |
          python3 tools/palette/audit_palette.py tools/palette/palette.yml
          python3 tools/palette/verify_surfaces.py roles/host_desktop_sway/files/palette
          python3 tools/choices/choices.py check
          python3 tools/choices/test_choices.py
          python3 tools/choices/test_consistency.py

      - name: Lint every Python file (repo ruleset)
        run: ruff check .

      - name: Lint every role and playbook (production profile)
        id: ansible_lint
        run: |
          set -o pipefail
          ansible-lint 2>&1 | tee ansible-lint.log

      - name: Preserve lint diagnostics on failure
        if: ${{ failure() && steps.ansible_lint.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ansible-lint-diagnostics
          path: ansible-lint.log
          if-no-files-found: error
          retention-days: 3

      - name: Syntax-check every playbook (discovered)
        run: |
          for pb in playbooks/*.yml; do
            echo "--- ${pb}"
            ansible-playbook --syntax-check -i inventory.ini "${pb}"
          done

      - name: Per-brick structural contracts (discovered)
        id: structural_contracts
        run: |
          set -o pipefail
          {
            for contract in tests/*_contract.py; do
              echo "--- ${contract}"
              python "${contract}"
            done
          } 2>&1 | tee structural-contracts.log

      - name: Preserve structural diagnostics on failure
        if: ${{ failure() && steps.structural_contracts.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: structural-contract-diagnostics
          path: structural-contracts.log
          if-no-files-found: error
          retention-days: 3

      - name: Refusal suites (discovered)
        run: |
          for suite in tests/*-refusals.yml; do
            ansible-playbook -i inventory.ini "${suite}"
          done

      - name: Static pipeline contract
        run: python tests/static_contract.py

      - name: Image manifest and VM spec schemas
        run: python tests/schema_validate.py

      - name: Contract mutation tests
        run: |
          python tests/schema_mutations.py
          python tests/contract_mutations.py

      - name: Render and invariant tests
        id: render_invariants
        run: |
          set -o pipefail
          ansible-playbook -i inventory.ini tests/render.yml \
            --extra-vars '{"hardware_profiles":{"nitro-3060":{"vfio_ids":["10de:2520","10de:228e"]}}}' \
            2>&1 | tee render-invariants.log

      - name: Preserve render diagnostics on failure
        if: ${{ failure() && steps.render_invariants.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: render-invariant-diagnostics
          path: render-invariants.log
          if-no-files-found: error
          retention-days: 3

      - name: Protocol tests (bats, when a brick ships them)
        run: |
          if ls tests/*.bats >/dev/null 2>&1; then
            bats tests/*.bats
          else
            echo "no bats suites yet"
          fi

      - name: Shellcheck every shell script (discovered)
        run: |
          files=$(grep -rIlE '^#!(/usr)?/bin/(env )?(ba)?sh' --exclude-dir=.git --exclude='*.md' . 2>/dev/null || true)
          if [ -n "${files}" ]; then
            echo "${files}" | xargs shellcheck
          else
            echo "no shell scripts yet"
          fi

  cross-repo:
    name: cross-repository hardware contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          path: hyperlab-ansible

      - name: Check out the compatibility record
        uses: actions/checkout@v4
        with:
          repository: importriri/arch-hypervisor-lab
          path: arch-hypervisor-lab

      - name: Install the parser
        run: pip install pyyaml

      - name: Compare the configured profiles against the recorded evidence
        working-directory: hyperlab-ansible
        env:
          CROSS_REPO_REQUIRED: "1"
        run: python tests/cross_repo_contract.py ../arch-hypervisor-lab
