    - name: Cockpit control invariants (the bar may only offer what the CLI has)
      ansible.builtin.assert:
        that:
          - "render_waybar['modules-left'][:3] == ['sway/workspaces', 'custom/brand', 'group/hyperlab']"
          - "render_waybar['group/hyperlab']['modules'] == ['custom/hyperlab', 'custom/hyperlab-ram', 'custom/hyperlab-gpu', 'custom/hyperlab-vms']"
          - "render_waybar['custom/brand']['format'] == '  HyperLab'"
          - "render_waybar['custom/brand']['on-click'] == '/usr/local/bin/privatestack-hyperlab-domains --surface drawer --section vms'"
          - "render_waybar['custom/brand']['on-click-right'] == '/usr/local/bin/privatestack-hyperlab-domains --surface drawer --section diagnostics'"
          - "render_waybar['custom/brand']['on-click-middle'] == '/usr/local/bin/privatestack-hyperlab-domains --surface overlay --section vms'"
          - "render_waybar['custom/hyperlab']['format'] == 'TRUST {}'"
          - "render_waybar['group/hyperlab']['drawer']['reveal-delay'] == 40"
          - "render_waybar['modules-center'] == ['clock']"
          - "render_waybar['modules-right'] == ['group/telemetry', 'group/session']"
          - >-
            render_waybar['group/telemetry']['modules'] ==
            ['temperature', 'network', 'pulseaudio', 'battery']
          - >-
            render_waybar['group/session']['modules'] ==
            ['custom/keyboard-layout', 'custom/wallpaper-mode', 'custom/controls']
          - "'custom/hyperlab-vms' not in render_waybar['modules-right']"
          - "'custom/hyperlab-gpu' not in render_waybar['modules-right']"
          - "render_hyper_modules | length == 4"
          - "render_hyper_execs | length == 1"
          - "render_hyper_execs | difference(render_desk_bin_paths) == []"
          - "render_hyper_clicks | difference(render_hyper_allowed_clicks) == []"
          - "render_hyper_allowed_clicks | difference(render_hyper_clicks) == []"
          - "render_hyper_collapsed.interval is not defined"
          - "'watch' in render_hyper_collapsed.exec"
          - "render_hyper_collapsed['restart-interval'] | int > 0"
          - "render_hyper_drawer | length == 3"
          - "render_hyper_intervals | min | int >= 15"
          - "render_hyper_signals | unique | length == 1"
          - "render_hyper_signals[0] | int == render_cli_signal | int"
          - "render_hyper_fields | sort == ['gpu', 'ram', 'trust', 'vms']"
          - "render_hyper_css_classes | difference(render_hyper_states) == []"
          - "'hyperlabctl' in render_desk_dests"
          - "render_pointer_mode == '0644'"
          - "render_desk_bin_modes | unique == ['0755']"
          - "'/usr/local/bin/privatestack-hyperlab-domains --surface drawer --section vms' in render_sway"
          - "'/usr/local/bin/privatestack-hyperlab-domains --surface drawer --section diagnostics' in render_sway"
          - "render_sway_hyper_binds | length == 3"
          - "render_palette_never_runs_privileged"
          - "'destroy' not in render_waybar | to_json"
        fail_msg: >-
          A HyperLab Shell invariant broke. The Waybar left zone must be workspaces followed by the
          HyperLab launcher and its hover trust drawer; direct UI routes
          must reuse the resident Layer Shell manager. Operations inside the
          manager must never bypass hyperlabctl or poll
          faster than the recorded contract permits.
        quiet: true
      vars:
        render_waybar: >-
          {{ render_cockpit.results[7].content | b64decode
             | regex_replace('(?m)^\s*//.*$', '') | from_json }}
        render_sway: "{{ render_cockpit.results[6].content | b64decode }}"
        render_desk_dests: >-
          {{
            (
              (render_cockpit.results[1].content | b64decode | from_yaml)
              | map('dict2items') | flatten
              | selectattr('key', 'equalto', 'loop')
              | map(attribute='value') | flatten
              | selectattr('dest', 'defined')
              | map(attribute='dest') | list
            )
            +
            (
              (
                render_cockpit.results
                | selectattr(
                    'item',
                    'equalto',
                    'roles/host_desktop_sway/tasks/palette.yml'
                  )
                | map(attribute='content')
                | first
                | b64decode
                | from_yaml
              )
              | map('dict2items') | flatten
              | selectattr('key', 'equalto', 'loop')
              | map(attribute='value') | flatten
              | selectattr('dest', 'defined')
              | map(attribute='dest') | list
            )
          }}
        render_hyper_modules: >-
          {{ render_waybar | dict2items
             | selectattr('key', 'search', '^custom/hyperlab')
             | map(attribute='value') | list }}
        render_hyper_execs: >-
          {{ render_hyper_modules | map(attribute='exec')
             | map('regex_replace', ' .*$', '') | unique | list }}
        render_desk_bin_paths: >-
          {{ render_desk_dests | select('search', '^privatestack-')
             | map('regex_replace', '^', '/usr/local/bin/') | list
             + ['/usr/local/bin/hyperlabctl'] }}
        render_hyper_fields: >-
          {{ render_hyper_modules | map(attribute='exec')
             | map('regex_replace', '^.* ', '') | unique | list }}
        render_hyper_collapsed: >-
          {{ render_waybar['custom/hyperlab'] }}
        render_hyper_drawer: >-
          {{ ['custom/hyperlab-ram', 'custom/hyperlab-gpu', 'custom/hyperlab-vms']
             | map('extract', render_waybar) | list }}
        render_hyper_intervals: >-
          {{ render_hyper_drawer | map(attribute='interval') | list }}
        render_hyper_signals: >-
          {{ render_hyper_drawer | map(attribute='signal') | list }}
        render_hyper_clicks: >-
          {{ render_hyper_modules
             | map('dict2items') | flatten
             | selectattr('key', 'search', '^on-click')
             | map(attribute='value') | unique | list }}
        render_hyper_allowed_clicks:
          - /usr/local/bin/privatestack-hyperlab-domains --surface drawer --section vms
          - /usr/local/bin/privatestack-hyperlab-domains --surface drawer --section diagnostics
          - /usr/local/bin/privatestack-hyperlab-domains --surface overlay --section diagnostics
        render_hyper_states:
          - ok
          - warn
          - error
        render_hyper_css_classes: >-
          {{ (render_cockpit.results[14].content | b64decode)
             | regex_findall('#custom-hyperlab[a-z-]*\.([a-z]+)') | unique | list }}
        render_cli_signal: >-
          {{ (lookup('file', repo_root ~ '/tools/hyperlabctl/hyperlabctl/operations.py')
              | regex_findall('WAYBAR_SIGNAL = ([0-9]+)') | first) }}
        render_desk_copy_values: >-
          {{ (render_cockpit.results[1].content | b64decode | from_yaml)
             | map('dict2items') | flatten
             | selectattr('key', 'equalto', 'ansible.builtin.copy')
             | map(attribute='value') | list }}
        render_desk_bin_modes: >-
          {{ render_desk_copy_values
             | selectattr('dest', 'search', '/usr/local/bin/')
             | map(attribute='mode') | list }}
        render_pointer_mode: >-
          {{ render_desk_copy_values
             | selectattr('dest', 'defined')
             | selectattr('dest', 'equalto', '/etc/hyperlabctl/checkout')
             | map(attribute='mode') | first }}
        render_sway_hyper_binds: >-
          {{ render_sway | regex_findall('(?m)^bindsym \$mod\+F[123] ') }}
        render_palette_never_runs_privileged: >-
          {{ (
               ((render_cockpit.results[12].content | b64decode)
                | regex_search('if \[\[ \${privileged} == yes \]\]; then[\s\S]{0,160}show_prepared[\s\S]{0,80}return 0'))
               is not none
             ) and (
               ((render_cockpit.results[12].content | b64decode)
                | regex_search('show_prepared\(\)[\s\S]{0,360}review it, then run it yourself'))
               is not none
             ) }}

    - name: Load the Looking Glass defaults as real variables
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/roles/looking_glass/defaults/main.yml"

    - name: Make a rendering workspace for the transport files
      ansible.builtin.tempfile:
        state: directory
        suffix: .render
      register: render_lg_ws

    - name: Render the udev rule and the module options
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/looking_glass/templates/{{ item }}"
        dest: "{{ render_lg_ws.path }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - 70-kvmfr.rules.j2
        - kvmfr.conf.j2

    - name: Read the rendered transport files, the brick, and the playbooks
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: render_lg
      loop:
        - "{{ render_lg_ws.path }}/70-kvmfr.rules"
        - "{{ render_lg_ws.path }}/kvmfr.conf"
        - "{{ repo_root }}/roles/looking_glass/tasks/main.yml"
        - "{{ repo_root }}/roles/looking_glass/handlers/main.yml"
        - "{{ repo_root }}/playbooks/looking-glass.yml"
        - "{{ repo_root }}/playbooks/lab.yml"

    - name: Looking Glass invariants (sized shm, two openers, Wayland-pure, final lab)
      ansible.builtin.assert:
        that:
          - looking_glass_shm_mb | int == 64
          - render_lg_modprobe is search('static_size_mb=64')
          - render_lg_rule is search('OWNER="' ~ looking_glass_qemu_user ~ '"')
          - render_lg_rule is search('TAG\+="uaccess"')
          - render_lg_handlers is search('--action=change')
          - "'modprobe -r kvmfr' not in render_lg_handlers"
          - "'looking_glass_kvmfr_size_tool' in render_lg_tasks"
          - "'looking_glass_kvmfr_reload_required' in render_lg_tasks"
          - "'modinfo' in render_lg_tasks"
          - "'fuser' in render_lg_tasks"
          - "'state: absent' in render_lg_tasks"
          - "'-DENABLE_X11=no' in render_lg_tasks"
          - looking_glass_packages | intersect(looking_glass_x11_deps) | length == 0
          - render_lg_hosts == 'hypervisor'
          - "render_lg_lab[0].import_playbook == 'foundation.yml'"
          - "'looking_glass' in render_lg_lab[1].roles"
          - >-
            (looking_glass_stamp | dirname) in render_lg_dirs
            or render_lg_dirs
               | select('search', 'looking_glass_stamp\s*\|\s*dirname')
               | list | length > 0
          - "'ansible_processor_vcpus' not in render_lg_tasks"
          - "'--abbrev=10' in render_lg_tasks"
          - "(render_lg_tasks | regex_search('input_patch_sha256:\\s+\\{\\{\\s+looking_glass_input_patch_sha256\\s+\\}\\}')) is not none"
          - "'looking_glass_input_patch_target' in render_lg_tasks"
          - looking_glass_input_patch_sha256 | length == 64
          - looking_glass_commit | length == 40
          - looking_glass_build is search(looking_glass_commit[0:10] ~ '$')
        quiet: true
      vars:
        looking_glass_x11_deps:
          - libx11
          - libxfixes
          - libxi
          - libxinerama
          - libxss
          - libxcursor
          - libxpresent
        render_lg_rule: "{{ render_lg.results[0].content | b64decode }}"
        render_lg_modprobe: "{{ render_lg.results[1].content | b64decode }}"
        render_lg_tasks: "{{ render_lg.results[2].content | b64decode }}"
        render_lg_handlers: "{{ render_lg.results[3].content | b64decode }}"
        render_lg_hosts: "{{ (render_lg.results[4].content | b64decode | from_yaml)[0].hosts }}"
        render_lg_lab: "{{ render_lg.results[5].content | b64decode | from_yaml }}"
        render_lg_dirs: >-
          {{ (render_lg.results[2].content | b64decode | from_yaml)
             | map('dict2items') | flatten
             | selectattr('key', 'equalto', 'ansible.builtin.file')
             | map(attribute='value')
             | selectattr('state', 'equalto', 'directory')
             | map(attribute='path') | list }}

    - name: Remove the Looking Glass rendering workspace
      ansible.builtin.file:
        path: "{{ render_lg_ws.path }}"
        state: absent

    - name: Load the Linux Looking Glass guest defaults as real variables
      ansible.builtin.include_vars:
        file: >-
          {{ repo_root }}/roles/guest_looking_glass_linux/defaults/main.yml

    - name: Make a Linux Looking Glass guest rendering workspace
      ansible.builtin.tempfile:
        state: directory
        suffix: .guest-looking-glass-render
      register: render_guest_lg_ws

    - name: Render the deterministic XDPH selection files
      ansible.builtin.template:
        src: >-
          {{ repo_root }}/roles/guest_looking_glass_linux/templates/{{ item.src }}
        dest: "{{ render_guest_lg_ws.path }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - src: xdph-headless-picker.sh.j2
          dest: xdph-headless-picker.sh
          mode: "0755"
        - src: xdph.conf.j2
          dest: xdph.conf
          mode: "0600"

    - name: Shellcheck the rendered XDPH picker
      ansible.builtin.command:
        argv:
          - shellcheck
          - -s
          - bash
          - "{{ render_guest_lg_ws.path }}/xdph-headless-picker.sh"
      changed_when: false

    - name: Read the rendered XDPH selection files and role tasks
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ render_guest_lg_ws.path }}/xdph-headless-picker.sh"
        - "{{ render_guest_lg_ws.path }}/xdph.conf"
        - "{{ repo_root }}/roles/guest_looking_glass_linux/tasks/main.yml"
      register: render_guest_lg

    - name: Linux Looking Glass deterministic XDPH invariants
      ansible.builtin.assert:
        that:
          - guest_looking_glass_linux_capture_output == 'HEADLESS-0'
          - guest_looking_glass_linux_capture_max_fps | int == 144
          - >-
            guest_looking_glass_linux_xdph_picker ==
            '/usr/local/bin/privatestack-looking-glass-xdph-picker'
          - "'/usr/bin/hyprctl -j monitors' in render_guest_lg_picker"
          - "'json.load(sys.stdin)' in render_guest_lg_picker"
          - >-
            "guest_looking_glass_linux_capture_output='HEADLESS-0'"
            in render_guest_lg_picker
          - "'[SELECTION]/screen:%s\\\\n' in render_guest_lg_picker"
          - "'max_fps = 144' in render_guest_lg_config"
          - >-
            'custom_picker_binary = '
            ~ guest_looking_glass_linux_xdph_picker
            in render_guest_lg_config
          - "'xdph-headless-picker.sh.j2' in render_guest_lg_tasks"
          - "'xdph.conf.j2' in render_guest_lg_tasks"
          - "'systemctl enable looking-glass-host' not in render_guest_lg_tasks"
        fail_msg: >-
          The Linux Looking Glass guest must select the managed HEADLESS-0
          output without an invisible portal prompt, while the sender remains
          manual and disabled by default.
        quiet: true
      vars:
        render_guest_lg_picker: >-
          {{ render_guest_lg.results[0].content | b64decode }}
        render_guest_lg_config: >-
          {{ render_guest_lg.results[1].content | b64decode }}
        render_guest_lg_tasks: >-
          {{ render_guest_lg.results[2].content | b64decode }}

    - name: Remove the Linux Looking Glass guest rendering workspace
      ansible.builtin.file:
        path: "{{ render_guest_lg_ws.path }}"
        state: absent

    - name: Load the guest NVIDIA defaults as real variables
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/roles/guest_gpu_nvidia/defaults/main.yml"

    - name: Make a guest NVIDIA rendering workspace
      ansible.builtin.tempfile:
        state: directory
        suffix: .guest-nvidia-render
      register: render_guest_nvidia_ws

    - name: Render the persistent guest NVIDIA DRM alias rule
      ansible.builtin.template:
        src: >-
          {{ repo_root }}/roles/guest_gpu_nvidia/templates/95-privatestack-nvidia-drm.rules.j2
        dest: "{{ render_guest_nvidia_ws.path }}/95-privatestack-nvidia-drm.rules"
        mode: "0644"
      vars:
        guest_gpu_nvidia_drm_pci_address: "0000:05:00.0"

    - name: Read the guest NVIDIA alias rule and its role contract
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ render_guest_nvidia_ws.path }}/95-privatestack-nvidia-drm.rules"
        - "{{ repo_root }}/roles/guest_gpu_nvidia/tasks/main.yml"
        - "{{ repo_root }}/roles/guest_gpu_nvidia/handlers/main.yml"
      register: render_guest_nvidia

    - name: Guest NVIDIA persistent DRM alias invariants
      ansible.builtin.assert:
        that:
          - >-
            guest_gpu_nvidia_drm_alias ==
            '/dev/dri/privatestack-nvidia'
          - "'ENV{DEVTYPE}==\"drm_minor\"' in render_guest_nvidia_rule"
          - "'KERNEL==\"card[0-9]*\"' in render_guest_nvidia_rule"
          - "'KERNELS==\"0000:05:00.0\"' in render_guest_nvidia_rule"
          - "'ATTRS{vendor}==\"0x10de\"' in render_guest_nvidia_rule"
          - "'SYMLINK+=\"dri/privatestack-nvidia\"' in render_guest_nvidia_rule"
          - "'TAG+=\"uaccess\"' in render_guest_nvidia_rule"
          - >-
            render_guest_nvidia_tasks.find(
              'Identify the passed NVIDIA display controller') <
            render_guest_nvidia_tasks.find(
              'Persist the passed NVIDIA DRM alias')
          - >-
            render_guest_nvidia_tasks.find(
              'Persist the passed NVIDIA DRM alias') <
            render_guest_nvidia_tasks.find(
              'Verify the persistent NVIDIA DRM alias rule')
          - >-
            render_guest_nvidia_tasks.find(
              'Verify the persistent NVIDIA DRM alias rule') <
            render_guest_nvidia_tasks.find(
              'Complete pending NVIDIA initramfs work')
          - "'guest_gpu_nvidia_drm_alias_canonical' in render_guest_nvidia_tasks"
          - "'guest_gpu_nvidia_drm_by_path_canonical' in render_guest_nvidia_tasks"
          - "'udevadm' in render_guest_nvidia_handlers"
          - "'--subsystem-match=drm' in render_guest_nvidia_handlers"
          - "'--action=change' in render_guest_nvidia_handlers"
        fail_msg: >-
          A guest NVIDIA invariant broke. The compositor alias must select the
          single passed display controller by PCI identity, survive reboot,
          retain active-seat access and be verified after the udev retrigger.
        quiet: true
      vars:
        render_guest_nvidia_rule: >-
          {{ render_guest_nvidia.results[0].content | b64decode }}
        render_guest_nvidia_tasks: >-
          {{ render_guest_nvidia.results[1].content | b64decode }}
        render_guest_nvidia_handlers: >-
          {{ render_guest_nvidia.results[2].content | b64decode }}

    - name: Remove the guest NVIDIA rendering workspace
      ansible.builtin.file:
        path: "{{ render_guest_nvidia_ws.path }}"
        state: absent

    - name: Load the Nitro Sense defaults as real variables
      tags: [nitro_sense_render]
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/roles/nitro_sense/defaults/main.yml"

    - name: Make a Nitro Sense rendering workspace
      tags: [nitro_sense_render]
      ansible.builtin.tempfile:
        state: directory
        suffix: .nitro-sense-render
      register: render_ns_ws

    - name: Render the Nitro Sense managed files
      tags: [nitro_sense_render]
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/nitro_sense/templates/{{ item }}"
        dest: "{{ render_ns_ws.path }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - nitro-sense-apply.sh.j2
        - nitro-sense-apply.service.j2
        - dkms.conf.j2
        - Makefile.j2

    - name: Shellcheck the rendered Nitro Sense helper
      tags: [nitro_sense_render]
      ansible.builtin.command:
        argv:
          - shellcheck
          - -s
          - bash
          - "{{ render_ns_ws.path }}/nitro-sense-apply.sh"
      changed_when: false

    - name: Read Nitro Sense source, rendered files and operator contracts
      tags: [nitro_sense_render]
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: render_ns
      loop:
        - "{{ repo_root }}/roles/nitro_sense/tasks/main.yml"
        - "{{ repo_root }}/roles/nitro_sense/tasks/preflight.yml"
        - "{{ repo_root }}/roles/nitro_sense/tasks/platform-profile.yml"
        - "{{ repo_root }}/roles/nitro_sense/tasks/out-of-tree.yml"
        - "{{ repo_root }}/roles/nitro_sense/tasks/rollback.yml"
        - "{{ repo_root }}/roles/nitro_sense/tasks/configure.yml"
        - "{{ repo_root }}/playbooks/nitro-sense.yml"
        - "{{ repo_root }}/playbooks/foundation.yml"
        - "{{ repo_root }}/playbooks/lab.yml"
        - "{{ repo_root }}/docs/nitro-sense.md"
        - "{{ repo_root }}/docs/nitro-sense-procedure.md"
        - "{{ repo_root }}/README.md"
        - "{{ render_ns_ws.path }}/nitro-sense-apply.sh"
        - "{{ render_ns_ws.path }}/nitro-sense-apply.service"
        - "{{ render_ns_ws.path }}/dkms.conf"
        - "{{ render_ns_ws.path }}/Makefile"

    - name: Nitro Sense invariants (native first, exact pin, reversible replacement)
      tags: [nitro_sense_render]
      ansible.builtin.assert:
        that:
          - nitro_sense_state == 'present'
          - not nitro_sense_out_of_tree_enabled | bool
          - not nitro_sense_use_out_of_tree | bool
          - nitro_sense_commit | length == 40
          - >-
            nitro_sense_dkms_version ==
            ((nitro_sense_commit ~ nitro_sense_source_patch_sha256)
             | hash('sha256'))[0:12]
          - nitro_sense_build_packages | select('equalto', 'linux-hardened-headers') | list | length == 1
          - nitro_sense_build_packages | select('equalto', 'linux-headers') | list | length == 0
          - nitro_sense_fan_cpu_percent | int == 100
          - nitro_sense_fan_gpu_percent | int == 100
          - nitro_sense_led_mode == 'disabled'
          - render_ns_play[0].hosts == 'hypervisor'
          - render_ns_play[0].roles[0].role == 'brick_guard'
          - render_ns_play[0].roles[1] == 'nitro_sense'
          - "'nitro_sense' not in render_ns_foundation | to_json"
          - "'nitro_sense' not in render_ns_lab | to_json"
          - brick_requires.nitro_sense == ['base', 'hardware_probe']
          - brick_playbooks.nitro_sense == 'playbooks/nitro-sense.yml'
          - render_ns_main.find('preflight.yml') < render_ns_main.find('out-of-tree.yml')
          - nitro_sense_platform_profile_choices_path == '/sys/firmware/acpi/platform_profile_choices'
          - nitro_sense_dmi_vendor_path == '/sys/class/dmi/id/sys_vendor'
          - nitro_sense_dmi_product_path == '/sys/class/dmi/id/product_name'
          - "'nitro_sense_supported_models' in render_ns_preflight"
          - "'nitro_sense_platform_profile_choices_path' in render_ns_profile"
          - "'nitro_sense_native_profile_sufficient' in render_ns_profile"
          - "'nitro_sense_native_controls_sufficient' in render_ns_main"
          - "'nitro_sense_use_out_of_tree' in render_ns_main"
          - render_ns_out.find('Compile the isolated build probe') < render_ns_out.find('Unload the in-tree Acer platform driver')
          - render_ns_out.find('Build and install the pinned module through DKMS') < render_ns_out.find('Unload the in-tree Acer platform driver')
          - "'/usr/bin/dkms' in render_ns_out"
          - "'requested_commit:' in render_ns_out"
          - "'resolved_commit:' in render_ns_out"
          - "'dkms_version:' in render_ns_out"
          - "'kernel:' in render_ns_out"
          - "'nitro_sense_stamp | dirname' in render_ns_out"
          - "'state: directory' in render_ns_out"
          - "'state: absent' in render_ns_rollback"
          - "'nitro_sense_managed_replacement' in render_ns_rollback"
          - "'nitro_sense_replacement_marker' in render_ns_rollback"
          - "'nitro_sense_blacklist_path' in render_ns_rollback"
          - "'nitro_sense_modules_load_path' in render_ns_rollback"
          - "'brick_stamp_dir }}/nitro_sense' in render_ns_rollback"
          - >-
            render_ns_rollback is search(
              'Restore the in-tree Acer platform driver[\\s\\S]{0,240}' ~
              'name: "\\{\\{ nitro_sense_in_tree_module_name \\}\\}"[\\s\\S]{0,100}' ~
              'state: present')
          - >-
            nitro_sense_fan_speed_path ==
            '/sys/module/linuwu_sense/drivers/platform:acer-wmi/acer-wmi/nitro_sense/fan_speed'
          - >-
            nitro_sense_led_per_zone_path ==
            '/sys/module/linuwu_sense/drivers/platform:acer-wmi/acer-wmi/four_zoned_kb/per_zone_mode'
          - >-
            nitro_sense_led_effect_path ==
            '/sys/module/linuwu_sense/drivers/platform:acer-wmi/acer-wmi/four_zoned_kb/four_zone_mode'
          - "nitro_sense_fan_speed_path in render_ns_helper"
          - "nitro_sense_led_per_zone_path in render_ns_helper"
          - "nitro_sense_led_effect_path in render_ns_helper"
          - "'Required documented sysfs node is missing' in render_ns_helper"
          - "'After=systemd-modules-load.service' in render_ns_unit"
          - "'AUTOINSTALL=\"yes\"' in render_ns_dkms"
          - "'BUILT_MODULE_LOCATION[0]=\"src\"' in render_ns_dkms"
          - "'${kernelver}' in render_ns_dkms"
          - "'creates:' not in render_ns_out"
          - "'ansible_kernel' not in render_ns_all_tasks"
          - "'foundation.yml' in render_ns_docs"
          - "'lab.yml' in render_ns_docs"
          - "'Per-key RGB is not provided by this hardware path' in render_ns_docs"
          - "'Nitro AN515-55' in render_ns_docs"
          - "'nitro_sense' in render_ns_readme"
        fail_msg: >-
          A Nitro Sense invariant broke. The optional role must remain outside
          broad targets, prefer the generic native profile ABI, build the exact
          full pin against linux-hardened before touching acer_wmi, use only
          documented sysfs nodes and retain an executable rollback to acer_wmi.
        quiet: true
      vars:
        render_ns_main: "{{ render_ns.results[0].content | b64decode }}"
        render_ns_preflight: "{{ render_ns.results[1].content | b64decode }}"
        render_ns_profile: "{{ render_ns.results[2].content | b64decode }}"
        render_ns_out: "{{ render_ns.results[3].content | b64decode }}"
        render_ns_rollback: "{{ render_ns.results[4].content | b64decode }}"
        render_ns_configure: "{{ render_ns.results[5].content | b64decode }}"
        render_ns_play: "{{ render_ns.results[6].content | b64decode | from_yaml }}"
        render_ns_foundation: "{{ render_ns.results[7].content | b64decode | from_yaml }}"
        render_ns_lab: "{{ render_ns.results[8].content | b64decode | from_yaml }}"
        render_ns_docs: >-
          {{ (render_ns.results[9].content | b64decode) ~
             (render_ns.results[10].content | b64decode) }}
        render_ns_readme: "{{ render_ns.results[11].content | b64decode }}"
        render_ns_helper: "{{ render_ns.results[12].content | b64decode }}"
        render_ns_unit: "{{ render_ns.results[13].content | b64decode }}"
        render_ns_dkms: "{{ render_ns.results[14].content | b64decode }}"
        render_ns_makefile: "{{ render_ns.results[15].content | b64decode }}"
        render_ns_all_tasks: >-
          {{ render_ns_main ~ render_ns_preflight ~ render_ns_profile ~
             render_ns_out ~ render_ns_rollback ~ render_ns_configure }}

    - name: Remove the Nitro Sense rendering workspace
      tags: [nitro_sense_render]
      ansible.builtin.file:
        path: "{{ render_ns_ws.path }}"
        state: absent

    - name: Make the input rendering workspace
      ansible.builtin.tempfile:
        state: directory
        suffix: .render
      register: render_input_ws

    - name: Render the per-machine input template three ways
      ansible.builtin.template:
        src: "{{ repo_root }}/roles/host_desktop_sway/templates/sway-input.conf.j2"
        dest: "{{ render_input_ws.path }}/{{ item.name }}.conf"
        mode: "0644"
      vars:
        host_desktop_sway_input: "{{ item.input }}"
        render_input_fallback_map: >-
          {{ (render_cockpit.results[0].content | b64decode | from_yaml).host_desktop_sway_input_defaults }}
        render_hw_profiles: >-
          {{ (lookup('file', repo_root ~ '/group_vars/all/hardware.yml') | from_yaml).host_profiles }}
      loop:
        - name: fallback
          input: "{{ render_input_fallback_map }}"
        - name: optional
          input: >-
            {{ render_input_fallback_map | combine({
                 'keyboard_variant': 'us',
                 'keyboard_options': 'ctrl:nocaps'}, recursive=true) }}
        - name: nitro
          input: >-
            {{ render_input_fallback_map | combine(
                 render_hw_profiles['nitro-3060'].desktop, recursive=true) }}

    - name: Read back what the template produced
      ansible.builtin.slurp:
        src: "{{ render_input_ws.path }}/{{ item }}.conf"
      register: render_input_out
      loop:
        - fallback
        - optional
        - nitro

    - name: Per-machine input invariants (values, not mentions)
      ansible.builtin.assert:
        that:
          - "'xkb_layout it,us,ara' in render_input_fallback"
          - render_input_fallback | select('match', 'xkb_variant') | list | length == 0
          - render_input_fallback | select('match', 'xkb_options') | list | length == 0
          - "'xkb_variant us,,' in render_input_optional"
          - "'xkb_options ctrl:nocaps' in render_input_optional"
          - render_input_touchpad == render_input_touchpad_expected
          - "'xkb_layout it,us,ara' in render_input_nitro"
          - "'XF86Presentation' not in render_input_fallback"
          - "'XF86Presentation' not in render_input_optional"
          - >-
            render_input_nitro | select(
              'equalto',
              'bindsym --no-repeat --input-device=1:1:AT_Translated_Set_2_keyboard XF86Presentation exec /usr/local/bin/privatestack-theme cycle')
            | list | length == 1
          - render_hw_profiles | dict2items | rejectattr('value.desktop', 'defined') | list | length == 0
        quiet: true
      vars:
        render_input_fallback: "{{ (render_input_out.results[0].content | b64decode).splitlines() | map('trim') | list }}"
        render_input_optional: "{{ (render_input_out.results[1].content | b64decode).splitlines() | map('trim') | list }}"
        render_input_nitro: "{{ (render_input_out.results[2].content | b64decode).splitlines() | map('trim') | list }}"
        render_input_touchpad: >-
          {{ render_input_fallback | select('search', '^(dwt|middle_emulation|natural_scroll|tap) ') | list }}
        render_input_touchpad_expected:
          - dwt enabled
          - middle_emulation enabled
          - natural_scroll enabled
          - tap enabled
        render_hw_profiles: >-
          {{ (lookup('file', repo_root ~ '/group_vars/all/hardware.yml') | from_yaml).host_profiles }}

    - name: Remove the input rendering workspace
      ansible.builtin.file:
        path: "{{ render_input_ws.path }}"
        state: absent
