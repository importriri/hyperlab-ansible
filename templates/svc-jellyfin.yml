---
schema_version: 1
id: svc-jellyfin
display_name: Jellyfin media service
version: "1.0"
# Draft until ADR 0031 decides how a service appliance is created from a
# Template, and debian-server is sealed.
status: draft
class: services
image: debian-server
description: >-
  The private Jellyfin appliance on the services network. Its address, its
  one exposed port and its backups come from service-specs/svc-jellyfin.yml.

lifecycles:
  permanent: true
  disposable: false

device_capabilities:
  standard: true
  vfio: false

gpu_handoff_profiles:
  clean: false
  dev: false
  dirty: false
  lab: false

network_allowlist: [services]

resource_profiles:
  minimum: false
  balanced: true
  performance: false
  custom: true

presentation:
  looking_glass_mode: disabled
  recovery_console: true
  workspace_profile: jellyfin

defaults:
  lifecycle: permanent
  device_capability: standard
  gpu_handoff_profile: null
  network_profile: services
  resource_profile: balanced
