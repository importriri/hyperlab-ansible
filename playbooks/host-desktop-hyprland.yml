---
# Side-by-side Host Hyprland non-active configuration mount.
#
# This playbook remains outside foundation.yml, lab.yml and the active Sway
# cockpit. It may install the reviewed user configuration and official
# prerequisites. Explicit lifecycle staging may install selectable HyperLab
# sessions and dormant user units, but may not select a Ly default, start a
# compositor, or replace the proven Sway recovery path.
- name: Install Host Hyprland non-active configuration
  hosts: hypervisor
  become: true
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: host_desktop_hyprland
    - host_desktop_hyprland
