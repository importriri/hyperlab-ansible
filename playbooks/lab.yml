---
# The core lab bundle, in dependency order. Desktop and Looking Glass remain
# opt-in so the secure headless host is still the default.
- name: Assemble the hypervisor lab host
  hosts: hypervisor
  become: true
  roles:
    - base
    - hardware_probe
    - kvm_host
    - vfio_boot
    - network_domains
    - lab_isolation
    - gpu_handoff
