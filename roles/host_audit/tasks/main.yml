---
- name: Install the audit daemon
  community.general.pacman:
    name: audit
    state: present

- name: Find which watched trust points exist
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ host_audit_watches }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_audit_stats

- name: Keep the watches on paths that exist
  ansible.builtin.set_fact:
    host_audit_present: >-
      {{ host_audit_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}

- name: Install HyperLab's audit rules
  ansible.builtin.template:
    src: 50-hyperlab.rules.j2
    dest: "{{ host_audit_rules_path }}"
    owner: root
    group: root
    mode: "0640"
  notify: Load the audit rules

- name: Send audit records to the journal too, for off-host shipping
  ansible.builtin.lineinfile:
    path: /etc/audit/plugins.d/syslog.conf
    regexp: '^active\s*='
    line: active = yes
  notify: Restart auditd

- name: Start auditd now and at every boot
  ansible.builtin.systemd_service:
    name: auditd.service
    enabled: true
    state: started

- name: Load the rules now
  ansible.builtin.meta: flush_handlers

- name: Read the loaded audit rules
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [auditctl, -l]
  register: host_audit_loaded
  changed_when: false

- name: Require every present trust point watched
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - ('-k ' ~ item.key) in host_audit_loaded.stdout or ('key=' ~ item.key) in host_audit_loaded.stdout
    fail_msg: "{{ item.path }} is not watched by the loaded audit rules."
    quiet: true
  loop: "{{ host_audit_present }}"
  loop_control:
    label: "{{ item.path }}"

- name: Record that the host_audit brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: host_audit
