---
# The optional cockpit. The lab bundle keeps the host blind (TTY): this
# brick is opt-in, mounted by playbooks/desktop.yml - never by lab.yml.
# On the host it rides the free iGPU: the dGPU belongs to gpu_handoff.
#
# sway, NOT swayfx and NOT a DE: official repos only (no AUR in bricks),
# one compositor, no dependency chain. The eye candy is theming
# (Catppuccin Mocha end to end), not a fork.
# ly is the display manager: console-grade, ~1 MB, no seat circus.
#
# The rice pass added rofi (launcher + power menu), papirus-icon-theme
# (rofi's icons) and cava (the waybar strip). rofi 2.0 absorbed the
# wayland fork: `rofi-wayland` is gone from the repos - the package
# `rofi` now Provides and Replaces it, so THAT is the name to install.
# The wallpaper ships with the role and lands in
# /usr/share/backgrounds/privatestack/: drop another PNG on that path to
# swap the backdrop without touching ansible.
desktop_packages:
  - sway
  - swaybg
  - swayidle
  - swaylock
  - waybar
  - rofi
  - foot
  - mako
  - grim
  - slurp
  - wl-clipboard
  - xdg-desktop-portal-wlr
  - xdg-user-dirs
  - brightnessctl
  - polkit
  - pipewire
  - pipewire-pulse
  - wireplumber
  - pamixer
  - cava
  - papirus-icon-theme
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - ly
  # navigation & shell productivity kit
  - starship
  - zoxide
  - fzf
  - eza
  - bat
  - ripgrep
  - fd
  - yazi
  - btop
