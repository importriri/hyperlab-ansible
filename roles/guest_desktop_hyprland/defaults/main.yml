---
guest_desktop_hyprland_packages:
  - hyprland
  - hypridle
  - hyprlock
  - hyprlauncher
  - hyprpicker
  - hyprpolkitagent
  - hyprsunset
  - awww
  - quickshell
  - ttf-ibm-plex
  - waybar
  - rofi
  - rofi-calc
  - kitty
  - kitty-shell-integration
  - kitty-terminfo
  - imagemagick
  - jq
  - python-pygments
  - thunar
  - tumbler
  - gvfs
  - thunar-archive-plugin
  - file-roller
  - mako
  - grim
  - slurp
  - wl-clipboard
  - cliphist
  - pipewire
  - pipewire-pulse
  - wireplumber
  - rtkit
  - alsa-utils
  - pamixer
  - playerctl
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - papirus-icon-theme
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - lua
  - ly

guest_desktop_hyprland_theme_default: hyperlab-workstation

# The desktop shell. `quickshell` runs the HyperLab Workspace Shell (Desks,
# launcher, status islands) and falls back to Waybar on its own when the
# shell fails; `waybar` keeps the plain bar.
guest_desktop_hyprland_shell: quickshell

# Quickshell API series the Workspace Shell was written against. Another
# series needs review before the shell is installed.
guest_desktop_hyprland_quickshell_series: "0.3"

# The rice profile of this guest. Every profile shares the same roles,
# shell, keys and security rules; a profile only chooses the theme it starts
# on, its wallpaper, its default Desks and the extra packages it needs. The
# playbook of each guest kind sets it, so a new Machine of that kind starts
# from the same rice instead of being riced again by hand.
guest_desktop_hyprland_profile: dev

# Wallpapers come from the reviewed product identity set in this repository
# and are verified against its manifest digest before they are installed.
# Only the 02 variants are used: they carry no words, so the guest paints no
# trust label of its own.
guest_desktop_hyprland_identity_assets: >-
  {{ guest_repository_root }}/themes/assets/hyperlab-trust-v2

guest_desktop_hyprland_profiles:
  dev:
    theme: hyperlab-workstation
    wallpaper: images/dev/02.png
    packages: []
    desks:
      - name: Programming
        blurb: Code, repositories and the terminals around them.
        projects: []
      - name: 3D Design
        blurb: Blender and CAD, with the GPU when the machine has one.
        projects: []
      - name: Research
        blurb: Reading, notes and documentation.
        projects: []
      - name: Systems
        blurb: Ansible, networking and infrastructure work.
        projects: []
  # Official stores with real accounts: Steam, and Heroic for Epic and GOG.
  # Nothing modded or untrusted is ever installed here.
  gaming-clean:
    theme: hyperlab-gaming-clean
    wallpaper: images/clean/02.png
    multilib: true
    packages:
      - steam
      - gamemode
      - lib32-gamemode
      - lib32-mangohud
      - lib32-nvidia-utils
      - flatpak
    flatpaks:
      - com.heroicgameslauncher.hgl
    desks:
      - name: Play
        blurb: The game you are playing, alone on its Desk.
        projects: []
      - name: Stores
        blurb: Steam and Heroic, the only places games come from here.
        projects: []
      - name: Capture
        blurb: Screenshots, clips and recordings.
        projects: []
      - name: System
        blurb: Drivers, telemetry and settings.
        projects: []
  # Modded games and third-party launchers. Never a store account that owns
  # purchases: those stay in gaming-clean.
  gaming-dirty:
    theme: hyperlab-gaming-dirty
    wallpaper: images/dirty/02.png
    multilib: true
    packages:
      - lutris
      - wine
      - winetricks
      - gamemode
      - lib32-gamemode
      - lib32-mangohud
      - lib32-nvidia-utils
    flatpaks: []
    desks:
      - name: Play
        blurb: The game you are playing, alone on its Desk.
        projects: []
      - name: Modding
        blurb: Mod managers, archives and load orders.
        projects: []
      - name: Launchers
        blurb: Lutris and Wine prefixes.
        projects: []
      - name: System
        blurb: Drivers, telemetry and settings.
        projects: []

# The image's default Desks: the profile's, unless overridden. A user's own
# ~/.config/hyperlab-workspace/desks.json takes precedence. Desk n owns
# Hyprland workspaces n*10+1 .. n*10+9; at most nine Desks.
guest_desktop_hyprland_workspace_desks: >-
  {{ guest_desktop_hyprland_profiles[guest_desktop_hyprland_profile].desks }}

# Ordinary workstation guests keep interactive login. Dedicated appliance-style
# guests may opt into a persistent graphical session.
guest_desktop_hyprland_autologin: false
guest_desktop_hyprland_autologin_session: hyperlab-hyprland
guest_desktop_hyprland_autologin_exec: /usr/bin/start-hyprland

# Disabled for ordinary workstation guests. VFIO guests may opt in when
# Hyprland must start directly on a passed NVIDIA DRM node.
guest_desktop_hyprland_nvidia_only: false
guest_desktop_hyprland_nvidia_drm_device: /dev/dri/privatestack-nvidia
guest_desktop_hyprland_nvidia_ready_timeout_seconds: 90

# Ordinary guests keep the generic monitor rule. The accelerated VFIO
# workstation opts into Hyprland's automatic HEADLESS-0 output.
guest_desktop_hyprland_headless_monitor: false
guest_desktop_hyprland_headless_output: HEADLESS-0
guest_desktop_hyprland_headless_mode: "1920x1080@144"
guest_desktop_hyprland_headless_position: "0x0"
guest_desktop_hyprland_headless_scale: 1

guest_desktop_hyprland_theme_order:
  - hyperlab-workstation
  - hyperlab-gaming-clean
  - hyperlab-gaming-dirty
  - sakura-circuit
  - neon-terminal
  - moon-library
  - glitch-lab

guest_desktop_hyprland_palettes:
