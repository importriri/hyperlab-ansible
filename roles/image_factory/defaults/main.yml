---
image_factory_supported_operations:
  - prepare
  - validate

image_factory_plan_tool: "{{ image_factory_repository_root }}/tools/image_plan.py"
image_factory_inspect_tool: "{{ image_factory_repository_root }}/tools/image_inspect.py"
image_factory_receipt_guard_tool: "{{ image_factory_repository_root }}/tools/image_receipt_guard.py"
image_factory_schema_validator: "{{ image_factory_repository_root }}/tools/schema_select.py"
image_factory_windows_workshop_guard_tool: >-
  {{ image_factory_repository_root }}/tools/windows_workshop_guard.py
image_factory_receipt_root: "{{ hyperlab_root }}/state/images"
image_factory_lock_root: "{{ hyperlab_root }}/state/locks"

# Safe empty value for Linux images and before a Windows receipt has passed.
image_factory_windows_workshop: {}
