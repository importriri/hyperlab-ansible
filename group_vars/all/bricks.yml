---
# Brick prerequisites are executable policy. Unknown or unstamped dependencies
# must fail instead of behaving like an empty list.
brick_stamp_dir: /etc/privatestack/bricks

brick_requires:
  base: []
  hardware_probe: []
  kvm_host: [base]
  vfio_boot: [hardware_probe]
  network_domains: [kvm_host]
  lab_isolation: [network_domains]
  gpu_handoff: [network_domains]
  bootstrap_storage: [kvm_host]
  image_store: [kvm_host, bootstrap_storage]
  windows_workshop: [image_store, looking_glass]
  image_factory: [image_store]
  guest: [image_factory, network_domains]
  service_registry: [image_store, network_domains]
  service_exposure: [service_registry]
  jellyfin: []
  desktop: []
  workstation_kernel: []
  workstation_access: []
  guest_desktop_hyprland: [workstation_kernel, workstation_access]
  dev_ide: [guest_desktop_hyprland]
  looking_glass: [desktop, kvm_host]

# Point refusals at the narrowest playbook that can establish the prerequisite.
brick_playbooks:
  base: playbooks/kvm-host.yml
  hardware_probe: playbooks/preflight.yml
  kvm_host: playbooks/kvm-host.yml
  vfio_boot: playbooks/foundation.yml
  network_domains: playbooks/network-domains.yml
  lab_isolation: playbooks/foundation.yml
  gpu_handoff: playbooks/foundation.yml
  bootstrap_storage: playbooks/image-store.yml
  image_store: playbooks/image-store.yml
  windows_workshop: playbooks/windows-workshop.yml
  image_factory: playbooks/image-prepare.yml
  guest: playbooks/vm-create.yml
  service_registry: playbooks/service-register.yml
  service_exposure: playbooks/jellyfin.yml
  jellyfin: playbooks/jellyfin.yml
  desktop: playbooks/desktop.yml
  workstation_kernel: playbooks/guest-arch-hyprland.yml
  workstation_access: playbooks/guest-arch-hyprland.yml
  guest_desktop_hyprland: playbooks/guest-arch-hyprland.yml
  dev_ide: playbooks/guest-arch-dev.yml
  looking_glass: playbooks/looking-glass.yml
