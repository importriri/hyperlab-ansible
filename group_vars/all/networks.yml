---
# Five security domains. `isolated` deliberately omits libvirt's <forward>.
network_domains:
  - name: clean
    bridge: virbr-clean
    subnet: 10.10.1.0/24
    gateway: 10.10.1.1
    forward: nat
  - name: dirty
    bridge: virbr-dirty
    subnet: 10.10.2.0/24
    gateway: 10.10.2.1
    forward: nat
  - name: dev
    bridge: virbr-dev
    subnet: 10.10.3.0/24
    gateway: 10.10.3.1
    forward: nat
  - name: lab
    bridge: virbr-lab
    subnet: 10.10.4.0/24
    gateway: 10.10.4.1
    forward: isolated
  - name: services
    bridge: virbr-services
    subnet: 10.10.5.0/24
    gateway: 10.10.5.1
    forward: nat

# Domain trust - higher means cleaner. This maps security domains, not VM names.
gpu_trust_levels:
  clean: 3
  dev: 2
  dirty: 1
  lab: 0

# Exact libvirt domain names that may own the GPU. The hook receives a VM name,
# so rendering network names here would silently leave every real VFIO guest
# unguarded. Services is structurally impossible because it has no trust level.
gpu_domain_profiles:
  win11clean-valley: clean
  win11dirty-disposable: dirty
