---
# Targeted host-side Looking Glass reconciliation. lab.yml runs desktop first;
# the signed Windows host application and virtual display remain private guest
# work and therefore cannot be inferred from host automation.
- name: Mount the Looking Glass client
  hosts: hypervisor
  become: true
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: looking_glass
    - looking_glass
