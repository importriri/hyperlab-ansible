source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    grace = 1
}

background {
    monitor =
    path = $guest_lock_wallpaper
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.30
    outer_color = $guest_accent
    inner_color = $guest_surface
    font_color = $guest_foreground
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = Arch guest workstation
    color = $guest_foreground
    font_size = 24
    position = 0, 55
    halign = center
    valign = center
}
