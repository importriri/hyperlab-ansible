---
- name: Keep the NVIDIA driver contract inside workstation guests
  ansible.builtin.assert:
    that:
      - "'workstations' in group_names"
      - "'hypervisor' not in group_names"
      - ansible_facts['virtualization_role'] == 'guest'
      - ansible_facts['os_family'] == 'Archlinux'
      - "'-zen' in ansible_facts['kernel']"
      - guest_gpu_nvidia_vendor_id == '10de'
      - guest_gpu_nvidia_drm_alias is string
      - >-
        guest_gpu_nvidia_drm_alias is
        match('^/dev/dri/[A-Za-z0-9_.-]+$')
      - guest_gpu_nvidia_modules == ['nvidia', 'nvidia_modeset', 'nvidia_uvm', 'nvidia_drm']
    fail_msg: >-
      guest_gpu_nvidia is an Arch Zen workstation-guest brick for the reviewed
      NVIDIA passthrough path. It must never configure the physical host.

- name: Inspect the running Zen kernel build tree
  ansible.builtin.stat:
    path: "/usr/lib/modules/{{ ansible_facts['kernel'] }}/build"
    follow: true
  register: guest_gpu_nvidia_kernel_build

- name: Require matching headers before a DKMS transaction
  ansible.builtin.assert:
    that:
      - guest_gpu_nvidia_kernel_build.stat.exists | default(false)
      - guest_gpu_nvidia_kernel_build.stat.isdir | default(false)
    fail_msg: >-
      The running Zen kernel needs its matching build tree before NVIDIA DKMS
      can be reconciled. Apply workstation_kernel and reboot first.

- name: Install the guest PCI probe dependency
  community.general.pacman:
    name: "{{ guest_gpu_nvidia_probe_packages }}"
    state: present

- name: Detect NVIDIA PCI functions inside the guest
  ansible.builtin.command:
    argv:
      - /usr/bin/lspci
      - -Dn
      - -d
      - "{{ guest_gpu_nvidia_vendor_id }}:"
  register: guest_gpu_nvidia_lspci
  changed_when: false
  check_mode: false

- name: Refuse driver activation before the passed GPU is visible
  ansible.builtin.assert:
    that:
      - guest_gpu_nvidia_lspci.stdout_lines | length >= 1
      - >-
        guest_gpu_nvidia_lspci.stdout is
        search('(?i)\\b' ~ guest_gpu_nvidia_vendor_id ~ ':')
    fail_msg: >-
      No NVIDIA PCI function is visible inside this guest. Attach the reviewed
      GPU and audio functions through the VFIO VM transaction before applying
      guest_gpu_nvidia.

- name: Identify the passed NVIDIA display controller
  ansible.builtin.set_fact:
    guest_gpu_nvidia_drm_pci_addresses: >-
      {{
        guest_gpu_nvidia_lspci.stdout
        | regex_findall(
            '^([0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}[.][0-7])'
            ~ '[ ]+03(?:00|02):[ ]+'
            ~ guest_gpu_nvidia_vendor_id
            ~ ':',
            multiline=true,
            ignorecase=true
          )
      }}

- name: Require exactly one passed NVIDIA display controller
  ansible.builtin.assert:
    that:
      - guest_gpu_nvidia_drm_pci_addresses | length == 1
    fail_msg: >-
      The guest must expose exactly one NVIDIA VGA or 3D controller before a
      deterministic DRM alias can be managed.

- name: Select the passed NVIDIA display controller
  ansible.builtin.set_fact:
    guest_gpu_nvidia_drm_pci_address: >-
      {{ guest_gpu_nvidia_drm_pci_addresses | first }}

- name: Install the official NVIDIA Wayland guest stack
  community.general.pacman:
    name: "{{ guest_gpu_nvidia_packages }}"
    state: present

- name: Persist the passed NVIDIA DRM alias
  ansible.builtin.template:
    src: 95-privatestack-nvidia-drm.rules.j2
    dest: /etc/udev/rules.d/95-privatestack-nvidia-drm.rules
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload guest NVIDIA udev rules
    - Retrigger the guest NVIDIA DRM device

- name: Verify the persistent NVIDIA DRM alias rule
  ansible.builtin.command:
    argv:
      - /usr/bin/udevadm
      - verify
      - /etc/udev/rules.d/95-privatestack-nvidia-drm.rules
  changed_when: false
  when: not ansible_check_mode

- name: Load the NVIDIA module set at guest boot
  ansible.builtin.copy:
    # systemd-modules-load treats each line as one module name, so
    # literal escape text would postpone this failure until the reboot gate.
    content: |
      {% for module in guest_gpu_nvidia_modules -%}
      {{ module }}
      {% endfor %}
    dest: /etc/modules-load.d/privatestack-nvidia.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild guest initramfs for NVIDIA

- name: Enable NVIDIA DRM kernel modesetting
  ansible.builtin.copy:
    src: privatestack-nvidia.conf
    dest: /etc/modprobe.d/privatestack-nvidia.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild guest initramfs for NVIDIA

- name: Keep nouveau away from the passed NVIDIA device
  ansible.builtin.copy:
    src: privatestack-nouveau.conf
    dest: /etc/modprobe.d/privatestack-nouveau.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild guest initramfs for NVIDIA

- name: Complete pending NVIDIA initramfs work
  ansible.builtin.meta: flush_handlers

- name: Resolve the managed NVIDIA DRM alias
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - -f
      - "{{ guest_gpu_nvidia_drm_alias }}"
  register: guest_gpu_nvidia_drm_alias_canonical
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Resolve the PCI-derived NVIDIA DRM path
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - -f
      - >-
        /dev/dri/by-path/pci-{{ guest_gpu_nvidia_drm_pci_address }}-card
  register: guest_gpu_nvidia_drm_by_path_canonical
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Require the persistent alias to select the passed NVIDIA card
  ansible.builtin.assert:
    that:
      - guest_gpu_nvidia_drm_alias_canonical.rc == 0
      - guest_gpu_nvidia_drm_by_path_canonical.rc == 0
      - guest_gpu_nvidia_drm_alias_canonical.stdout is match('^/dev/dri/card[0-9]+$')
      - >-
        guest_gpu_nvidia_drm_alias_canonical.stdout ==
        guest_gpu_nvidia_drm_by_path_canonical.stdout
    fail_msg: >-
      The managed NVIDIA DRM alias was not created for the selected passed
      display controller after reloading and retriggering udev.
  when: not ansible_check_mode

- name: Inspect the built NVIDIA kernel module
  ansible.builtin.command:
    argv:
      - /usr/bin/modinfo
      - -n
      - nvidia
  register: guest_gpu_nvidia_modinfo
  changed_when: false
  check_mode: false

# Arch aliases /lib to /usr/lib, so canonical comparison prevents a
# healthy DKMS build from being rejected only because modinfo chose
# the compatibility prefix.
- name: Resolve the built NVIDIA kernel module path
  ansible.builtin.command:
    argv:
      - /usr/bin/readlink
      - -f
      - "{{ guest_gpu_nvidia_modinfo.stdout }}"
  register: guest_gpu_nvidia_modinfo_canonical
  changed_when: false
  check_mode: false

- name: Require the built NVIDIA module to belong to the running kernel
  ansible.builtin.assert:
    that:
      - guest_gpu_nvidia_modinfo_canonical.stdout is match('^/usr/lib/modules/' ~ ansible_facts['kernel'] ~ '/')
    fail_msg: >-
      nvidia-open-dkms did not produce a module for the running Zen kernel.

- name: Record that the guest_gpu_nvidia brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: guest_gpu_nvidia
