---
- name: Check the systemd-boot entries directory
  ansible.builtin.stat:
    path: /boot/loader/entries
  register: vfio_boot_entries_dir

- name: Refuse without systemd-boot in place
  ansible.builtin.assert:
    that:
      - vfio_boot_entries_dir.stat.isdir | default(false)
    fail_msg: >-
      /boot/loader/entries is missing: this host does not look like it was
      built by arch-bootstrap (systemd-boot with a mounted ESP expected).

- name: Refuse boot rendering without validated VFIO IDs
  ansible.builtin.assert:
    that:
      - hardware_probe_vfio_ids_csv is defined
      - hardware_probe_vfio_ids_csv is string
      - >-
        hardware_probe_vfio_ids_csv is
        match('^[0-9a-f]{4}:[0-9a-f]{4}(,[0-9a-f]{4}:[0-9a-f]{4})+$')
    fail_msg: >-
      vfio_boot requires the validated hardware_probe_vfio_ids_csv fact.
      Run hardware_probe first; do not hand-write PCI IDs into boot profiles.

- name: Read the LUKS UUID at runtime
  ansible.builtin.command: cryptsetup luksUUID {{ luks_root_device }}
  register: vfio_boot_luks_raw
  changed_when: false
  check_mode: false

- name: Verify the UUID shape before it touches a boot entry
  ansible.builtin.assert:
    that:
      - vfio_boot_luks_raw.stdout is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: >-
      cryptsetup returned something that does not look like a LUKS UUID.
      Refusing to write boot entries.

- name: Pin the UUID for the templates
  ansible.builtin.set_fact:
    vfio_boot_luks_uuid: "{{ vfio_boot_luks_raw.stdout }}"

# The ESP is vfat: a file's mode there comes from the mount and chmod
# cannot change it, so a fixed 0644 is a change on every run
# (problems/vfio-boot-modes-on-vfat-esp.md). Ask for the mode the files will
# read; the tool refuses a mount it cannot decide or one that lets a user
# other than root write a boot entry or create one in a boot directory.
- name: Read the mount of every directory the boot files go into
  ansible.builtin.command:
    argv:
      - "{{ vfio_boot_findmnt_bin }}"
      - -J
      - -T
      - "{{ item }}"
      - -o
      - TARGET,FSTYPE,OPTIONS
  loop:
    - /boot/loader
    - /boot/loader/entries
  register: vfio_boot_esp_mounts
  changed_when: false
  check_mode: false

- name: Decide the file mode the ESP keeps
  ansible.builtin.command:
    argv:
      - "{{ vfio_boot_python_bin }}"
      - "{{ vfio_boot_mode_tool }}"
      - --wanted
      - "{{ vfio_boot_file_mode }}"
    stdin: "{{ vfio_boot_esp_mounts.results | map(attribute='stdout') | list | to_json }}"
  register: vfio_boot_esp_mode
  changed_when: false
  check_mode: false

- name: Pin the boot files' mode
  ansible.builtin.set_fact:
    vfio_boot_loader_file_mode: "{{ vfio_boot_esp_mode.stdout }}"

- name: Refuse a boot file mode that is not a 0NNN string
  ansible.builtin.assert:
    that:
      - vfio_boot_loader_file_mode is string
      - vfio_boot_loader_file_mode is match('^0[0-7]{3}$')
    fail_msg: >-
      tools/esp_file_mode.py answered {{ vfio_boot_loader_file_mode }}, not a
      mode such as 0755. Refusing to write under /boot.

- name: Install the boot profiles
  ansible.builtin.template:
    src: entry.conf.j2
    dest: /boot/loader/entries/{{ item.file }}
    owner: root
    group: root
    mode: "{{ vfio_boot_loader_file_mode }}"
  loop: "{{ vfio_boot_profiles }}"
  loop_control:
    label: "{{ item.file }}"

- name: Early-bind vfio in the initramfs
  ansible.builtin.copy:
    src: 10-vfio.conf
    dest: /etc/mkinitcpio.conf.d/10-vfio.conf
    owner: root
    group: root
    mode: "0644"
  notify: Regenerate the initramfs

- name: Make VFIO the normal laboratory boot path
  ansible.builtin.lineinfile:
    path: /boot/loader/loader.conf
    regexp: '^default '
    line: default Arch-Linux-Hardened-Vfio.conf
    mode: "{{ vfio_boot_loader_file_mode }}"

- name: Retire the installer's unguarded bootstrap entry
  ansible.builtin.file:
    path: /boot/loader/entries/arch-hardened.conf
    state: absent

- name: Record that the vfio_boot brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: vfio_boot
