---
- name: Install the IDE stack from official Arch repositories
  community.general.pacman:
    name: "{{ dev_ide_packages }}"
    state: present

- name: Install the pinned Eclipse JDT language server
  ansible.builtin.include_tasks: jdtls.yml

- name: Install the language servers from npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ dev_ide_npm_globals }}"

- name: Create the emacs config directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/emacs"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Provision the managed Emacs package set
  become: true
  become_user: "{{ admin_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/emacs
      - --batch
      - -Q
      - --eval
      - |-
        (progn
          (require 'package)
          (require 'seq)
          (setq user-emacs-directory
                (expand-file-name ".config/emacs/" (getenv "HOME")))
          (setq package-user-dir
                (expand-file-name "elpa" user-emacs-directory))
          (add-to-list
           'package-archives
           '("melpa" . "https://melpa.org/packages/")
           t)
          (package-initialize)
          (let* ((wanted
                  '({% for package in dev_ide_emacs_packages %}{{ package }}{% if not loop.last %} {% endif %}{% endfor %}))
                 (missing
                  (seq-filter
                   (lambda (pkg) (not (package-installed-p pkg)))
                   wanted)))
            (if (null missing)
                (princ "HYPERLAB_EMACS_PACKAGES_OK\n")
              (package-refresh-contents)
              (dolist (pkg missing)
                (unless (assq pkg package-archive-contents)
                  (error "required Emacs package is unavailable: %s" pkg))
                (package-install pkg))
              (princ "HYPERLAB_EMACS_PACKAGES_CHANGED\n"))))
  environment:
    HOME: "/home/{{ admin_user }}"
    XDG_CONFIG_HOME: "/home/{{ admin_user }}/.config"
  register: dev_ide_emacs_package_bootstrap
  changed_when: >-
    'HYPERLAB_EMACS_PACKAGES_CHANGED'
    in dev_ide_emacs_package_bootstrap.stdout

- name: Deploy the emacs configuration
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/home/{{ admin_user }}/.config/emacs/{{ item }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop:
    - early-init.el
    - init.el

- name: Point the shell at the IDE (managed block, reversible)
  ansible.builtin.blockinfile:
    path: "/home/{{ admin_user }}/.bashrc"
    create: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    marker: "# {mark} privatestack dev_ide brick"
    block: |
      export EDITOR=emacs

- name: Record that the dev_ide brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: dev_ide
