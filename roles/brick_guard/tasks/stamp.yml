---
- name: Make the brick record directory
  ansible.builtin.file:
    path: "{{ brick_stamp_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record that this brick landed
  ansible.builtin.copy:
    content: "{{ brick_guard_brick }}\n"
    dest: "{{ brick_stamp_dir }}/{{ brick_guard_brick }}"
    owner: root
    group: root
    mode: "0644"

- name: Publish the brick for later guards in this play
  ansible.builtin.set_fact:
    brick_guard_planned: >-
      {{ (brick_guard_planned + [brick_guard_brick]) | unique }}
  changed_when: false
