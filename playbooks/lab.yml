---
# The intended laptop target. Foundation stays reusable for a blind host; this
# playbook adds the cockpit because Looking Glass is how the GPU VM is used.
- name: Assemble the headless foundation first
  import_playbook: foundation.yml

- name: Add the local cockpit and Looking Glass transport
  hosts: hypervisor
  become: true
  gather_facts: true
  roles:
    - desktop
    - role: brick_guard
      vars:
        brick_guard_brick: looking_glass
    - looking_glass
