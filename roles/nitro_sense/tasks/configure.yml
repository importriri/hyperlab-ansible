---
- name: Create the managed helper directory
  ansible.builtin.file:
    path: "{{ nitro_sense_apply_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the fail-closed settings helper
  ansible.builtin.template:
    src: nitro-sense-apply.sh.j2
    dest: "{{ nitro_sense_apply_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Apply Nitro Sense settings

- name: Declare the systemd unit directory
  ansible.builtin.file:
    path: "{{ nitro_sense_apply_unit | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Persist settings after the selected platform driver loads
  ansible.builtin.template:
    src: nitro-sense-apply.service.j2
    dest: "{{ nitro_sense_apply_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply Nitro Sense settings

- name: Enable and start the settings service
  ansible.builtin.systemd_service:
    name: "{{ nitro_sense_apply_service }}"
    enabled: true
    state: started
    daemon_reload: true
  register: nitro_sense_apply_service_state

- name: Reapply persistent settings after a platform-driver transition
  ansible.builtin.systemd_service:
    name: "{{ nitro_sense_apply_service }}"
    state: restarted
  when:
    - not ansible_check_mode
    - nitro_sense_use_out_of_tree | bool
    - nitro_sense_module_transition_needed | default(false) | bool
    - not (nitro_sense_apply_service_state.changed | bool)

- name: Apply changed settings before validating them
  ansible.builtin.meta: flush_handlers


- name: Reconcile the effective Nitro policy before validation
  ansible.builtin.command:
    argv:
      - /usr/bin/bash
      - "{{ nitro_sense_apply_script }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - nitro_sense_use_out_of_tree | bool

- name: Mount the narrow Nitro runtime control backend
  ansible.builtin.include_tasks: control-backend.yml
  when: nitro_sense_use_out_of_tree | bool

- name: Read the reconciled battery limiter
  ansible.builtin.command:
    argv:
      - /usr/bin/cat
      - "{{ nitro_sense_battery_limiter_path }}"
  register: nitro_sense_battery_limiter_state
  changed_when: false

- name: Require battery hardware and broker observation to agree
  ansible.builtin.assert:
    that:
      - >-
        nitro_sense_battery_limiter_state.stdout | trim ==
        (nitro_sense_control_status_data.status.runtime.battery_limiter
         | ternary('1', '0'))
    fail_msg: >-
      The documented battery-limiter interface diverged from the reconciled
      runtime state observed by the Nitro broker.
