---
- name: Reload the udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Retrigger the kvmfr device
  ansible.builtin.command: udevadm trigger --subsystem-match=kvmfr --action=change
  changed_when: true

- name: Restart libvirtd for KVMFR cgroup policy
  ansible.builtin.systemd_service:
    name: "{{ looking_glass_libvirt_service }}"
    state: restarted

# libvirt reads its hook scripts when it starts. It is restarted only with
# no domain running; otherwise the change waits and the run says so.
- name: Read active domains before the SPICE hook reload
  listen: Restart libvirt for the SPICE directory hook
  ansible.builtin.command:
    argv: [virsh, list, --name]
  register: looking_glass_active_domains
  changed_when: false
  check_mode: false

- name: Refuse a libvirt restart while any domain is active
  listen: Restart libvirt for the SPICE directory hook
  ansible.builtin.assert:
    that:
      - looking_glass_active_domains.stdout_lines | reject('equalto', '') | list | length == 0
    fail_msg: >-
      Stop every libvirt domain before changing the SPICE directory hook. The
      hook file was written, but libvirt was not restarted and the change is
      not active yet.

- name: Restart libvirt for the SPICE directory hook
  ansible.builtin.systemd_service:
    name: "{{ looking_glass_libvirt_service }}"
    state: restarted
