---
- name: Validate the shared HyperLab desktop product contract
  ansible.builtin.assert:
    that:
      - host_desktop_common_product_contract.preferred_compositor == 'hyprland'
      - >-
        host_desktop_common_product_contract.supported_compositors
        == ['hyprland', 'sway']
      - host_desktop_common_product_contract.recovery_compositor == 'sway'
      - host_desktop_common_product_contract.parity_required
      - host_desktop_common_product_contract.trust_compositor_independent
      - host_desktop_common_product_contract.themes_compositor_independent
      - host_desktop_common_product_contract.shell.primary == 'quickshell'
      - host_desktop_common_product_contract.shell.phase == 2
      - host_desktop_common_product_contract.shell.scope == 'shared'
      - not host_desktop_common_product_contract.shell.fake_controls_allowed
      - >-
        host_desktop_common_product_contract.shell.backend_authority
        == ['hyperlabctl', 'specs', 'contracts']
      - host_desktop_common_trust_contract.owner == 'host'
      - not host_desktop_common_trust_contract.guest_self_assignment
      - host_desktop_common_trust_contract.classes.clean.level == 3
      - host_desktop_common_trust_contract.classes.dev.level == 2
      - host_desktop_common_trust_contract.classes.dirty.level == 1
      - host_desktop_common_trust_contract.classes.lab.level == 0
      - >-
        not host_desktop_common_trust_contract
        .classes.services.gpu_trust_rung
      - >-
        host_desktop_common_trust_contract
        .dirty_seamless_window_requires_host_badge
      - host_desktop_common_shell_stage.implementation == 'quickshell'
      - host_desktop_common_shell_stage.config_name == 'hyperlab'
      - >-
        host_desktop_common_shell_stage.config_root
        == '/etc/xdg/quickshell/hyperlab'
      - host_desktop_common_shell_stage.package == 'quickshell'
      - host_desktop_common_shell_stage.reviewed_api_series == '0.3'
      - not host_desktop_common_shell_stage.runtime_enabled
      - not host_desktop_common_shell_stage.replacement_enabled
      - host_desktop_common_shell_stage.waybar_fallback_required
      - host_desktop_common_shell_stage.gtk_surface_fallback_required
      - >-
        not
        host_desktop_common_shell_stage
        .compositor_specific_imports_allowed
      - host_desktop_common_shell_stage.read_only_runtime_data_enabled
      - >-
        host_desktop_common_shell_stage.read_only_status_bridge
        == '/usr/local/bin/privatestack-hyperlab'
      - >-
        host_desktop_common_shell_stage.trust_update_transport
        == 'event-stream'
      - host_desktop_common_shell_stage.slow_poll_seconds == 30
      - >-
        host_desktop_common_input_security.host_primary_modifier
        == 'SUPER'
      - >-
        host_desktop_common_input_security.guest_primary_modifier
        == 'ALT'
      - host_desktop_common_input_security.modifiers_must_differ
      - >-
        host_desktop_common_input_security.host_primary_modifier
        != host_desktop_common_input_security.guest_primary_modifier
      - >-
        host_desktop_common_input_security.looking_glass_escape_key
        == 'KEY_RIGHTCTRL'
      - >-
        host_desktop_common_input_security.guest_exposure_default
        == 'deny'
      - >-
        host_desktop_common_input_security.guest_allowed_exposure
        == ['guest-local', 'transport-safe']
      - >-
        host_desktop_common_input_security.guest_forbidden_exposure
        ==
        [
          'host-only',
          'privileged',
          'recovery-sensitive',
          'hypervisor-internal'
        ]
      - >-
        not
        host_desktop_common_input_security
        .guest_may_receive_host_inventory
      - >-
        not
        host_desktop_common_input_security
        .guest_may_receive_other_domain_inventory
      - >-
        not
        host_desktop_common_input_security
        .guest_may_receive_host_paths
      - >-
        not
        host_desktop_common_input_security
        .guest_may_receive_host_network_topology
      - >-
        not
        host_desktop_common_input_security
        .guest_may_receive_hypervisor_control_routes
    fail_msg: >-
      HyperLab must remain one compositor-independent desktop product.
      Hyprland is preferred and Sway is the recovery compositor, but trust,
      themes, shell surfaces and product behavior must remain equivalent.

- name: Install the reviewed shared Quickshell runtime
  community.general.pacman:
    name: "{{ host_desktop_common_shell_stage.package }}"
    state: present

- name: Read package facts after shared shell runtime installation
  ansible.builtin.package_facts:
    manager: auto
  when: not ansible_check_mode

- name: Verify the reviewed Quickshell API series
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_common_shell_stage.package
        in ansible_facts.packages
      - >-
        ansible_facts.packages[
          host_desktop_common_shell_stage.package
        ][0].version
        is match('^0\\.3\\.')
    fail_msg: >-
      HyperLab Phase 2A supports the reviewed Quickshell 0.3 API series.
      A different upstream API series requires contract review before the
      shared shell can be installed.
  when: not ansible_check_mode

- name: Create the shared HyperLab Quickshell config directory
  ansible.builtin.file:
    path: "{{ host_desktop_common_shell_stage.config_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the non-active shared HyperLab Quickshell source
  ansible.builtin.copy:
    src: quickshell/hyperlab/
    dest: "{{ host_desktop_common_shell_stage.config_root }}/"
    owner: root
    group: root
    mode: "0644"

- name: Inspect installed shared HyperLab Quickshell files
  ansible.builtin.stat:
    path: "{{ host_desktop_common_shell_stage.config_root }}/{{ item }}"
    follow: false
  register: host_desktop_common_shell_installed
  loop:
    - shell.qml
    - HyperLabBar.qml
  when: not ansible_check_mode

- name: Verify installed shared HyperLab Quickshell files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == '0644'
    fail_msg: >-
      Installed HyperLab shared shell source has invalid ownership or mode.
  loop: "{{ host_desktop_common_shell_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Preserve recovery surfaces while Quickshell remains non-active
  ansible.builtin.assert:
    that:
      - not host_desktop_common_shell_stage.runtime_enabled
      - not host_desktop_common_shell_stage.replacement_enabled
      - host_desktop_common_shell_stage.waybar_fallback_required
      - host_desktop_common_shell_stage.gtk_surface_fallback_required
    fail_msg: >-
      Phase 2A may stage Quickshell only. Waybar and the existing GTK
      HyperLab surfaces remain authoritative until physical compositor parity
      is proven.

- name: Install the shared host compositor adapter
  ansible.builtin.copy:
    src: privatestack-compositor-adapter.sh
    dest: /usr/local/bin/privatestack-compositor-adapter
    owner: root
    group: root
    mode: "0755"

- name: Install the shared host session lifecycle controller
  ansible.builtin.copy:
    src: privatestack-session-lifecycle.sh
    dest: /usr/local/bin/privatestack-session-lifecycle
    owner: root
    group: root
    mode: "0755"

- name: Record that the host_desktop_common brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: host_desktop_common
