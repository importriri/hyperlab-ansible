---
- name: Retire the resident HyperLab Control Center
  become: true
  become_user: "{{ admin_user }}"
  ansible.builtin.script:
    cmd: "{{ role_path }}/../host_desktop_common/handlers/refresh.py control-center"
    executable: /usr/bin/python
  when:
    - not ansible_check_mode
    - >-
      host_desktop_sway_cockpit_helpers.results
      | selectattr('item.src', 'equalto', 'privatestack-hyperlab-domains.py')
      | selectattr('changed', 'equalto', true)
      | list | length == 1
