---
schema_version: 1
id: server-debian
display_name: Debian Server
version: "1.0"
# Draft: the sealed upstream debian image has no QEMU Guest Agent, so a
# new Machine's SSH host key could not be read and pinned. It returns to
# ready on debian-server, the Workbench capture that carries the agent.
status: draft
class: server
image: debian-server
description: >-
  A headless Debian Machine reached over SSH only: the Debian cloud image with
  QEMU Guest Agent, sealed through the Workbench, the account and key from
  cloud-init, no desktop and no GPU.

lifecycles:
  permanent: true
  disposable: true

device_capabilities:
  standard: true
  vfio: false

gpu_handoff_profiles:
  clean: false
  dev: false
  dirty: false
  lab: false

network_allowlist: [dev, services, lab]

resource_profiles:
  minimum: false
  balanced: true
  performance: false
  custom: true

presentation:
  looking_glass_mode: disabled
  recovery_console: true
  workspace_profile: server

defaults:
  lifecycle: permanent
  device_capability: standard
  gpu_handoff_profile: null
  network_profile: dev
  resource_profile: balanced
