---
- name: Keep host Hyprland configuration side-by-side and inactive
  ansible.builtin.assert:
    that:
      - "'hypervisor' in group_names"
      - "'workstations' not in group_names"
      - admin_user is string
      - admin_user | length > 0
      - admin_user != 'root'
      - host_desktop_hyprland_phase == 'non-active-config'
      - host_desktop_hyprland_config_install_enabled
      - not host_desktop_hyprland_runtime_enabled
      - not host_desktop_hyprland_session_activation_enabled
      - not host_desktop_hyprland_manage_ly
      - host_desktop_hyprland_preserve_sway_fallback
      - host_desktop_hyprland_preserve_waybar_fallback
    fail_msg: >-
      The non-active configuration phase may install reviewed user config
      only. It may not activate Hyprland, change Ly, or replace the proven
      Sway/Waybar recovery surfaces.

- name: Validate the official Hyprland prerequisite package contract
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_hyprland_prerequisite_packages
        ==
        [
          'hyprland',
          'hypridle',
          'hyprlock',
          'hyprpaper',
          'hyprshutdown',
          'hyprpolkitagent',
          'xdg-desktop-portal',
          'xdg-desktop-portal-hyprland',
          'xdg-desktop-portal-gtk'
        ]
      - "'quickshell' not in host_desktop_hyprland_prerequisite_packages"
      - "'uwsm' not in host_desktop_hyprland_prerequisite_packages"
      - host_desktop_hyprland_input_defaults.keyboard_layout == 'it'
      - >-
        host_desktop_hyprland_input_defaults.keyboard_layout_cycle
        == ['it', 'us', 'ara']
    fail_msg: >-
      Host Hyprland prerequisites no longer match the reviewed official-package
      and input baseline.

- name: Validate host-owned trust semantics
  ansible.builtin.assert:
    that:
      - host_desktop_common_trust_contract.owner == 'host'
      - not host_desktop_common_trust_contract.guest_self_assignment
      - host_desktop_common_trust_contract.classes.clean.level == 3
      - host_desktop_common_trust_contract.classes.dev.level == 2
      - host_desktop_common_trust_contract.classes.dirty.level == 1
      - host_desktop_common_trust_contract.classes.lab.level == 0
      - >-
        not
        host_desktop_common_trust_contract.classes.services.gpu_trust_rung
      - >-
        host_desktop_common_trust_contract
        .dirty_seamless_window_requires_host_badge
    fail_msg: >-
      Host Hyprland presentation may consume trust identity but may not weaken,
      redefine or delegate the HyperLab trust contract.

- name: Validate the shared HyperLab shell boundary before implementation
  ansible.builtin.assert:
    that:
      - host_desktop_common_product_contract.preferred_compositor == 'hyprland'
      - >-
        host_desktop_common_product_contract.supported_compositors
        == ['hyprland', 'sway']
      - host_desktop_common_product_contract.recovery_compositor == 'sway'
      - host_desktop_common_product_contract.parity_required
      - host_desktop_common_product_contract.trust_compositor_independent
      - host_desktop_common_product_contract.themes_compositor_independent
      - host_desktop_common_product_contract.shell.primary == 'quickshell'
      - host_desktop_common_product_contract.shell.phase == 2
      - host_desktop_common_product_contract.shell.scope == 'shared'
      - not host_desktop_common_product_contract.shell.fake_controls_allowed
      - >-
        host_desktop_common_product_contract.shell.backend_authority
        == ['hyperlabctl', 'specs', 'contracts']
    fail_msg: >-
      The HyperLab Shell is shared by Hyprland and Sway. It must not invent
      backend state, fork product semantics, or become an operational authority.

- name: Install the official Host Hyprland prerequisite stack
  community.general.pacman:
    name: "{{ host_desktop_hyprland_prerequisite_packages }}"
    state: present

- name: Read installed package facts after prerequisite installation
  ansible.builtin.package_facts:
    manager: auto
  when: not ansible_check_mode

- name: Verify every Host Hyprland prerequisite package is installed
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: >-
      Required Host Hyprland prerequisite package {{ item }} is not installed.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_packages }}"
  when: not ansible_check_mode

- name: Inspect package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: host_desktop_hyprland_prerequisite_path_stats
  loop: "{{ host_desktop_hyprland_prerequisite_paths }}"
  loop_control:
    label: "{{ item.path }}"
  when: not ansible_check_mode

- name: Verify package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - >-
        (not item.item.executable)
        or (item.stat.executable | default(false))
    fail_msg: >-
      Required Host Hyprland package artifact {{ item.item.path }} is missing
      or has an invalid executable contract.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_path_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not ansible_check_mode

- name: Inspect the Host Hyprland config directory before installation
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_config_dir }}"
    follow: false
  register: host_desktop_hyprland_config_dir_before

- name: Inspect the persisted HyperLab theme
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_theme_state_file }}"
    follow: false
  register: host_desktop_hyprland_theme_state

- name: Read the persisted HyperLab theme
  ansible.builtin.slurp:
    src: "{{ host_desktop_hyprland_theme_state_file }}"
  register: host_desktop_hyprland_theme_content
  when: host_desktop_hyprland_theme_state.stat.exists | default(false)

- name: Resolve the active Host Hyprland palette
  ansible.builtin.set_fact:
    host_desktop_hyprland_active_theme: >-
      {{
        (
          host_desktop_hyprland_theme_content.content
          | b64decode
          | trim
        )
        if
          (host_desktop_hyprland_theme_state.stat.exists | default(false))
        else
          host_desktop_hyprland_palette_fallback
      }}

- name: Refuse an unknown persisted Host Hyprland palette
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_hyprland_active_theme
        in host_desktop_hyprland_palette_variants
    fail_msg: >-
      Persisted HyperLab theme
      {{ host_desktop_hyprland_active_theme }}
      is not a reviewed Host Hyprland palette.

- name: Inspect the selected Host Hyprland palette source
  ansible.builtin.stat:
    path: >-
      {{ host_desktop_hyprland_palette_root }}/{{ host_desktop_hyprland_active_theme }}/hyperlab-palette-hyprland.lua
    follow: false
  register: host_desktop_hyprland_palette_source

- name: Require the selected Host Hyprland palette source
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_palette_source.stat.exists | default(false)
      - host_desktop_hyprland_palette_source.stat.isreg | default(false)
      - host_desktop_hyprland_palette_source.stat.readable | default(false)
    fail_msg: >-
      The selected Host Hyprland palette source is missing or unreadable.

- name: Create the non-active Host Hyprland config directory
  ansible.builtin.file:
    path: "{{ host_desktop_hyprland_config_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Render the non-active Host Hyprland user configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ host_desktop_hyprland_config_dir }}/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop: "{{ host_desktop_hyprland_config_templates }}"
  loop_control:
    label: "{{ item.dest }}"
  when: >-
    (not ansible_check_mode)
    or
    (host_desktop_hyprland_config_dir_before.stat.isdir | default(false))

- name: Install the active Host Hyprland palette module
  ansible.builtin.copy:
    src: >-
      {{ host_desktop_hyprland_palette_root }}/{{ host_desktop_hyprland_active_theme }}/hyperlab-palette-hyprland.lua
    dest: "{{ host_desktop_hyprland_config_dir }}/hyperlab_palette.lua"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  when: >-
    (not ansible_check_mode)
    or
    (host_desktop_hyprland_config_dir_before.stat.isdir | default(false))

- name: Inspect installed non-active Host Hyprland configuration
  ansible.builtin.stat:
    path: "{{ host_desktop_hyprland_config_dir }}/{{ item }}"
    follow: false
    checksum_algorithm: sha256
  register: host_desktop_hyprland_installed_config
  loop: >-
    {{
      (
        host_desktop_hyprland_config_templates
        | map(attribute='dest')
        | list
      )
      + ['hyperlab_palette.lua']
    }}
  when: not ansible_check_mode

- name: Verify installed non-active Host Hyprland configuration
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.pw_name == admin_user
      - item.stat.gr_name == admin_user
      - item.stat.mode == '0644'
    fail_msg: >-
      Installed non-active Host Hyprland config
      {{ item.item }} has invalid ownership or mode.
    quiet: true
  loop: "{{ host_desktop_hyprland_installed_config.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

- name: Validate the optional Host Hyprland session lifecycle boundary
  ansible.builtin.assert:
    that:
      - not host_desktop_hyprland_session_activation_enabled
      - not host_desktop_hyprland_manage_ly
      - host_desktop_hyprland_preserve_sway_fallback
      - host_desktop_hyprland_preserve_waybar_fallback
      - >-
        host_desktop_hyprland_session_entries
        == ['hyperlab-hyprland.desktop', 'hyperlab-sway.desktop']
      - >-
        host_desktop_hyprland_session_services
        ==
        [
          'hyperlab-hypridle.service',
          'hyperlab-hyprpaper.service',
          'hyperlab-mako.service'
        ]
    fail_msg: >-
      Lifecycle staging may add selectable sessions but may not select a Ly
      default, remove Sway or alter the reviewed helper set.
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Inspect Host session lifecycle prerequisites
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: host_desktop_hyprland_session_prerequisites
  loop:
    - /usr/lib/systemd/user/graphical-session.target
    - /usr/lib/systemd/user/hyprpolkitagent.service
    - /usr/bin/start-hyprland
    - /usr/bin/sway
    - /usr/bin/dbus-update-activation-environment
    - /usr/bin/jq
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Require Host session lifecycle prerequisites
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
    fail_msg: >-
      Required lifecycle artifact {{ item.item }} is missing.
    quiet: true
  loop: "{{ host_desktop_hyprland_session_prerequisites.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install the shared session controller for lifecycle staging
  ansible.builtin.copy:
    src: >-
      {{ role_path }}/../host_desktop_common/files/privatestack-session-lifecycle.sh
    dest: /usr/local/bin/privatestack-session-lifecycle
    owner: root
    group: root
    mode: "0755"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install selectable HyperLab host sessions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/share/wayland-sessions/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ host_desktop_hyprland_session_entries }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Create the private HyperLab Ly session catalog
  ansible.builtin.file:
    path: /etc/ly/hyperlab-sessions
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install only managed HyperLab sessions into the Ly catalog
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/ly/hyperlab-sessions/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ host_desktop_hyprland_session_entries }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Restrict Ly discovery to the managed HyperLab session catalog
  ansible.builtin.lineinfile:
    path: /etc/ly/config.ini
    regexp: '^{{ item.key | regex_escape }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    backup: false
  loop:
    - { key: custom_sessions, value: "/etc/ly/hyperlab-sessions" }
    - { key: waylandsessions, value: "null" }
    - { key: xsessions, value: "null" }
    - { key: xinitrc, value: "null" }
    - { key: shell, value: "false" }
  loop_control:
    label: "{{ item.key }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install the HyperLab Hyprland session target
  ansible.builtin.copy:
    src: hyperlab-hyprland-session.target
    dest: /etc/systemd/user/hyperlab-hyprland-session.target
    owner: root
    group: root
    mode: "0644"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install the HyperLab Sway session target
  ansible.builtin.copy:
    src: hyperlab-sway-session.target
    dest: /etc/systemd/user/hyperlab-sway-session.target
    owner: root
    group: root
    mode: "0644"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Install HyperLab Hyprland lifecycle services
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/user/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ host_desktop_hyprland_session_services }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Create HyperLab Hyprland target wants directory
  ansible.builtin.file:
    path: /etc/systemd/user/hyperlab-hyprland-session.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Couple HyperLab helpers to the managed Hyprland target
  ansible.builtin.file:
    src: "/etc/systemd/user/{{ item }}"
    dest: >-
      /etc/systemd/user/hyperlab-hyprland-session.target.wants/{{ item }}
    state: link
    force: true
  loop: "{{ host_desktop_hyprland_session_services }}"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Create hyprpolkitagent lifecycle drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/user/hyprpolkitagent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Bind package polkit agent to HyperLab Hyprland lifecycle
  ansible.builtin.copy:
    src: hyprpolkitagent-partof.conf
    dest: >-
      /etc/systemd/user/hyprpolkitagent.service.d/50-hyperlab-session.conf
    owner: root
    group: root
    mode: "0644"
  when: host_desktop_hyprland_session_lifecycle_enabled

- name: Couple package polkit agent to managed Hyprland target
  ansible.builtin.file:
    src: /usr/lib/systemd/user/hyprpolkitagent.service
    dest: >-
      /etc/systemd/user/hyperlab-hyprland-session.target.wants/hyprpolkitagent.service
    state: link
    force: true
  when: host_desktop_hyprland_session_lifecycle_enabled
