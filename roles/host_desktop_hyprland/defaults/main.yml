---
# Phase 1b installs only the official Hyprland runtime prerequisites.
# It does not write a Hyprland user configuration, change Ly, start Hyprland,
# replace Sway, or activate compositor-specific user services.
host_desktop_hyprland_phase: prerequisites
host_desktop_hyprland_runtime_enabled: false
host_desktop_hyprland_session_activation_enabled: false
host_desktop_hyprland_manage_ly: false

# hyperlabctl remains the source of operational truth. Future host integration
# must point at the same reviewed checkout contract used by the Sway cockpit.
host_desktop_hyprland_hyperlab_checkout: "/home/{{ admin_user }}/hyperlab-ansible"

# Sway and Waybar remain recovery surfaces throughout migration.
host_desktop_hyprland_preserve_sway_fallback: true
host_desktop_hyprland_preserve_waybar_fallback: true

# Official-repository prerequisite stack. Keep this deliberately narrow:
# shared Sway/Waybar desktop utilities are already owned by host_desktop_sway.
# Quickshell remains Phase 2 and uwsm remains a separate session-lifecycle
# decision.
host_desktop_hyprland_prerequisite_packages:
  - hyprland
  - hypridle
  - hyprlock
  - hyprpaper
  - hyprshutdown
  - hyprpolkitagent
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk

# Package-owned artifacts required before HyperLab writes any host Hyprland
# configuration. Merely installing these files must not start a compositor.
host_desktop_hyprland_prerequisite_paths:
  - path: /usr/bin/Hyprland
    executable: true
  - path: /usr/bin/hyprctl
    executable: true
  - path: /usr/bin/hypridle
    executable: true
  - path: /usr/bin/hyprlock
    executable: true
  - path: /usr/bin/hyprpaper
    executable: true
  - path: /usr/bin/hyprshutdown
    executable: true
  - path: /usr/lib/hyprpolkitagent/hyprpolkitagent
    executable: true
  - path: /usr/lib/xdg-desktop-portal-hyprland
    executable: true
  - path: /usr/share/wayland-sessions/hyprland.desktop
    executable: false
  - path: /usr/share/hypr/hyprland.lua
    executable: false
  - path: /usr/share/xdg-desktop-portal/hyprland-portals.conf
    executable: false

host_desktop_hyprland_input_defaults:
  keyboard_layout: it
  keyboard_layout_cycle:
    - it
    - us
    - ara
  keyboard_variant: ""
  keyboard_options: ""
  theme_cycle_binding: null
  touchpad:
    dwt: enabled
    middle_emulation: enabled
    natural_scroll: enabled
    tap: enabled

# Trust identity is host-owned. Presentation layers consume this contract;
# neither a guest nor a cosmetic theme may redefine its security meaning.
host_desktop_hyprland_trust_contract:
  owner: host
  guest_self_assignment: false
  classes:
    clean:
      level: 3
      gpu_trust_rung: true
    dev:
      level: 2
      gpu_trust_rung: true
    dirty:
      level: 1
      gpu_trust_rung: true
    lab:
      level: 0
      gpu_trust_rung: true
    services:
      level: null
      gpu_trust_rung: false
  dirty_seamless_window_requires_host_badge: true

# These existing helpers embed Sway-specific IPC and must not simply be copied
# into the Hyprland session. Later milestones split common policy/state from
# compositor-specific adapters.
host_desktop_hyprland_compositor_coupled_helpers: []

# Narrow backend adapter. High-level theme/input/trust policy remains outside
# this interface and the existing public helper command names are not rewired
# until the adapter has passed isolated fake-backend tests.
host_desktop_hyprland_compositor_adapter:
  api_version: 1
  future_installed_path: /usr/local/bin/privatestack-compositor-adapter
  high_level_helpers_rewired: true

# Phase 1 records the full parity target without pretending it is implemented.
host_desktop_hyprland_required_parity:
  - workspaces-1-9
  - move-to-workspace
  - focus-move-resize
  - fullscreen
  - floating
  - terminal
  - file-manager
  - launcher
  - power-menu
  - hyperlab-drawer
  - hyperlab-diagnostics
  - hyperlab-control-center
  - hyperlab-doctor
  - looking-glass
  - spice-console
  - audio-125
  - audio-mute
  - brightness
  - screenshot-full
  - screenshot-region
  - keyboard-cycle
  - machine-theme-key
  - theme-cycle
  - wallpaper-mode
  - wallpaper-daemon
  - lock
  - idle-dpms

host_desktop_hyprland_shell_target:
  primary: quickshell
  phase: 2
  fake_controls_allowed: false
  backend_authority:
    - hyperlabctl
    - specs
    - contracts
