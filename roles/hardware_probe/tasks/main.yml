---
- name: Install PCI discovery tooling
  community.general.pacman:
    name: pciutils
    state: present

- name: Read numeric PCI identities
  ansible.builtin.command:
    argv: [lspci, -Dn]
  register: hardware_probe_lspci
  changed_when: false
  check_mode: false

- name: Normalize detected PCI IDs
  ansible.builtin.set_fact:
    hardware_probe_detected_ids: >-
      {{ hardware_probe_lspci.stdout
         | regex_findall('(?i)\b[0-9a-f]{4}:[0-9a-f]{4}\b')
         | map('lower') | unique | sort | list }}
    hardware_probe_matches: []

- name: Create the local pipeline report directory
  ansible.builtin.file:
    path: "{{ hardware_probe_host_profile_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Select the host profile
  block:
    - name: Select the host profile from the detected PCI IDs
      ansible.builtin.include_tasks: select.yml
  rescue:
    - name: Leave the evidence needed to add an unknown machine
      when: host_profile == 'auto'
      ansible.builtin.copy:
        content: |-
          requested_host_profile: {{ host_profile | to_json }}
          complete_matches: {{ hardware_probe_matches | default([]) | to_json }}
          detected_pci_ids: {{ hardware_probe_detected_ids | to_json }}
          lspci_numeric: |
            {{ hardware_probe_lspci.stdout | indent(12) }}
        dest: "{{ hardware_probe_unknown_report_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Refuse an unknown, ambiguous or absent host profile
      ansible.builtin.fail:
        msg: >-
          Host profile selection failed for host_profile={{ host_profile }}:
          {{ ansible_failed_result.msg | default('see the task above') }}
          {{ ('Evidence: ' ~ hardware_probe_unknown_report_path) if host_profile == 'auto' else '' }}

- name: Say that this host passes no GPU through
  when: not hardware_probe_gpu_passthrough | bool
  ansible.builtin.debug:
    msg: >-
      Host profile {{ hardware_probe_selected_host_profile }} passes no GPU
      through (ADR 0052): vfio_boot and gpu_handoff are skipped, and a VFIO
      Machine is refused.

- name: Resolve the PCI address of every reviewed VFIO component
  when: hardware_probe_gpu_passthrough | bool
  ansible.builtin.command:
    argv: [lspci, -Dn, -d, "{{ item }}"]
  loop: "{{ host_profiles[hardware_probe_selected_host_profile].vfio_ids }}"
  register: hardware_probe_vfio_lspci
  changed_when: false
  check_mode: false

- name: Require one address for every reviewed VFIO component
  when: hardware_probe_gpu_passthrough | bool
  ansible.builtin.assert:
    that:
      - item.stdout_lines | length == 1
  loop: "{{ hardware_probe_vfio_lspci.results }}"

- name: Build the reviewed VFIO device record
  when: hardware_probe_gpu_passthrough | bool
  ansible.builtin.set_fact:
    hardware_probe_vfio_devices: >-
      {{ (hardware_probe_vfio_devices | default([])) +
         [{'id': item.item, 'pci': item.stdout_lines[0].split()[0]}] }}
  loop: "{{ hardware_probe_vfio_lspci.results }}"

- name: Publish the validated host facts
  ansible.builtin.set_fact:
    hardware_probe_vfio_ids_csv: >-
      {{ host_profiles[hardware_probe_selected_host_profile].vfio_ids | join(',') }}
    hardware_probe_gpu_pci: "{{ hardware_probe_vfio_devices[0].pci if hardware_probe_gpu_passthrough | bool else none }}"
    hardware_probe_gpu_audio_pci: "{{ hardware_probe_vfio_devices[1].pci if hardware_probe_gpu_passthrough | bool else none }}"
    hardware_probe_cpu_threads: "{{ ansible_facts['processor_vcpus'] | int }}"

- name: Record the selected host profile without serial numbers
  ansible.builtin.copy:
    content: |-
      host_profile: {{ hardware_probe_selected_host_profile }}
      label: {{ host_profiles[hardware_probe_selected_host_profile].label | to_json }}
      vfio_ids: {{ host_profiles[hardware_probe_selected_host_profile].vfio_ids | to_json }}
      gpu_passthrough: {{ hardware_probe_gpu_passthrough | bool | to_json }}
      vfio_devices: {{ hardware_probe_vfio_devices | default([]) | to_json }}
      gpu_pci: {{ hardware_probe_gpu_pci | to_json }}
      gpu_audio_pci: {{ hardware_probe_gpu_audio_pci | to_json }}
      cpu_threads: {{ hardware_probe_cpu_threads }}
      detected_pci_ids: {{ hardware_probe_detected_ids | to_json }}
    dest: "{{ hardware_probe_host_profile_report_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Record that the hardware_probe brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: hardware_probe
