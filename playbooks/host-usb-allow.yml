---
# Allow one blocked USB device (ADR 0038), once or permanently. The shell's
# USB devices view reaches this through the operation runner:
#   ansible-playbook playbooks/host-usb-allow.yml -K \
#     -e host_usb_allow_port=1-2 -e host_usb_allow_scope=once
# A device that presents a keyboard or mouse is refused; allow it from a
# terminal with `sudo usbguard allow-device <id>` after checking it.
- name: Allow one blocked USB device
  hosts: hypervisor
  become: true
  gather_facts: false
  tasks:
    - name: Allow the device through the host USB policy
      ansible.builtin.include_role:
        name: host_usbguard
        tasks_from: allow.yml
