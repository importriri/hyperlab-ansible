---
# HyperLab is one desktop product with two first-class compositor backends.
# Hyprland is the preferred experience; Sway remains fully supported and is
# also the recovery compositor. Product semantics must never fork by backend.
host_desktop_common_product_contract:
  preferred_compositor: hyprland
  supported_compositors:
    - hyprland
    - sway
  recovery_compositor: sway
  parity_required: true
  trust_compositor_independent: true
  themes_compositor_independent: true
  shell:
    primary: quickshell
    phase: 2
    scope: shared
    fake_controls_allowed: false
    backend_authority:
      - hyperlabctl
      - specs
      - contracts
  shared_surfaces:
    - trust-model
    - themes
    - hyperlab-shell
    - control-center
    - drawers
    - vm-workflows
    - wallpaper-policy
    - keyboard-policy
    - lock-policy
    - power-controls
    - security-semantics

# Trust identity belongs to the host and is independent from compositor and
# appearance theme.
host_desktop_common_trust_contract:
  owner: host
  guest_self_assignment: false
  classes:
    clean:
      level: 3
      gpu_trust_rung: true
    dev:
      level: 2
      gpu_trust_rung: true
    dirty:
      level: 1
      gpu_trust_rung: true
    lab:
      level: 0
      gpu_trust_rung: true
    services:
      level: null
      gpu_trust_rung: false
  dirty_seamless_window_requires_host_badge: true

# A HyperLab feature is not complete until both supported compositors provide
# the same product behavior. Only compositor-native implementation primitives
# may differ behind the shared adapter boundary.
host_desktop_common_required_parity:
  - workspaces-1-9
  - move-to-workspace
  - focus-move-resize
  - fullscreen
  - floating
  - terminal
  - file-manager
  - launcher
  - power-menu
  - hyperlab-drawer
  - hyperlab-diagnostics
  - hyperlab-control-center
  - hyperlab-doctor
  - looking-glass
  - spice-console
  - audio-125
  - audio-mute
  - brightness
  - screenshot-full
  - screenshot-region
  - keyboard-cycle
  - machine-theme-key
  - theme-cycle
  - wallpaper-mode
  - wallpaper-daemon
  - lock
  - idle-dpms

# Phase 2A installs the shared HyperLab Shell source and its reviewed runtime,
# but deliberately does not launch it or replace the proven recovery surfaces.
host_desktop_common_shell_stage:
  implementation: quickshell
  config_name: hyperlab
  config_root: /etc/xdg/quickshell/hyperlab
  package: quickshell
  reviewed_api_series: "0.3"
  runtime_enabled: false
  replacement_enabled: false
  waybar_fallback_required: true
  gtk_surface_fallback_required: true
  compositor_specific_imports_allowed: false
  read_only_runtime_data_enabled: true
  read_only_status_bridge: /usr/local/bin/privatestack-hyperlab
  trust_update_transport: event-stream
  slow_poll_seconds: 30
  workspace_state_enabled: true
  workspace_state_bridge: /usr/local/bin/privatestack-compositor-adapter
  workspace_update_transport: event-stream
  # Focused-surface provenance is resolved by the reviewed read-only
  # resolver from host-owned registrations and VM specifications. The
  # compositor identity of a window never assigns it.
  surface_provenance_bridge: /usr/local/bin/privatestack-surface-provenance
  surface_provenance_transport: correlated-stream
  # Focus provenance accents bind the focused window's border to the same
  # resolved provenance, per window. Keyboard RGB may follow the host trust
  # claim or the focused surface; off (operator colours untouched) remains
  # the default, and RGB is only driven under the trust-model theme.
  focus_accent_enabled: true
  focus_accent_bridge: /usr/local/bin/privatestack-focus-accent
  focus_accent_unit: hyperlab-focus-accent.service
  keyboard_rgb_modes:
    - "off"
    - system-trust
    - focus-trust
  keyboard_rgb_default_mode: "off"
  semantic_palette_enabled: true
  semantic_palette_user_path: .config/hyperlab/palette-quickshell.json
  telemetry_enabled: true
  telemetry_bridge: /usr/local/bin/privatestack-telemetry
  telemetry_poll_seconds: 30
  telemetry_fields:
    - temperature
    - network
    - audio
    - battery
  session_controls_enabled: true
  session_action_bridge: /usr/local/bin/privatestack-shell-actions
  session_state_transport: file-watch
  session_actions:
    - keyboard-cycle
    - wallpaper-mode-toggle
    - rgb-mode-toggle
    - theme-cycle
    - workspace-window-focus
    - session-lock
    - session-suspend
    - session-logout
    - session-reboot
    - session-poweroff
    - audio-mute-toggle
    - audio-volume-up
    - audio-volume-down
  # V447-C9 contextual shell. One long-running Quickshell process owns the
  # rail and summoned product surfaces. State, actions and appearance remain
  # behind reviewed bridges; presentation components cannot execute backend
  # commands directly.
  # V447-C9.3 HyperLab Platform shell. One long-running Quickshell process
  # owns the rail, the quiet idle desktop and the summoned surfaces; the three
  # product destinations share one ordinary compositor-managed window. State,
  # actions and appearance stay behind reviewed bridges, and presentation
  # components cannot execute backend commands directly.
  design_system: c9-platform
  surface_files:
    - shell.qml
    - Tokens.qml
    - Theme.qml
    - Icons.qml
    - ShellState.qml
    - ShellActions.qml
    - MachineActions.qml
    - ShellSurfaces.qml
    - ShellIpc.qml
    - ShellLabel.qml
    - ShellIcon.qml
    - ShellControl.qml
    - ShellDivider.qml
    - ShellCard.qml
    - PanelRow.qml
    - FocusFollow.qml
    - SectionHeader.qml
    - EmptyState.qml
    - DashedFrame.qml
    - IsolationGlyph.qml
    - ProvenanceMarker.qml
    - ProvenanceTag.qml
    - StateChip.qml
    - HardwareSocket.qml
    - PolicyCell.qml
    - ResourceMeter.qml
    - ActionFeedback.qml
    - OperationTracker.qml
    - ConfirmationSurface.qml
    - HyperLabBar.qml
    - IdentityMark.qml
    - WorkspaceStrip.qml
    - ContextCluster.qml
    - ProvenanceBadge.qml
    - GpuBadge.qml
    - SystemCluster.qml
    - ControlEntry.qml
    - HyperLabDesktop.qml
    - WorkspaceSurface.qml
    - WorkspaceFrame.qml
    - MachineStage.qml
    - MachineModule.qml
    - MachineListRow.qml
    - MachineContextPane.qml
    - ControlCenterView.qml
    - DiagnosticsView.qml
    - OwnershipInstrument.qml
    - HostFooter.qml
    - SystemPanel.qml
    - OsdSurface.qml
    - LauncherSurface.qml
  bridge_owner_files:
    - ShellState.qml
    - ShellActions.qml
    - MachineActions.qml
    - Theme.qml
  ipc_receiver_files:
    - ShellIpc.qml
  ipc_targets:
    - launcher
    - appearance
    - osd
    - panel
    - workspace
    - bar
  summoned_surfaces:
    - launcher
    - system-panel
    - osd
  # The product workspace is one ordinary window, not a permanently mapped
  # layer surface: it is opened deliberately, takes keyboard focus like any
  # other application and closes back to the quiet desktop.
  workspace_surface_kind: floating-window
  workspace_destinations:
    - machines
    - controls
    - diagnostics
  # The idle desktop is wallpaper, the rail and nothing else. It sits on the
  # bottom layer with an empty input region, so no click is intercepted by an
  # invisible surface.
  desktop_surface_enabled: true
  desktop_surface_layer: bottom
  desktop_surface_input: none
  # Machine operation availability is derived from live host state by the
  # reviewed machine bridge. Presentation never reconstructs lifecycle rules.
  machine_action_bridge: /usr/local/bin/privatestack-machine-actions
  machine_capability_source: bridge
  machine_verbs:
    - start
    - shutdown
    - reboot
    - console
    - ssh
    - looking-glass
    - force-stop
  machine_destructive_verbs:
    - force-stop
  # One reviewed parameterised host operation. Its only argument is a
  # compositor slot, validated in the shell and again by the bridge.
  parameterized_actions:
    - workspace-select
  # Who owns product navigation in each session. The shared role stages the
  # shell and never starts it; the Hyprland session routes every HyperLab
  # surface through the shell's reviewed IPC receivers, while Sway keeps the
  # Waybar and GTK surfaces as its recovery path. Both remain deployed.
  product_navigation:
    hyprland: quickshell
    sway: recovery

# V447-C7 composition tokens.
#
# One reviewed geometry scale for every host surface. Hyprland consumes these
# values through its template; Sway, Foot, Mako and the shared Quickshell token
# file repeat the same numbers and the C7 composition contract keeps them
# aligned. Motion and colour are deliberately not declared here: colour stays
# owned by the theme registry and motion is tuned at the physical gate.
host_desktop_composition:
  bar_height: 37
  gap_inner: 8
  gap_outer: 16
  border_size: 1
  radius_window: 10
  radius_surface: 12
  radius_control: 8
  shadow_enabled: true
  shadow_range: 18
  shadow_render_power: 3
  blur_enabled: false
  dim_inactive: true
  dim_strength: 0.06
  terminal_padding: 14
  notification_radius: 12
  notification_border: 1
  notification_padding: 14

# Keyboard ownership is a security boundary. Host and guest compositor
# namespaces are deliberately disjoint so focus/capture mistakes cannot turn
# one product shortcut into an unintended action on the other side.
host_desktop_common_input_security:
  host_primary_modifier: SUPER
  guest_primary_modifier: ALT
  modifiers_must_differ: true
  looking_glass_escape_key: KEY_RIGHTCTRL

  guest_exposure_default: deny
  guest_allowed_exposure:
    - guest-local
    - transport-safe
  guest_forbidden_exposure:
    - host-only
    - privileged
    - recovery-sensitive
    - hypervisor-internal

  guest_may_receive_host_inventory: false
  guest_may_receive_other_domain_inventory: false
  guest_may_receive_host_paths: false
  guest_may_receive_host_network_topology: false
  guest_may_receive_hypervisor_control_routes: false
