---
- name: Power-cycle one managed HyperLab VM through a full QEMU stop
  hosts: hypervisor
  become: true
  environment:
    LC_ALL: C
  vars:
    guest_operation: power-cycle
  roles:
    - role: brick_guard
      vars:
        brick_guard_brick: guest
    - guest

- name: Refresh the SSH identity of the new disposable boot as its owner
  ansible.builtin.import_playbook: vm-guest-inventory.yml
  when: guest_start_new_disposable_boot | default(false) | bool
