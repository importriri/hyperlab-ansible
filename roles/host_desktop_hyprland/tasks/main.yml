---
- name: Keep host Hyprland prerequisites side-by-side and inactive
  ansible.builtin.assert:
    that:
      - "'hypervisor' in group_names"
      - "'workstations' not in group_names"
      - admin_user is string
      - admin_user | length > 0
      - admin_user != 'root'
      - host_desktop_hyprland_phase == 'prerequisites'
      - not host_desktop_hyprland_runtime_enabled
      - not host_desktop_hyprland_session_activation_enabled
      - not host_desktop_hyprland_manage_ly
      - host_desktop_hyprland_preserve_sway_fallback
      - host_desktop_hyprland_preserve_waybar_fallback
    fail_msg: >-
      The prerequisite phase may install the official Hyprland package stack
      only. It may not activate Hyprland, change Ly, or replace the proven
      Sway/Waybar recovery surfaces.

- name: Validate the official Hyprland prerequisite package contract
  ansible.builtin.assert:
    that:
      - >-
        host_desktop_hyprland_prerequisite_packages
        ==
        [
          'hyprland',
          'hypridle',
          'hyprlock',
          'hyprpaper',
          'hyprshutdown',
          'hyprpolkitagent',
          'xdg-desktop-portal',
          'xdg-desktop-portal-hyprland',
          'xdg-desktop-portal-gtk'
        ]
      - "'quickshell' not in host_desktop_hyprland_prerequisite_packages"
      - "'uwsm' not in host_desktop_hyprland_prerequisite_packages"
      - host_desktop_hyprland_input_defaults.keyboard_layout == 'it'
      - >-
        host_desktop_hyprland_input_defaults.keyboard_layout_cycle
        == ['it', 'us', 'ara']
    fail_msg: >-
      Host Hyprland prerequisites no longer match the reviewed official-package
      and input baseline.

- name: Validate host-owned trust semantics
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_trust_contract.owner == 'host'
      - not host_desktop_hyprland_trust_contract.guest_self_assignment
      - host_desktop_hyprland_trust_contract.classes.clean.level == 3
      - host_desktop_hyprland_trust_contract.classes.dev.level == 2
      - host_desktop_hyprland_trust_contract.classes.dirty.level == 1
      - host_desktop_hyprland_trust_contract.classes.lab.level == 0
      - >-
        not
        host_desktop_hyprland_trust_contract.classes.services.gpu_trust_rung
      - >-
        host_desktop_hyprland_trust_contract
        .dirty_seamless_window_requires_host_badge
    fail_msg: >-
      Host Hyprland presentation may consume trust identity but may not weaken,
      redefine or delegate the HyperLab trust contract.

- name: Validate the Quickshell boundary before implementation
  ansible.builtin.assert:
    that:
      - host_desktop_hyprland_shell_target.primary == 'quickshell'
      - host_desktop_hyprland_shell_target.phase == 2
      - not host_desktop_hyprland_shell_target.fake_controls_allowed
      - >-
        host_desktop_hyprland_shell_target.backend_authority
        == ['hyperlabctl', 'specs', 'contracts']
    fail_msg: >-
      Quickshell is a later presentation layer. It must not invent backend
      state or become an operational authority.

- name: Install the official Host Hyprland prerequisite stack
  community.general.pacman:
    name: "{{ host_desktop_hyprland_prerequisite_packages }}"
    state: present

- name: Read installed package facts after prerequisite installation
  ansible.builtin.package_facts:
    manager: auto

- name: Verify every Host Hyprland prerequisite package is installed
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: >-
      Required Host Hyprland prerequisite package {{ item }} is not installed.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_packages }}"

- name: Inspect package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: host_desktop_hyprland_prerequisite_path_stats
  loop: "{{ host_desktop_hyprland_prerequisite_paths }}"
  loop_control:
    label: "{{ item.path }}"

- name: Verify package-owned Host Hyprland prerequisite artifacts
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - >-
        (not item.item.executable)
        or (item.stat.executable | default(false))
    fail_msg: >-
      Required Host Hyprland package artifact {{ item.item.path }} is missing
      or has an invalid executable contract.
    quiet: true
  loop: "{{ host_desktop_hyprland_prerequisite_path_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
