---
schema_version: 1
id: workstation-dev-standard
display_name: Development Workstation (no GPU)
version: "1.0"
# Draft until arch-dev-standard is captured through the Workbench and sealed.
status: draft
class: workstation
image: arch-dev-standard
description: >-
  Everyday Arch development on the dev network without the dedicated GPU,
  with the Guest Workspace Shell on the emulated display. Created from arch-dev
  captured through the Workbench; the account comes from cloud-init and the
  rice from the dev profile playbook.

lifecycles:
  permanent: true
  disposable: false

device_capabilities:
  standard: true
  vfio: false

gpu_handoff_profiles:
  clean: false
  dev: false
  dirty: false
  lab: false

network_allowlist: [dev]

resource_profiles:
  minimum: false
  balanced: true
  performance: true
  custom: true

presentation:
  looking_glass_mode: disabled
  recovery_console: true
  workspace_profile: dev

defaults:
  lifecycle: permanent
  device_capability: standard
  gpu_handoff_profile: null
  network_profile: dev
  resource_profile: balanced
