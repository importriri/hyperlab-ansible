---
- name: Assert the target is Arch Linux
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Archlinux'
    fail_msg: >-
      This brick configures the Arch host that arch-bootstrap builds.
      Refusing to run on os_family={{ ansible_facts['os_family'] }}.

- name: Create the admin user in wheel
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: wheel
    append: true
    shell: /bin/bash
    create_home: true

- name: Install the wheel sudoers drop-in (validated before landing)
  ansible.builtin.copy:
    src: 10-wheel
    dest: /etc/sudoers.d/10-wheel
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# Guest memory the host swaps out must never land on an unencrypted disk:
# only zram (memory) or a dm-crypt mapping may back swap.
- name: Read the active swap devices
  ansible.builtin.slurp:
    src: /proc/swaps
  register: base_swaps

- name: Refuse swap on an unencrypted device
  ansible.builtin.assert:
    that:
      - item is match('^/dev/(zram[0-9]+|mapper/[A-Za-z0-9._-]+)$')
    fail_msg: >-
      Swap on {{ item }} could write guest memory to an unencrypted disk.
      Use zram or swap on a dm-crypt mapping.
    quiet: true
  loop: >-
    {{ (base_swaps.content | b64decode).splitlines()[1:]
       | map('split') | map('first') | list }}

- name: Install kernel hardening sysctls
  ansible.builtin.copy:
    src: 99-hardening.conf
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Enable pacman color output
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*Color$'
    line: Color
    insertafter: '^\[options\]'

- name: Enable pacman parallel downloads
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?\s*ParallelDownloads'
    line: "ParallelDownloads = {{ base_parallel_downloads }}"
    insertafter: '^\[options\]'

- name: Record that the base brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: base
