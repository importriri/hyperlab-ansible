# Converge guests previously contaminated by the host Sway cockpit.
# New golden images normally have none of these packages or paths.
guest_desktop_hyprland_legacy_packages:
  - sway
  - swaybg
  - swayidle
  - swaylock
  - foot
  - xdg-desktop-portal-wlr
  - virt-viewer
  - brightnessctl

guest_desktop_hyprland_legacy_system_paths:
  - /etc/hyperlabctl
  - /etc/ly/hyperlab-startup.sh
  - /etc/privatestack/bricks/desktop
  - /var/lib/privatestack/bricks/desktop
  - /usr/local/bin/hyperlabctl
  - /usr/local/bin/privatestack-cava
  - /usr/local/bin/privatestack-powermenu
  - /usr/local/bin/privatestack-hyperlab
  - /usr/local/bin/privatestack-hyperlab-palette
  - /usr/local/bin/privatestack-hyperlab-domains
  - /usr/local/bin/privatestack-waybar
  - /usr/local/bin/privatestack-fullscreen
  - /usr/local/bin/privatestack-superfile
  - /usr/local/bin/privatestack-opacity-toggle
  - /usr/local/bin/privatestack-theme
  - /usr/local/bin/privatestack-keyboard
  - /usr/local/bin/privatestack-controls
  - /usr/local/bin/privatestack-lock
  - /usr/local/bin/privatestack-compositor-adapter
  - /usr/local/bin/privatestack-swaylock
  - /usr/local/bin/privatestack-swaybar-status
  - /usr/share/applications/hyperlab-control-center.desktop
