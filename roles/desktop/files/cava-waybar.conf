# cava - the strip that feeds the waybar module.
# raw + ascii + max_range 7 gives one digit per bar, which the bridge
# script maps onto the eighth-block glyphs. Keep bars and max_range in
# sync with privatestack-cava: the script assumes 0-7.
[general]
framerate = 30
autosens = 1
bars = 14
sleep_timer = 5

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7

[smoothing]
noise_reduction = 55
