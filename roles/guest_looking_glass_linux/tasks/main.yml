---
- name: Keep the Linux Looking Glass sender behind an explicit experiment gate
  ansible.builtin.assert:
    that:
      - guest_looking_glass_linux_experimental | bool
      - "'workstations' in group_names"
      - "'hypervisor' not in group_names"
      - ansible_facts['virtualization_role'] == 'guest'
      - ansible_facts['os_family'] == 'Archlinux'
      - guest_looking_glass_linux_commit is match('^[0-9a-f]{40}$')
      - guest_looking_glass_linux_build | length > 0
      - >-
        guest_looking_glass_linux_capture_output is
        match('^[A-Za-z0-9._-]+$')
      - guest_looking_glass_linux_capture_max_fps | int > 0
      - guest_looking_glass_linux_capture_max_fps | int <= 240
      - >-
        guest_looking_glass_linux_xdph_picker is
        match('^/usr/local/bin/[A-Za-z0-9._-]+$')
      - >-
        guest_looking_glass_linux_xdph_config ==
        '/home/' ~ admin_user ~ '/.config/hypr/xdph.conf'
    fail_msg: >-
      The Linux Looking Glass sender is an opt-in hardware experiment. Set
      guest_looking_glass_linux_experimental=true only inside a reviewed
      workstation guest; the role never starts the sender automatically.

- name: Install the upstream Linux sender build dependencies
  community.general.pacman:
    name: "{{ guest_looking_glass_linux_packages }}"
    state: present

- name: Clone Looking Glass recursively at the shared source pin
  ansible.builtin.git:
    repo: "{{ guest_looking_glass_linux_repo }}"
    dest: "{{ guest_looking_glass_linux_source }}"
    version: "{{ guest_looking_glass_linux_commit }}"
    recursive: true

- name: Resolve the Linux sender checkout identity
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - "{{ guest_looking_glass_linux_source }}"
      - rev-parse
      - HEAD
  register: guest_looking_glass_linux_resolved_commit
  changed_when: false
  check_mode: false

- name: Resolve the sender-visible build identity
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - "{{ guest_looking_glass_linux_source }}"
      - describe
      - --always
      - --long
      - --abbrev=10
  register: guest_looking_glass_linux_resolved_build
  changed_when: false
  check_mode: false

- name: Require the sender checkout to match the host client pin
  ansible.builtin.assert:
    that:
      - >-
        guest_looking_glass_linux_resolved_commit.stdout | trim ==
        guest_looking_glass_linux_commit
      - >-
        guest_looking_glass_linux_resolved_build.stdout | trim ==
        guest_looking_glass_linux_build
    fail_msg: >-
      The experimental Linux sender must use the exact source and build identity
      already reviewed for the physical-host client.

- name: Read any guest kvmfr module options
  ansible.builtin.slurp:
    src: /etc/modprobe.d/kvmfr.conf
  register: guest_looking_glass_linux_kvmfr_options
  failed_when: false
  changed_when: false

- name: Refuse a static kvmfr device inside the passthrough guest
  ansible.builtin.assert:
    that:
      - >-
        'static_size_mb' not in
        ((guest_looking_glass_linux_kvmfr_options.content | default(''))
         | b64decode)
    fail_msg: >-
      The passthrough guest must bind kvmfr to its PCI IVSHMEM device.
      A static kvmfr allocation would create a second ambiguous transport.

- name: Inspect kvmfr DKMS state for the running kernel
  ansible.builtin.command:
    argv:
      - /usr/bin/dkms
      - status
      - -m
      - kvmfr
      - -v
      - "{{ guest_looking_glass_linux_kvmfr_version }}"
      - -k
      - "{{ ansible_facts['kernel'] }}"
  register: guest_looking_glass_linux_kvmfr_dkms
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install pinned kvmfr for the running guest kernel
  ansible.builtin.command:
    cmd: >-
      /usr/bin/dkms install . -k {{ ansible_facts['kernel'] }}
    chdir: "{{ guest_looking_glass_linux_source }}/module"
  when: >-
    ': installed'
    not in guest_looking_glass_linux_kvmfr_dkms.stdout
  changed_when: true

- name: Load guest kvmfr at boot
  ansible.builtin.copy:
    content: "kvmfr\n"
    dest: /etc/modules-load.d/kvmfr.conf
    owner: root
    group: root
    mode: "0644"

- name: Give the workstation session sole access to guest kvmfr
  ansible.builtin.template:
    src: 70-kvmfr-guest.rules.j2
    dest: /etc/udev/rules.d/70-kvmfr-guest.rules
    owner: root
    group: root
    mode: "0644"

- name: Load guest kvmfr now
  community.general.modprobe:
    name: kvmfr
    state: present

- name: Reload guest kvmfr device policy
  ansible.builtin.command:
    argv:
      - /usr/bin/udevadm
      - control
      - --reload
  changed_when: false

- name: Apply guest kvmfr device policy now
  ansible.builtin.command:
    argv:
      - /usr/bin/udevadm
      - trigger
      - --subsystem-match=kvmfr
      - --action=change
  changed_when: false

- name: Inspect the guest IVSHMEM PCI binding
  ansible.builtin.command:
    argv:
      - /usr/bin/lspci
      - -nnk
      - -d
      - "{{ guest_looking_glass_linux_kvmfr_pci_id }}"
  register: guest_looking_glass_linux_kvmfr_pci
  changed_when: false
  check_mode: false

- name: Inspect the guest kvmfr device
  ansible.builtin.stat:
    path: "{{ guest_looking_glass_linux_kvmfr_device }}"
    follow: false
  register: guest_looking_glass_linux_kvmfr_stat

- name: Require the PCI-backed guest transport
  ansible.builtin.assert:
    that:
      - >-
        'Kernel driver in use: kvmfr'
        in guest_looking_glass_linux_kvmfr_pci.stdout
      - guest_looking_glass_linux_kvmfr_stat.stat.exists | default(false)
      - guest_looking_glass_linux_kvmfr_stat.stat.ischr | default(false)
      - guest_looking_glass_linux_kvmfr_stat.stat.pw_name == admin_user
      - guest_looking_glass_linux_kvmfr_stat.stat.gr_name == admin_user
      - guest_looking_glass_linux_kvmfr_stat.stat.mode == '0600'
    fail_msg: >-
      The Linux sender requires the passed PCI IVSHMEM device to be bound
      to kvmfr and directly readable and writable by the workstation session.

- name: Inspect any previously installed experimental sender
  ansible.builtin.stat:
    path: "{{ guest_looking_glass_linux_binary }}"
    follow: false
  register: guest_looking_glass_linux_existing_binary

- name: Read the experimental sender build stamp
  ansible.builtin.slurp:
    src: "{{ guest_looking_glass_linux_stamp }}"
  register: guest_looking_glass_linux_stamp_read
  failed_when: false
  changed_when: false

- name: Parse the experimental sender build stamp
  ansible.builtin.set_fact:
    guest_looking_glass_linux_stamp_data: >-
      {{ (guest_looking_glass_linux_stamp_read.content | b64decode | from_yaml)
         if guest_looking_glass_linux_stamp_read.content is defined else {} }}

- name: Decide whether the pinned Linux sender needs rebuilding
  ansible.builtin.set_fact:
    guest_looking_glass_linux_build_needed: >-
      {{ guest_looking_glass_linux_stamp_data.commit | default('') !=
         guest_looking_glass_linux_commit or
         guest_looking_glass_linux_stamp_data.build | default('') !=
         guest_looking_glass_linux_build or
         guest_looking_glass_linux_stamp_data.compat_patch_sha256 | default('') !=
         guest_looking_glass_linux_compat_patch_sha256 or
         not (guest_looking_glass_linux_existing_binary.stat.exists | default(false)) or
         not (guest_looking_glass_linux_existing_binary.stat.isreg | default(false)) or
         (guest_looking_glass_linux_existing_binary.stat.islnk | default(false)) or
         not (guest_looking_glass_linux_existing_binary.stat.executable | default(false)) }}

- name: Build the pinned PipeWire-only Linux sender
  when: guest_looking_glass_linux_build_needed | bool
  block:
    - name: Build with the reviewed GCC compatibility patch
      block:
        - name: Require clean pinned portal source before patching
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ guest_looking_glass_linux_source }}"
              - status
              - --porcelain
              - --untracked-files=no
              - --
              - "{{ guest_looking_glass_linux_compat_patch_target }}"
          register: guest_looking_glass_linux_portal_status
          changed_when: false

        - name: Refuse unexpected changes in the pinned portal source
          ansible.builtin.assert:
            that:
              - guest_looking_glass_linux_portal_status.stdout | trim | length == 0
            fail_msg: >-
              The pinned PipeWire portal source has unreviewed local changes.
              Preserve or review them before applying the GCC compatibility patch.

        - name: Stage the reviewed GCC compatibility patch for this rebuild
          ansible.builtin.copy:
            src: "{{ guest_looking_glass_linux_compat_patch }}"
            dest: "{{ guest_looking_glass_linux_compat_patch_remote }}"
            owner: root
            group: root
            mode: "0600"

        - name: Inspect the staged GCC compatibility patch
          ansible.builtin.stat:
            path: "{{ guest_looking_glass_linux_compat_patch_remote }}"
            checksum_algorithm: sha256
          register: guest_looking_glass_linux_compat_patch_stat

        - name: Require the exact reviewed GCC compatibility patch
          ansible.builtin.assert:
            that:
              - >-
                guest_looking_glass_linux_compat_patch_stat.stat.checksum ==
                guest_looking_glass_linux_compat_patch_sha256
            fail_msg: >-
              The staged GCC compatibility patch differs from the bytes
              validated against the pinned Looking Glass source.

        - name: Require the compatibility patch to match the pinned source
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ guest_looking_glass_linux_source }}"
              - apply
              - --check
              - "{{ guest_looking_glass_linux_compat_patch_remote }}"
          changed_when: false

        - name: Apply the reviewed GCC compatibility patch
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ guest_looking_glass_linux_source }}"
              - apply
              - "{{ guest_looking_glass_linux_compat_patch_remote }}"
          register: guest_looking_glass_linux_compat_patch_apply
          changed_when: true

        - name: Configure the upstream Linux host with PipeWire capture
          ansible.builtin.command:
            argv:
              - /usr/bin/cmake
              - -S
              - "{{ guest_looking_glass_linux_source }}/host"
              - -B
              - "{{ guest_looking_glass_linux_build_dir }}"
              - -DCMAKE_BUILD_TYPE=Release
              - -DCMAKE_INSTALL_PREFIX=/usr/local
              - -DOPTIMIZE_FOR_NATIVE=OFF
              - -DUSE_XCB=OFF
              - -DUSE_PIPEWIRE=ON
          changed_when: true

        - name: Compile the experimental Linux sender
          ansible.builtin.command:
            argv:
              - /usr/bin/cmake
              - --build
              - "{{ guest_looking_glass_linux_build_dir }}"
              - --parallel
              - "{{ ansible_facts['processor_vcpus'] | default(2) | string }}"
          changed_when: true

        - name: Install the experimental Linux sender
          ansible.builtin.command:
            argv:
              - /usr/bin/cmake
              - --install
              - "{{ guest_looking_glass_linux_build_dir }}"
          changed_when: true

      always:
        - name: Restore the pinned portal source after the transient build patch
          ansible.builtin.command:
            argv:
              - /usr/bin/git
              - -C
              - "{{ guest_looking_glass_linux_source }}"
              - checkout
              - --
              - "{{ guest_looking_glass_linux_compat_patch_target }}"
          changed_when: false
          when:
            - guest_looking_glass_linux_compat_patch_apply is defined
            - >-
              guest_looking_glass_linux_compat_patch_apply.rc
              | default(1) == 0

        - name: Remove the transient GCC compatibility patch
          ansible.builtin.file:
            path: "{{ guest_looking_glass_linux_compat_patch_remote }}"
            state: absent

    - name: Create the experimental sender stamp directory
      ansible.builtin.file:
        path: "{{ guest_looking_glass_linux_stamp | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record the source identity and disabled runtime state
      ansible.builtin.copy:
        content: |-
          commit: {{ guest_looking_glass_linux_commit }}
          build: {{ guest_looking_glass_linux_build }}
          compat_patch_sha256: {{ guest_looking_glass_linux_compat_patch_sha256 }}
          capture: pipewire
          runtime_enabled: false
        dest: "{{ guest_looking_glass_linux_stamp }}"
        owner: root
        group: root
        mode: "0644"

- name: Inspect the installed experimental sender
  ansible.builtin.stat:
    path: "{{ guest_looking_glass_linux_binary }}"
    follow: false
  register: guest_looking_glass_linux_binary_stat

- name: Require an executable sender without enabling it
  ansible.builtin.assert:
    that:
      - guest_looking_glass_linux_binary_stat.stat.exists | default(false)
      - guest_looking_glass_linux_binary_stat.stat.isreg | default(false)
      - not (guest_looking_glass_linux_binary_stat.stat.islnk | default(false))
      - guest_looking_glass_linux_binary_stat.stat.executable | default(false)
    fail_msg: >-
      The pinned upstream Linux sender did not install as an executable binary.

- name: Inspect the configured capture backend cache
  ansible.builtin.slurp:
    src: "{{ guest_looking_glass_linux_build_dir }}/CMakeCache.txt"
  register: guest_looking_glass_linux_cmake_cache
  changed_when: false

- name: Require PipeWire capture and refuse the XCB fallback
  ansible.builtin.assert:
    that:
      - >-
        'USE_PIPEWIRE:BOOL=ON' in
        (guest_looking_glass_linux_cmake_cache.content | b64decode)
      - >-
        'USE_XCB:BOOL=OFF' in
        (guest_looking_glass_linux_cmake_cache.content | b64decode)

- name: Deploy the disabled-by-default PipeWire sender configuration
  ansible.builtin.template:
    src: looking-glass-host.ini.j2
    dest: "/home/{{ admin_user }}/looking-glass-host.ini"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Install the deterministic XDPH capture picker
  ansible.builtin.template:
    src: xdph-headless-picker.sh.j2
    dest: "{{ guest_looking_glass_linux_xdph_picker }}"
    owner: root
    group: root
    mode: "0755"

- name: Persist the deterministic XDPH capture source
  ansible.builtin.template:
    src: xdph.conf.j2
    dest: "{{ guest_looking_glass_linux_xdph_config }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Record that the guest_looking_glass_linux brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: guest_looking_glass_linux
