---
# `auto` selects the unique profile whose complete PCI ID set is present.
# An explicit profile is still validated against the detected hardware.
host_profile: auto

# Where hardware_probe records the selected physical host profile. Bricks that must know which
# laptop this is, but have no business probing PCI (the cockpit), read the
# file: facts do not survive between playbook runs, a file does.
host_profile_report_path: /etc/privatestack/hardware-profile.yml

host_profiles:
  nitro-3060:
    label: Acer Nitro 5 / RTX 3060 Mobile
    vfio_ids:
      - "10de:2520"
      - "10de:228e"
    desktop:
      keyboard_layout: it
      keyboard_variant: ""
      keyboard_options: ""
      touchpad:
        dwt: enabled
        middle_emulation: enabled
        natural_scroll: enabled
        tap: enabled
    # Memory budget, not a total. MemTotal, running domains and service
    # reservations are read at run time; the four values below are policy and
    # do move when the machine does. max_auto_memory_mb is a hard ceiling for
    # one `memory_mb: auto` candidate, so it caps a guest even when the host
    # has room to spare. See ADR 0007.
    # 16 GiB leaves roughly 13 GiB for the rest of the lab: the three-VM
    # workloads have to fit next to a running VFIO guest.
    memory:
      host_reserved_mb: 2048
      qemu_overhead_per_domain_mb: 512
      services_reserved_mb: 0
      vfio_fixed_overhead_mb: 256
      max_auto_memory_mb: 16384
      standard_overcommit_ratio: 1.0
    # Evidence fields stay null in the public profile until reviewed from a real
    # preflight report. hardware_probe now records them locally without
    # guessing addresses; M2 may promote reviewed values into this contract.
    gpu_pci: null
    gpu_audio_pci: null
    cpu_threads: null
  predator-3070:
    label: Acer Predator Helios 300 / RTX 3070 Mobile
    vfio_ids:
      - "10de:249d"
      - "10de:228b"
    desktop:
      keyboard_layout: it
      keyboard_variant: ""
      keyboard_options: ""
      touchpad:
        dwt: enabled
        middle_emulation: enabled
        natural_scroll: enabled
        tap: enabled
    # Memory budget, not a total. MemTotal, running domains and service
    # reservations are read at run time; the four values below are policy and
    # do move when the machine does. max_auto_memory_mb is a hard ceiling for
    # one `memory_mb: auto` candidate, so it caps a guest even when the host
    # has room to spare. See ADR 0007.
    memory:
      host_reserved_mb: 2560
      qemu_overhead_per_domain_mb: 512
      services_reserved_mb: 0
      vfio_fixed_overhead_mb: 256
      max_auto_memory_mb: 12288
      standard_overcommit_ratio: 1.0
    # Evidence fields stay null in the public profile until reviewed from a real
    # preflight report. hardware_probe now records them locally without
    # guessing addresses; M2 may promote reviewed values into this contract.
    gpu_pci: null
    gpu_audio_pci: null
    cpu_threads: null
