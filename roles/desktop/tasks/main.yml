---
- name: Inspect the configured Hyperlab checkout before host writes
  ansible.builtin.stat:
    path: "{{ desktop_hyperlab_checkout }}/tools/hyperlabctl/bin/hyperlabctl"
  register: desktop_hyperlab_checkout_stat
  changed_when: false

- name: Refuse a checkout that cannot supply the cockpit CLI
  ansible.builtin.assert:
    that:
      - desktop_hyperlab_checkout is string
      - desktop_hyperlab_checkout is match('^/')
      - desktop_hyperlab_checkout_stat.stat.exists | default(false)
      - desktop_hyperlab_checkout_stat.stat.isreg | default(false)
      - not (desktop_hyperlab_checkout_stat.stat.islnk | default(false))
      - desktop_hyperlab_checkout_stat.stat.executable | default(false)
    fail_msg: >-
      desktop_hyperlab_checkout must be an absolute checkout containing an
      executable tools/hyperlabctl/bin/hyperlabctl. Correct the variable before
      installing or repointing the desktop cockpit.

- name: Install the desktop stack
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present

- name: Enable ly on tty2 (starts at next boot - never yank a live TTY)
  ansible.builtin.systemd_service:
    name: ly@tty2.service
    enabled: true

- name: Deploy the cockpit helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: privatestack-cava.sh, dest: privatestack-cava }
    - { src: privatestack-powermenu.sh, dest: privatestack-powermenu }
    - { src: privatestack-hyperlab.sh, dest: privatestack-hyperlab }
    - { src: privatestack-hyperlab-palette.sh, dest: privatestack-hyperlab-palette }
    - { src: hyperlabctl-wrapper.sh, dest: hyperlabctl }

- name: Create the wallpaper directory
  ansible.builtin.file:
    path: /usr/share/backgrounds/privatestack
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the backdrop
  ansible.builtin.copy:
    src: wallpaper.png
    dest: /usr/share/backgrounds/privatestack/mocha.png
    owner: root
    group: root
    mode: "0644"

- name: Create the config directories
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - sway
    - waybar
    - foot
    - mako
    - rofi
    - cava
    - swaylock
    - gtk-3.0

- name: Deploy the Mocha rice
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ admin_user }}/.config/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop:
    - { src: sway.config, dest: sway/config }
    - { src: waybar.jsonc, dest: waybar/config.jsonc }
    - { src: waybar.css, dest: waybar/style.css }
    - { src: foot.ini, dest: foot/foot.ini }
    - { src: mako.conf, dest: mako/config }
    - { src: rofi-config.rasi, dest: rofi/config.rasi }
    - { src: rofi-mocha.rasi, dest: rofi/rofi-mocha.rasi }
    - { src: rofi-launcher.rasi, dest: rofi/rofi-launcher.rasi }
    - { src: rofi-powermenu.rasi, dest: rofi/rofi-powermenu.rasi }
    - { src: rofi-hyperlab.rasi, dest: rofi/rofi-hyperlab.rasi }
    - { src: cava.conf, dest: cava/config }
    - { src: cava-waybar.conf, dest: cava/cava-waybar.conf }
    - { src: swaylock.conf, dest: swaylock/config }
    - { src: gtk3-settings.ini, dest: gtk-3.0/settings.ini }
    - { src: starship.toml, dest: starship.toml }

- name: Create the CLI pointer directory
  ansible.builtin.file:
    path: /etc/hyperlabctl
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point the cockpit at the checkout the CLI must read
  ansible.builtin.copy:
    content: "{{ desktop_hyperlab_checkout }}\n"
    dest: /etc/hyperlabctl/checkout
    owner: root
    group: root
    mode: "0644"

- name: Create the cockpit extension directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.config/hyperlabctl/providers"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Generate shell completion from the subcommands that exist
  become: true
  become_user: "{{ admin_user }}"
  ansible.builtin.command:
    argv:
      - "{{ desktop_hyperlab_checkout }}/tools/hyperlabctl/bin/hyperlabctl"
      - completion
  register: desktop_hyperlab_completion
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the completion, when the CLI could produce one
  ansible.builtin.copy:
    content: "{{ desktop_hyperlab_completion.stdout }}\n"
    dest: /usr/share/bash-completion/completions/hyperlabctl
    owner: root
    group: root
    mode: "0644"
  when: desktop_hyperlab_completion.rc == 0

- name: Read the recorded hardware profile, when this host has one
  ansible.builtin.slurp:
    src: "{{ host_profile_report_path }}"
  register: desktop_hardware_report
  failed_when: false
  changed_when: false

- name: Resolve the per-machine input settings
  ansible.builtin.set_fact:
    desktop_input: >-
      {{ desktop_input_defaults | combine(
           host_profiles[desktop_profile_name].desktop | default({}, true),
           recursive=true)
         if desktop_profile_name in host_profiles
         else desktop_input_defaults }}
  vars:
    desktop_profile_name: >-
      {{ (desktop_hardware_report.content | b64decode | from_yaml).host_profile
         if desktop_hardware_report.content is defined else '' }}

- name: Render the per-machine input configuration
  ansible.builtin.template:
    src: sway-input.conf.j2
    dest: "/home/{{ admin_user }}/.config/sway/input.conf"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

- name: Wire the shell kit into bash (managed block, reversible)
  ansible.builtin.blockinfile:
    path: "/home/{{ admin_user }}/.bashrc"
    create: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    marker: "# {mark} privatestack desktop brick"
    block: |
      eval "$(starship init bash)"
      eval "$(zoxide init bash)"
      alias ls='eza --group-directories-first'
      alias ll='eza -la --group-directories-first'
      alias cat='bat --paging=never'
      alias tree='eza --tree'
      source /usr/share/fzf/key-bindings.bash
      source /usr/share/fzf/completion.bash

- name: Record that the desktop brick landed
  ansible.builtin.include_role:
    name: brick_guard
    tasks_from: stamp
  vars:
    brick_guard_brick: desktop
