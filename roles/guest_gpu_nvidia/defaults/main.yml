---
guest_gpu_nvidia_probe_packages:
  - pciutils

# Ampere follows Arch's supported open-kernel-module branch because DKMS
# must stay aligned with linux-zen. Vendor userspace is intentionally allowed
# in the account-bearing dev workstation; the disposable zero-trust guest is
# the trust boundary for unreviewed software instead.
guest_gpu_nvidia_packages:
  - nvidia-open-dkms
  - nvidia-utils
  - nvidia-settings
  - egl-wayland
  - vulkan-icd-loader

guest_gpu_nvidia_vendor_id: "10de"
guest_gpu_nvidia_modules:
  - nvidia
  - nvidia_modeset
  - nvidia_uvm
  - nvidia_drm
