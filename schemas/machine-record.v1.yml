---
schema_version: 1
kind: machine-record

fields:
  schema_version: {type: int, enum: [1]}

  id:
    type: str
    min_length: 2
    pattern: "^[a-z0-9][a-z0-9-]{1,30}$"

  display_name: {type: str, min_length: 1}

  template:
    type: map
    fields:
      id:
        type: str
        min_length: 1
        pattern: "^[a-z0-9][a-z0-9-]*$"
      version: {type: str, min_length: 1}

  image:
    type: map
    fields:
      id:
        type: str
        min_length: 1
        pattern: "^[a-z0-9][a-z0-9-]*$"
      sha256:
        type: str
        pattern: "^[a-f0-9]{64}$"

  lifecycle: {type: str, enum: [permanent, disposable]}
  device_capability: {type: str, enum: [standard, vfio]}
  gpu_handoff_profile:
    type: str
    nullable: true
    enum: [clean, dev, dirty, lab]
  network_profile: {type: str, domain: true}

  resources:
    type: map
    fields:
      memory_mb: {type: int_or_auto, min: 512, max: 1048576}
      vcpus: {type: int, min: 1, max: 256}
      disk_gib: {type: int, min: 1, max: 4096}

  presentation:
    type: map
    fields:
      looking_glass_mode:
        type: str
        enum: [disabled, windows, linux-experimental]
      recovery_console: {type: bool}
      workspace_profile:
        type: str
        min_length: 1
        pattern: "^[a-z0-9][a-z0-9-]*$"

  owner:
    type: str
    min_length: 1
    pattern: "^[a-z_][a-z0-9_-]{0,30}$"

  created_at:
    type: str
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"

optional:
  purpose: {type: str, min_length: 1}
