# The HyperLab Workstation lock. hyprlock owns the lock on purpose: it is
# a separate program from the Workspace Shell, so a shell crash can never
# leave the session open or unlockable. Colours come from the active guest
# theme through hyprlock-theme.conf.
source = ~/.config/hypr/hyprlock-theme.conf

general {
    hide_cursor = true
    grace = 1
}

background {
    monitor =
    path = $guest_lock_wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# Time.
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $guest_foreground
    font_family = IBM Plex Sans Light
    font_size = 120
    position = 0, 190
    halign = center
    valign = center
}

# Date.
label {
    monitor =
    text = cmd[update:60000] date "+%A %-d %B"
    color = $guest_foreground
    font_family = IBM Plex Sans
    font_size = 20
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = PASSWORD FOR $USER
    color = $guest_foreground
    font_family = IBM Plex Mono
    font_size = 11
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 52
    rounding = 12
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.30
    outer_color = $guest_accent
    inner_color = $guest_surface
    font_color = $guest_foreground
    font_family = IBM Plex Sans
    fade_on_empty = false
    placeholder_text =
    check_color = $guest_accent
    fail_text = Wrong password
    position = 0, -26
    halign = center
    valign = center
}

# Where you were: the Desk and project, from hyperlab-desk.
label {
    monitor =
    text = cmd[update:5000] hyperlab-desk lock-label
    color = $guest_foreground
    font_family = IBM Plex Mono
    font_size = 12
    position = 0, -100
    halign = center
    valign = center
}
